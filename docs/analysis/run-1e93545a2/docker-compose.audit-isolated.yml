services:
  postgres:
    container_name: hydromart-audit-postgres
    ports: !override
      - '127.0.0.1:15432:5432'
  gateway:
    ports: !override
      - '127.0.0.1:18080:8080'
  order:
    ports: !override
      - '127.0.0.1:13004:3004'
  referral:
    ports: !override
      - '127.0.0.1:13011:3011'
  loyalty:
    ports: !override
      - '127.0.0.1:13009:3009'
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: auditstorage
      MINIO_ROOT_PASSWORD: auditstorage-secret-0123456789
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'until mc alias set audit http://storage:9000 auditstorage auditstorage-secret-0123456789; do sleep 1; done; mc mb --ignore-existing audit/hr-docs'
    depends_on:
      - storage
  hr:
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: http://storage:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: hr-docs
      STORAGE_S3_ACCESS_KEY_ID: auditstorage
      STORAGE_S3_SECRET_ACCESS_KEY: auditstorage-secret-0123456789
      STORAGE_PUBLIC_BASE_URL: http://storage:9000/hr-docs
