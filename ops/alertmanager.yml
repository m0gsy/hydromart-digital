# Alertmanager config for the single-VPS stack (T7).
#
# Routes every Prometheus alert (see ops/alert-rules.yml) to the SAME webhook the
# rest of ops already uses (ALERT_WEBHOOK_URL — Slack or Discord). Alertmanager
# does NOT expand env vars in this file, and the URL is a secret, so it is read
# from a file the operator creates (never committed):
#
#   printf '%s' "$ALERT_WEBHOOK_URL" > ops/alertmanager.webhook-url
#
# The file is mounted at /etc/alertmanager/webhook-url (docker-compose.prod.yml)
# and is gitignored. Discord webhooks work with Slack-format payloads at their
# `/slack` suffix — append it to the Discord URL you drop in the file.
route:
  receiver: ops-webhook
  group_by: [alertname, service]
  group_wait: 30s        # let a burst coalesce before the first page
  group_interval: 5m     # ...then batch new alerts in the same group
  repeat_interval: 4h    # re-remind on still-firing alerts every 4h

# Silence the warning latency/lag alerts while a critical for the same service is
# already firing — one page per incident, not three.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [service]

receivers:
  - name: ops-webhook
    slack_configs:
      - api_url_file: /etc/alertmanager/webhook-url
        channel: '#ops'   # ignored by Discord; Slack incoming-webhooks pin their own channel
        send_resolved: true
        title: '{{ .CommonLabels.severity | toUpper }}: {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.description }}
          {{ end }}
