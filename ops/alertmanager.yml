# Alertmanager config for the single-VPS stack (T7).
#
# Routes every Prometheus alert (see ops/alert-rules.yml) to the SAME webhook the
# rest of ops already uses (ALERT_WEBHOOK_URL — Slack or Discord). Alertmanager
# does NOT expand env vars in this file, and the URL is a secret, so it is read
# from a file the operator creates (never committed):
#
#   printf '%s' "$ALERT_WEBHOOK_URL" > ops/alertmanager.webhook-url
#
# The file is mounted at /etc/alertmanager/webhook-url (docker-compose.prod.yml)
# and is gitignored. Discord webhooks work with Slack-format payloads at their
# `/slack` suffix — append it to the Discord URL you drop in the file.
route:
  receiver: ops-webhook
  group_by: [alertname, service]
  group_wait: 30s        # let a burst coalesce before the first page
  group_interval: 5m     # ...then batch new alerts in the same group
  repeat_interval: 4h    # re-remind on still-firing alerts every 4h
  # A SECOND channel for CRITICAL alerts (2026-09-25 owner decision): one webhook, one channel, one
  # person was the whole alerting path. `continue: true` sends a critical to the secondary AND then
  # falls through to the catch-all below, so the primary still gets everything it always did.
  # Warnings go to the primary only. The secondary's URL lives in a FILE that may be empty or absent:
  # this Alertmanager loads such a config fine and fails only that receiver's notification, so a
  # missing second channel never takes alerting down (proven with amtool in scripts/check-alertmanager-config.sh).
  routes:
    - matchers: [severity="critical"]
      receiver: ops-webhook-secondary
      continue: true
    - receiver: ops-webhook

# Silence the warning latency/lag alerts while a critical for the same service is
# already firing — one page per incident, not three.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [service]

receivers:
  - name: ops-webhook
    slack_configs:
      - &slack
        api_url_file: /etc/alertmanager/webhook-url
        channel: '#ops'   # ignored by Discord; Slack incoming-webhooks pin their own channel
        send_resolved: true
        # Empty on purpose. Alertmanager builds this from --web.external-url, which is
        # unset here, so it produced `http://<container-id>:9093/#/alerts` — a Docker
        # container hostname. Discord validates the URL and answers
        # `400 {"attachments": ["0"]}`, so EVERY notification was dropped; the link was
        # also unopenable by anyone, being an address that only exists inside the compose
        # network. Proven by bisecting the captured payload field by field against the
        # real webhook: with title_link the post is refused, without it, accepted.
        # N12: the container now runs with --web.external-url (docker-compose.prod.yml),
        # so this can finally carry a link a person can open. It is still built from the
        # variable rather than hardcoded, and an operator who leaves the default gets
        # localhost:9093 — right for an SSH tunnel, useless in a group chat. That is a
        # deliberate default: a wrong-but-plausible public URL would be worse.
        title_link: '{{ template "__alertmanagerURL" . }}'
        title: '{{ .CommonLabels.severity | toUpper }}: {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.description }}
          {{ end }}

  # The second channel. Same payload as the first (the anchor above), a different file. Written by
  # scripts/set-alert-channel.sh (Deploy -> alert-channel-2) into ops/alertmanager-secondary/, a
  # DIRECTORY mount: a missing single-file bind source becomes a root-owned directory the moment
  # compose creates the container, and a script can then never fill it in.
  - name: ops-webhook-secondary
    slack_configs:
      - <<: *slack
        api_url_file: /etc/alertmanager/secondary/webhook-url
