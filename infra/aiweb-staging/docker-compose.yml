# The AI web's STAGING copy (D3 staging): the same hydromart-ai app, migration job and n8n as
# infra/aiweb/docker-compose.yml, in a compose project of their own, beside hydromart and the
# production AI web on the production box, behind a login at https://staging-ai.hydromart-digital.com.
# scripts/aiweb-staging-deploy.sh starts it after every deploy (DEPLOY.md, "The staging AI web").
#
# What staging has that production does not: SYNTHETIC everything. A fake hydromart
# (infra/aiweb-staging/mock/) plays hydromart-digital's sign-in and API, with made-up people; n8n's
# workflows are pointed at it (n8n-rewrite.mjs); its database is its own. No production secret, no
# production data and no way to reach production: its networks are internal (no way off the box)
# and none is `edge` or hydromart's. The mock needs no image of its own: it runs on the app image.
#
# A RELEASE IS THIS FILE, as for production, and it is the file that runs AHEAD of production:
# to try a new hydromart-ai commit, change the three digests below (the app, the migration job and
# n8n, as hydromart-ai's CI prints them) in a PR here; the deploy after its merge runs it on
# staging. Once it has been tried, a second PR copies the same three digests into
# infra/aiweb/docker-compose.yml (scripts/check-aiweb-promotion.mjs warns when a production pin was
# never pinned here first). Staging has no backup: its data is made up and `staging-reset` (the
# Deploy workflow's mode) starts it again from nothing.
#
# Pinned now: hydromart-ai 9702c62 (AI-15 #37 the full claims registry: prospectus versions, official-number claims, legal review record, usage and replacement, migration 20261128170000_ai15a_claims_full; #38 the legal review screens /klaim/hukum, the export for the legal reviewer and claim expiry reminders, no migration; #36 the n8n drift check in one export call; images of main CI run 46125167192); before it, c33f3ec (#36, the n8n drift check exports every published version in one n8n call, so the 18 workflows fit the probe's 300 s; no migration, no workflow change; images of main CI run 46117052335); before it, cdacb1a (AI-16 #31 the depot business simulation for Sales, migration 20261128120000_ai16_simulations; AI-14 #32 the public calon mitra lead form, closed until its env is set, the Sales queue and the follow-up SLA, migration 20261128130000_ai14_lead_sla, n8n ai-lead-submitted / ai-lead-overdue / ai-lead-sla; AI-21 #33 the Supervisor, Keuangan and SDM assistants, migration 20261128140000_ai21_assistants; AI-30 #34 the claims registry, the content calendar and the Konten agent, migration 20261128150000_ai30a_claims_content, n8n ai-content-plan; #35 the competitor register and the Riset Pasar weekly summary, migration 20261128160000_ai30b_competitors, n8n ai-competitor-weekly; no ads; images of main CI run 46091319493); before it, 5e4632b (AREA-5 #30, the Halaman Wilayah at /wilayah with the corrected potential formula and the Excel sheets 06-10 at /wilayah/unduh; no migration; images of main CI run 46050530717); before it, 0a7e766 (AREA-4 market data: the monthly upload at /data-pasar/unggah, the table at /data-pasar and the assumptions at /data-pasar/asumsi, migration 20261127190000_area4_market_data, #29; images of main CI run 46003441654); before it, decf2d2 (AI-LLM2 two Anthropic keys, the primary chosen by SUPER_ADMIN at /tim-ai/kunci-llm, one retry on the other when credit runs out, #27; AREA-T2 the open-data prospect tool part 2, #28; the no-legal-entity note copy, #26; images of main CI run 45969268560); before it, b871bcf (AI-12b the approval inbox: /inbox for every approval waiting on the signed-in person, due times, in-app escalation every 30 minutes and the quality-hold rule check, #24; images of main CI run 45943139441); before it, a5ba94f (AI-12a the depot quality-hold state, the hold notice and the daily permit and lab-test reminder, #23); before it, 667cebd (AI-26 the weekly Sales report for the calon mitra CRM, #21; AI-29/AI-31 the agent team: registry, caps, switches, the Keuangan agent, #22); before it, 951fe29 (AI-13, the calon mitra CRM: #18 schema, legal-entity row security, screens, editable lead score; #20 draft depot at hydromart, the depot.onboarded handler and the import of old /waralaba applications); before it, d5b791f (the league ranks a depot with a monthly target on its pace against it, #17; on 8fbe25c: n8n: customer reminders 17.00, 10.00 and every 10 minutes, the 07.30 maintenance sweep, record-only readers for order and stock events; on bd6de7e's read screens), ahead of production (CI run 45846506199).
#
# Isolation, held by scripts/check-aiweb-staging-compose.mjs in CI and proved on the box after every
# deploy by the probe in scripts/aiweb-staging-deploy.sh:
#   - its own project name, so hydromart's `up --remove-orphans` never takes it for an orphan, and
#     docker-gc and the firewall read this `name:`;
#   - `private` is internal (the database, the mock, the app, n8n); `edge-staging` is internal too
#     and is where Caddy reaches the app and the mock (hydromart's compose file makes it). Neither
#     is `edge`: a container named like production's there would take production's traffic;
#   - the app's name for hydromart is Caddy's own address on `edge-staging` (an alias of the
#     staging host name), so every call "to hydromart" is answered by the mock and none leaves the box;
#   - only n8n publishes a port, its editor, on the box's loopback (an ssh tunnel reaches it), and
#     for that it alone sits on `tunnel`, a network with a way out;
#   - the box's ssh answers nothing from any of these networks (scripts/aiweb-firewall.sh);
#   - only STAGING_* keys of .env are interpolated here: no key of hydromart's or production's AI
#     web can reach a container of this project.
name: hydromart-ai-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  db:
    # The image hydromart's own Postgres and the production AI web run, so the box holds it.
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    cpus: 0.25
    environment:
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?set by scripts/aiweb-staging-secrets.sh}
      # Read by infra/aiweb/roles.sql and app-role.sql (psql \getenv), which are shared with the
      # production AI web: the names inside the container are theirs, the values are staging's.
      AIWEB_DB_OWNER_PASSWORD: ${STAGING_DB_OWNER_PASSWORD:?set by scripts/aiweb-staging-secrets.sh}
      AIWEB_DB_APP_PASSWORD: ${STAGING_DB_APP_PASSWORD:?set by scripts/aiweb-staging-secrets.sh}
      AIWEB_N8N_DB_PASSWORD: ${STAGING_N8N_DB_PASSWORD:?set by scripts/aiweb-staging-secrets.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # One shot, before every app start: `prisma migrate deploy` as ai_owner.
  migrate:
    image: ghcr.io/m0gsy/hydromart-ai@sha256:9e075b0c2f60580ca71598434b6d2e3e23fe54743b2d206d25674f5edff61b18
    profiles: ["migrate"]
    logging: *logging
    mem_limit: 384m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql://ai_owner:${STAGING_DB_OWNER_PASSWORD:?set by scripts/aiweb-staging-secrets.sh}@db:5432/ai
    networks:
      - private
    depends_on:
      db: { condition: service_healthy }

  # The service is not called `aiweb`: Caddy reaches it by this name over `edge-staging`. Its
  # alias `aiweb` exists on `private` only, where n8n's workflows and the mock name it.
  staging-aiweb:
    image: ghcr.io/m0gsy/hydromart-ai@sha256:a3b1938ec4d9cd7e8d7fb5e2c9191c0a48b59e99bcb5e5422063e8ebe8852b1d
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql://ai_app:${STAGING_DB_APP_PASSWORD:?set by scripts/aiweb-staging-secrets.sh}@db:5432/ai
      # All three are the staging host: the sign-in page and the API are the mock, served by Caddy
      # on the same origin (infra/caddy/sites/staging-ai.caddy).
      AI_WEB_URL: https://staging-ai.hydromart-digital.com
      HYDROMART_WEB_URL: https://staging-ai.hydromart-digital.com
      HYDROMART_API_URL: https://staging-ai.hydromart-digital.com
      HD_EVENT_SECRET: ${STAGING_HD_EVENT_SECRET:?set by scripts/aiweb-staging-secrets.sh}
      N8N_URL: http://n8n:5678
      N8N_TOKEN: ${STAGING_N8N_TOKEN:?set by scripts/aiweb-staging-secrets.sh}
      # The mock takes the alarms: nothing of staging posts to the channel production's alerts use.
      ALERT_WEBHOOK_URL: http://hydromart-mock:9911/alert
      # AI-14: the public form stays closed on staging until these are set (blank legal entity = 503).
      LEAD_FORM_LEGAL_ENTITY_ID: ${STAGING_LEAD_FORM_LEGAL_ENTITY_ID:-}
      LEAD_FORM_SECRET: ${STAGING_LEAD_FORM_SECRET:-}
      LEAD_FORM_WA_NUMBER: ${STAGING_LEAD_FORM_WA_NUMBER:-}
      LEAD_FORM_ORIGINS: ${STAGING_LEAD_FORM_ORIGINS:-}
    networks:
      edge-staging: {}
      private:
        aliases:
          - aiweb
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # The fake hydromart (infra/aiweb-staging/mock/server.mjs), on the app image: node is there and
  # nothing else is needed. The file is mounted read-only from this checkout.
  hydromart-mock:
    image: ghcr.io/m0gsy/hydromart-ai@sha256:a3b1938ec4d9cd7e8d7fb5e2c9191c0a48b59e99bcb5e5422063e8ebe8852b1d
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    cpus: 0.1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    entrypoint: ["node", "/mock/server.mjs"]
    volumes:
      - ./mock:/mock:ro
    environment:
      MOCK_PORT: "9911"
      MOCK_AI_WEB_URL: https://staging-ai.hydromart-digital.com
      MOCK_INGRESS_URL: http://aiweb:3000/api/ingress/hd
      # Number 2 (AI-10): blank = no "send a WhatsApp message" button; set it to the app secret the staging AI web holds.
      MOCK_WA2_APP_SECRET: ${STAGING_WA2_APP_SECRET:-}
      MOCK_WA2_INGRESS_URL: http://aiweb:3000/api/ingress/wa
      MOCK_SIGNING_KEY: ${STAGING_MOCK_SIGNING_KEY:?set by scripts/aiweb-staging-secrets.sh}
      MOCK_HD_EVENT_SECRET: ${STAGING_HD_EVENT_SECRET:?set by scripts/aiweb-staging-secrets.sh}
      MOCK_MACHINE_ID: ${STAGING_N8N_MACHINE_ID:?set by scripts/aiweb-staging-secrets.sh}
      MOCK_MACHINE_SECRET: ${STAGING_N8N_MACHINE_SECRET:?set by scripts/aiweb-staging-secrets.sh}
    networks:
      - edge-staging
      - private
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:9911/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s

  # n8n, the production image and its locked settings. Its workflows name hydromart's public API;
  # n8n-rewrite.mjs (below) points the copy staging imports at the mock, and the image's
  # N8N_SSRF_ALLOWED_HOSTNAMES is widened by exactly the mock's name.
  n8n:
    image: ghcr.io/m0gsy/hydromart-ai@sha256:a8979d7fe16309bb38567cdb4cdf52ec4fd524210313cd661356b9972e64fbb0
    restart: unless-stopped
    logging: *logging
    mem_limit: 700m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /home/node/.n8n:uid=1000,gid=1000,mode=0700,size=128m
    volumes:
      - ./n8n-rewrite.mjs:/staging/n8n-rewrite.mjs:ro
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${STAGING_N8N_DB_PASSWORD:?set by scripts/aiweb-staging-secrets.sh}
      N8N_ENCRYPTION_KEY: ${STAGING_N8N_ENCRYPTION_KEY:?set by scripts/aiweb-staging-secrets.sh}
      N8N_EDITOR_BASE_URL: http://localhost:5679
      N8N_SSRF_ALLOWED_HOSTNAMES: aiweb,hydromart-mock
    networks:
      - private
      - tunnel
    # The editor, on the box's loopback and nowhere else (production's is 5678): `ssh -L
    # 5679:127.0.0.1:5679` reaches it.
    ports:
      - "127.0.0.1:5679:5678"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # One shot, in every deploy while n8n is stopped: n8n-rewrite.mjs makes the copy of the image's
  # n8n/ with hydromart's address replaced by the mock's, then setup.mjs imports THAT.
  n8n-setup:
    image: ghcr.io/m0gsy/hydromart-ai@sha256:a8979d7fe16309bb38567cdb4cdf52ec4fd524210313cd661356b9972e64fbb0
    profiles: ["n8n-setup"]
    logging: *logging
    mem_limit: 700m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["node", "/staging/n8n-rewrite.mjs", "node", "/opt/hydromart/bin/setup.mjs"]
    tmpfs:
      - /home/node/.n8n:uid=1000,gid=1000,mode=0700,size=128m
      - /tmp:size=64m
    volumes:
      - ./n8n-rewrite.mjs:/staging/n8n-rewrite.mjs:ro
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${STAGING_N8N_DB_PASSWORD:?set by scripts/aiweb-staging-secrets.sh}
      N8N_ENCRYPTION_KEY: ${STAGING_N8N_ENCRYPTION_KEY:?set by scripts/aiweb-staging-secrets.sh}
      N8N_SETUP_AIWEB_TOKEN: ${STAGING_N8N_TOKEN:?set by scripts/aiweb-staging-secrets.sh}
      N8N_SETUP_MACHINE_ACCOUNT_ID: ${STAGING_N8N_MACHINE_ID:?set by scripts/aiweb-staging-secrets.sh}
      N8N_SETUP_MACHINE_SECRET: ${STAGING_N8N_MACHINE_SECRET:?set by scripts/aiweb-staging-secrets.sh}
    networks:
      - private
    depends_on:
      db: { condition: service_healthy }

networks:
  # Created by hydromart's docker-compose.prod.yml (internal; Caddy answers on it to the staging
  # host name). Caddy, the app and the mock are its only members; the probe says so after each deploy.
  edge-staging:
    external: true
  # The database's network, and where the app, the mock and n8n talk. No way off the box.
  private:
    internal: true
  # n8n's alone: Docker cannot publish a port from a container on internal networks only.
  tunnel: {}

volumes:
  pgdata:
