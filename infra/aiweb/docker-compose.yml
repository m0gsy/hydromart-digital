# The AI web (Plan Eksekusi HD-9): the m0gsy/hydromart-ai app, its own Postgres and its migration
# job, run on the production box as a SECOND compose project beside hydromart (HD-1). It is
# started by scripts/aiweb-deploy.sh, which scripts/deploy.sh runs after every hydromart deploy
# passes its gate. DEPLOY.md, "The AI web", says how to operate it. AI-5 adds n8n beside it:
# hydromart's events reach the app, the app hands them to n8n, and n8n acts on hydromart only
# through its public API with a machine account (DEPLOY.md, "n8n").
#
# A RELEASE IS THIS FILE. The three ghcr.io/m0gsy/hydromart-ai digests below are the app, the
# migration job and n8n (the n8n service and its setup job run the same image) the box runs;
# hydromart-ai's CI prints all three for every commit on its main ("Pin these in
# hydromart-digital's infra/aiweb/"). To ship one, change those lines in a PR here; the deploy
# after its merge pulls them by digest, migrates, sets n8n up, then swaps the app and n8n. The box
# never builds this app and never follows a tag. To go back, revert that PR: a migration it
# applied stays applied, so every AI web migration must be expand/contract (the release before it
# must still run on the new schema).
#
# Pinned now: hydromart-ai 9702c62 (AI-15 #37 the full claims registry: prospectus versions, official-number claims, legal review record, usage and replacement, migration 20261128170000_ai15a_claims_full; #38 the legal review screens /klaim/hukum, the export for the legal reviewer and claim expiry reminders, no migration; #36 the n8n drift check in one export call; images of main CI run 46125167192); before it, cdacb1a (AI-16 #31 the depot business simulation for Sales, migration 20261128120000_ai16_simulations; AI-14 #32 the public calon mitra lead form, closed until its env is set, the Sales queue and the follow-up SLA, migration 20261128130000_ai14_lead_sla, n8n ai-lead-submitted / ai-lead-overdue / ai-lead-sla; AI-21 #33 the Supervisor, Keuangan and SDM assistants, migration 20261128140000_ai21_assistants; AI-30 #34 the claims registry, the content calendar and the Konten agent, migration 20261128150000_ai30a_claims_content, n8n ai-content-plan; #35 the competitor register and the Riset Pasar weekly summary, migration 20261128160000_ai30b_competitors, n8n ai-competitor-weekly; no ads; images of main CI run 46091319493); before it, 5e4632b (AREA-5 #30, the Halaman Wilayah at /wilayah with the corrected potential formula and the Excel sheets 06-10 at /wilayah/unduh, no migration; images of main CI run 46050530717, staging since #1154); before it, 0a7e766 (AREA-4 #29, market data: the monthly upload at /data-pasar/unggah, the table at /data-pasar and the assumptions at /data-pasar/asumsi, migration 20261127190000_area4_market_data; images of main CI run 46003441654, staging since #1150); before it, decf2d2 (AI-LLM2 #27, two Anthropic keys, the primary chosen by SUPER_ADMIN at /tim-ai/kunci-llm, one retry on the other when credit runs out; AREA-T2 #28, the open-data prospect tool part 2, which runs on the IT laptop and is not served; #26, the no-legal-entity note names both causes; images of main CI run 45969268560); before it, b871bcf (AI-12a #23, the depot quality-hold state, the hold notice to staff and the daily permit and lab-test reminder; AI-12b #24, the approval inbox with due times, in-app escalation every 30 minutes and the quality-hold rule check; images of main CI run 45943139441); before it, 667cebd (AI-26 #21, the weekly Sales report of the calon mitra CRM; AI-29/AI-31 #22, the agent team: registry, caps, switches with boss locks, playbooks, weekly targets and the Keuangan agent with its own read-only machine account; images of main CI run 45846506199); before it, 951fe29 (AI-13, the calon mitra CRM: #18 schema, legal-entity row security, screens, editable lead score; #20 draft depot at hydromart, the depot.onboarded handler and the import of old /waralaba applications); before it, hydromart-ai d5b791f on its main (#16 the n8n customer reminders 17.00, 10.00 and every
# 10 minutes, and the 07.30 maintenance sweep; #17 the league ranks a depot with a monthly target on
# its pace against it; before them, as of bd6de7e: AI-5 #8, #9/#10: n8n keeps a failed run about 72
# hours for the editor; #11 the three-channel lint; #12 AI-8's guarded LLM adapter, no key, nothing
# calls a model yet; #13 AI-9's n8n morning summary at 07.00 WIB; #14 AI-7b's Ringkasan, depot league
# and depot page on the read API; #15 AI-7d's "Minta akses" with its access_requests table and the
# n8n workflow ai-access-request): the app, its migration job and the n8n image, all three from that
# commit, pinned on staging first (infra/aiweb-staging/).
#
# Isolation, held by scripts/check-aiweb-compose.mjs in CI and proved on the box after every
# deploy by the probe in scripts/aiweb-deploy.sh:
#   - its own project name, so hydromart's `up --remove-orphans` never takes it for an orphan
#     and docker-gc (which reads this `name:`) leaves its images alone;
#   - `aiweb` joins `edge` (Caddy's side door, infra/caddy/sites/aiweb.caddy) and `private`;
#     `n8n` joins `private` and `egress`, its own way out; the database and the one-shot jobs
#     join `private` only, which is internal: no way out;
#   - no service publishes a host port but n8n's editor, on the box's loopback only (reached
#     through an ssh tunnel), and none joins hydromart's own network;
#   - the box's own ssh (TCP 22) answers nothing from edge, private or egress: closed by
#     scripts/aiweb-firewall.sh at boot, every 5 minutes, and in every deploy before any container
#     here starts (DEPLOY.md, "The host's ssh, closed to the AI web");
#   - only AIWEB_* keys of .env are interpolated here, and ALERT_WEBHOOK_URL for the app's alarms:
#     none of hydromart's secrets (JWT_ACCESS_SECRET, INTERNAL_SERVICE_KEY, ...) can be handed to
#     a container here.
#
# The passwords and keys are made on the box by scripts/aiweb-secrets.sh (only when their line is
# absent from .env, never printed) and travel with .env in its encrypted nightly backup.
name: hydromart-ai

# The same cap as docker-compose.prod.yml and ops/docker-daemon.json (check-compose-logging.mjs).
x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  db:
    # The image hydromart's own Postgres runs (16.16, read off the box 2026-11-23), so the box
    # already holds it. hydromart-ai's CI tests against postgres:16-alpine.
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 0.5
    environment:
      # The superuser's. The image needs one to create the cluster, and roles.sql keeps it in step
      # with .env. scripts/aiweb-deploy.sh applies roles.sql as the superuser over the container's
      # local socket; neither the app nor the migration job ever uses that role.
      POSTGRES_PASSWORD: ${AIWEB_POSTGRES_PASSWORD:?set by scripts/aiweb-secrets.sh}
      # Read through psql's \getenv, so no password is ever on a command line: the owner's and
      # n8n's by roles.sql before the migration, the app's by app-role.sql only after it succeeded.
      AIWEB_DB_OWNER_PASSWORD: ${AIWEB_DB_OWNER_PASSWORD:?set by scripts/aiweb-secrets.sh}
      AIWEB_DB_APP_PASSWORD: ${AIWEB_DB_APP_PASSWORD:?set by scripts/aiweb-secrets.sh}
      AIWEB_N8N_DB_PASSWORD: ${AIWEB_N8N_DB_PASSWORD:?set by scripts/aiweb-secrets.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      # Over TCP, not the socket: during the first initialisation the image runs a temporary
      # server on the socket only, and that one must not count as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # One shot, before every app start: `prisma migrate deploy` as ai_owner, the role that owns
  # database ai. A profile keeps it out of `up`; scripts/aiweb-deploy.sh runs it with `run --rm`.
  migrate:
    image: ghcr.io/m0gsy/hydromart-ai@sha256:9e075b0c2f60580ca71598434b6d2e3e23fe54743b2d206d25674f5edff61b18
    profiles: ["migrate"]
    logging: *logging
    mem_limit: 512m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql://ai_owner:${AIWEB_DB_OWNER_PASSWORD:?set by scripts/aiweb-secrets.sh}@db:5432/ai
    networks:
      - private
    depends_on:
      db: { condition: service_healthy }

  aiweb:
    image: ghcr.io/m0gsy/hydromart-ai@sha256:a3b1938ec4d9cd7e8d7fb5e2c9191c0a48b59e99bcb5e5422063e8ebe8852b1d
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # ai_app: row privileges only. As the owner, a superuser or a BYPASSRLS role the app
      # answers /api/health with 503, and the deploy reports the AI web as not deployed.
      DATABASE_URL: postgresql://ai_app:${AIWEB_DB_APP_PASSWORD:?set by scripts/aiweb-secrets.sh}@db:5432/ai
      # Origins only (hydromart-ai README, "Sign-in"). auth-service's AI_WEB_RETURN_URL is this
      # plus /masuk/callback (scripts/aiweb-secrets.sh writes it from here), and the Caddy site
      # serves this host (scripts/check-aiweb-compose.mjs holds the three together).
      AI_WEB_URL: https://ai.hydromart-digital.com
      HYDROMART_WEB_URL: https://hydromart-digital.com
      # Reached the way a browser reaches it, through Caddy on the public address: the AI web
      # has no other way into hydromart.
      HYDROMART_API_URL: https://api.hydromart-digital.com
      # AI-5 (hydromart-ai README, "Events and n8n"). The signing secret /hq/webhooks showed once
      # when <AI_WEB_URL>/api/ingress/hd was registered, put in .env by the owner; blank, the
      # ingress answers 503 and hydromart keeps the events in its own outbox. The _NEXT one is
      # only set during a rotation (DEPLOY.md, "n8n").
      HD_EVENT_SECRET: ${AIWEB_HD_EVENT_SECRET:-}
      HD_EVENT_SECRET_NEXT: ${AIWEB_HD_EVENT_SECRET_NEXT:-}
      # n8n on the private network, and the token between the two, both ways: this app shows it
      # to n8n's webhooks, n8n shows it to /api/internal/n8n/* (n8n-setup stores it in n8n).
      N8N_URL: http://n8n:5678
      N8N_TOKEN: ${AIWEB_N8N_TOKEN:?set by scripts/aiweb-secrets.sh}
      # The one hydromart key this file reads (check-aiweb-compose.mjs allows exactly this one,
      # here and nowhere else): the AI web posts its alarms to the channel hydromart's alerts use.
      # Blank, they go to its log only.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # AI-31: the AI web's OWN machine account at auth-service (read-only, scope aiReadAgent), for the
      # agents' scheduled reads of the AI read API. The app trades the pair at POST /auth/api/v1/auth/machine/token.
      # Made, rotated and switched off by scripts/aiweb-secrets.sh (blank secret = off); the app alone gets
      # it, and never n8n's (check-aiweb-compose.mjs). Absent until the release holds aiReadAgent: blank = no agent reads.
      HYDROMART_MACHINE_ID: ${AIWEB_APP_MACHINE_ID:-}
      HYDROMART_MACHINE_SECRET: ${AIWEB_APP_MACHINE_SECRET:-}
      # AI-8 (hydromart-ai README, "LLM (AI-8)"). Vendor: Anthropic (owner, 27 Nov 2026). The key
      # is the owner's: the Console org linked to the Claude Max plan, whose monthly API credits
      # stop the API when spent and are never billed (ENV_SET_BLOCK, deploy mode env-set, then
      # deploy). Not the vendor's usual name on purpose: a tool on the box that reads
      # ANTHROPIC_API_KEY never bills this account. Staging gets no key.
      LLM_ANTHROPIC_API_KEY: ${AIWEB_LLM_ANTHROPIC_API_KEY:-}
      # AI-LLM2 (owner, 27 Nov 2026): the second key, pay-per-use, is the Hermes key (its own
      # Console org). SUPER_ADMIN picks which key goes first at /tim-ai/kunci-llm; when that one
      # is out of credit the app retries once on the other and rests the empty one for an hour.
      # Both blank, the app refuses every LLM call; one blank, it runs on the other alone.
      LLM_ANTHROPIC_API_KEY_PAYG: ${HERMES_ANTHROPIC_API_KEY:-}
      # Mixed routing (owner, 27 Nov 2026): Tanya AI (`ask`), which a person reads at once, on
      # Claude Sonnet 5.5; every other purpose (the agents' scheduled reports and drafts, `*`) on
      # Claude Haiku 5.5, about 20x cheaper per token (src/lib/llm/prices.ts). The spend caps
      # (Rp1,5 jt team, Rp375.000 per agent) refuse a call past them, they never overspend.
      # A purpose moves to another model by PR here. No vendor receives personal data until the
      # owner approves one (a DPA, the transfer register and a DPIA). The rupiah rate is rounded UP
      # from the plan's 16.500, so the spend caps (Tim AI) trip early rather than late.
      LLM_ROUTES: "ask=anthropic:claude-sonnet-5-5,*=anthropic:claude-haiku-5-5"
      LLM_PERSONAL_DATA_VENDORS: ""
      LLM_USD_IDR: "17000"
      # AI-14 (hydromart-ai README, "Formulir publik"): the public calon mitra form at /daftar-mitra.
      # Blank LEAD_FORM_LEGAL_ENTITY_ID (the franchisor entity the lead belongs to) keeps the form
      # CLOSED (503); the owner sets it with ENV_SET_BLOCK after confirming the consent wording.
      # LEAD_FORM_SECRET signs the page's form token (made by scripts/aiweb-secrets.sh, like
      # AIWEB_N8N_TOKEN); LEAD_FORM_WA_NUMBER is Sales' public number for the thank-you button;
      # LEAD_FORM_ORIGINS lists extra origins allowed to post (comma separated, blank = same origin only).
      LEAD_FORM_LEGAL_ENTITY_ID: ${AIWEB_LEAD_FORM_LEGAL_ENTITY_ID:-}
      LEAD_FORM_SECRET: ${AIWEB_LEAD_FORM_SECRET:-}
      LEAD_FORM_WA_NUMBER: ${AIWEB_LEAD_FORM_WA_NUMBER:-}
      LEAD_FORM_ORIGINS: ${AIWEB_LEAD_FORM_ORIGINS:-}
      # hydromart-ai WhatsApp number 2 (WA2_*) and 3, the Sales line (WA3_*), Meta Lead Ads (META_LEADS_*) and the
      # public site's footer and AI origin: pass-through only, all blank (= off) until the owner sets them with
      # ENV_SET_BLOCK. SITE_MODE is NOT set here: the site stays a 404 in production until its own PR.
      WA2_ENABLED: ${AIWEB_WA2_ENABLED:-}
      WA2_ACCESS_TOKEN: ${AIWEB_WA2_ACCESS_TOKEN:-}
      WA2_APP_SECRET: ${AIWEB_WA2_APP_SECRET:-}
      WA2_APP_SECRET_NEXT: ${AIWEB_WA2_APP_SECRET_NEXT:-}
      WA2_VERIFY_TOKEN: ${AIWEB_WA2_VERIFY_TOKEN:-}
      WA2_PHONE_NUMBER_ID: ${AIWEB_WA2_PHONE_NUMBER_ID:-}
      WA2_WABA_ID: ${AIWEB_WA2_WABA_ID:-}
      WA2_GRAPH_VERSION: ${AIWEB_WA2_GRAPH_VERSION:-}
      WA2_GRAPH_URL: ${AIWEB_WA2_GRAPH_URL:-}
      WA2_LEGAL_ENTITY_ID: ${AIWEB_WA2_LEGAL_ENTITY_ID:-}
      WA2_PUBLIC_E164: ${AIWEB_WA2_PUBLIC_E164:-}
      WA2_PEER_MAX_AGE_SECONDS: ${AIWEB_WA2_PEER_MAX_AGE_SECONDS:-}
      WA3_ENABLED: ${AIWEB_WA3_ENABLED:-}
      WA3_ACCESS_TOKEN: ${AIWEB_WA3_ACCESS_TOKEN:-}
      WA3_APP_SECRET: ${AIWEB_WA3_APP_SECRET:-}
      WA3_APP_SECRET_NEXT: ${AIWEB_WA3_APP_SECRET_NEXT:-}
      WA3_VERIFY_TOKEN: ${AIWEB_WA3_VERIFY_TOKEN:-}
      WA3_PHONE_NUMBER_ID: ${AIWEB_WA3_PHONE_NUMBER_ID:-}
      WA3_WABA_ID: ${AIWEB_WA3_WABA_ID:-}
      WA3_GRAPH_VERSION: ${AIWEB_WA3_GRAPH_VERSION:-}
      WA3_GRAPH_URL: ${AIWEB_WA3_GRAPH_URL:-}
      WA3_LEGAL_ENTITY_ID: ${AIWEB_WA3_LEGAL_ENTITY_ID:-}
      WA3_PUBLIC_E164: ${AIWEB_WA3_PUBLIC_E164:-}
      WA3_PEER_MAX_AGE_SECONDS: ${AIWEB_WA3_PEER_MAX_AGE_SECONDS:-}
      META_LEADS_ENABLED: ${AIWEB_META_LEADS_ENABLED:-}
      META_LEADS_APP_SECRET: ${AIWEB_META_LEADS_APP_SECRET:-}
      META_LEADS_APP_SECRET_NEXT: ${AIWEB_META_LEADS_APP_SECRET_NEXT:-}
      META_LEADS_VERIFY_TOKEN: ${AIWEB_META_LEADS_VERIFY_TOKEN:-}
      META_LEADS_PAGE_ID: ${AIWEB_META_LEADS_PAGE_ID:-}
      META_LEADS_PAGE_TOKEN: ${AIWEB_META_LEADS_PAGE_TOKEN:-}
      META_LEADS_FORM_IDS: ${AIWEB_META_LEADS_FORM_IDS:-}
      META_LEADS_GRAPH_VERSION: ${AIWEB_META_LEADS_GRAPH_VERSION:-}
      SITE_AI_ORIGIN: ${AIWEB_SITE_AI_ORIGIN:-}
      SITE_CONTACT_EMAIL: ${AIWEB_SITE_CONTACT_EMAIL:-}
      SITE_PRIVACY_URL: ${AIWEB_SITE_PRIVACY_URL:-}
    networks:
      - edge
      - private
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # 503 when the database is unreachable or row level security does not hold for ai_app.
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # AI-5: n8n (hydromart-ai's n8n/Dockerfile: n8n 2.48.8 with its configuration locked in the
  # image, the workflows from git, and the scripts that load and check them). This file gives it
  # only its database, its encryption key and the editor's address. Every hardening setting is
  # the image's: check-aiweb-compose.mjs refuses any other environment key here.
  n8n:
    image: ghcr.io/m0gsy/hydromart-ai@sha256:a8979d7fe16309bb38567cdb4cdf52ec4fd524210313cd661356b9972e64fbb0
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # n8n writes its settings file (the encryption key in it) and its event log under ~/.n8n. In
    # memory, owned by the image's user (node, 1000) and only by it: nothing of n8n outlives the
    # container but its database, and no key is ever written to the box's disk.
    tmpfs:
      - /home/node/.n8n:uid=1000,gid=1000,mode=0700,size=128m
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${AIWEB_N8N_DB_PASSWORD:?set by scripts/aiweb-secrets.sh}
      # Seals the credentials n8n stores. Made once by scripts/aiweb-secrets.sh and never again:
      # a new key opens none of them (n8n-setup writes ours again, nothing else comes back).
      N8N_ENCRYPTION_KEY: ${AIWEB_N8N_ENCRYPTION_KEY:?set by scripts/aiweb-secrets.sh}
      # The editor is reached only through an ssh tunnel to the port below (DEPLOY.md, "n8n").
      N8N_EDITOR_BASE_URL: http://localhost:5678
    networks:
      - private
      - egress
    # The editor, on the box's loopback and nowhere else: `ssh -L 5678:127.0.0.1:5678` reaches
    # it, the internet and every other container do not.
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # One shot, in every deploy while n8n is stopped (scripts/aiweb-deploy.sh): hydromart-ai's
  # n8n/bin/setup.mjs puts what git holds into n8n's database, the credentials from the three
  # N8N_SETUP_* values below, then the workflows, published. A profile keeps it out of `up`.
  n8n-setup:
    image: ghcr.io/m0gsy/hydromart-ai@sha256:a8979d7fe16309bb38567cdb4cdf52ec4fd524210313cd661356b9972e64fbb0
    profiles: ["n8n-setup"]
    logging: *logging
    mem_limit: 1g
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["node", "/opt/hydromart/bin/setup.mjs"]
    # As n8n's: the settings file holds the key. /tmp too: setup.mjs writes the credentials it
    # imports to a file there for a moment, the secrets in it in the clear.
    tmpfs:
      - /home/node/.n8n:uid=1000,gid=1000,mode=0700,size=128m
      - /tmp:size=64m
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${AIWEB_N8N_DB_PASSWORD:?set by scripts/aiweb-secrets.sh}
      N8N_ENCRYPTION_KEY: ${AIWEB_N8N_ENCRYPTION_KEY:?set by scripts/aiweb-secrets.sh}
      N8N_SETUP_AIWEB_TOKEN: ${AIWEB_N8N_TOKEN:?set by scripts/aiweb-secrets.sh}
      N8N_SETUP_MACHINE_ACCOUNT_ID: ${AIWEB_N8N_MACHINE_ID:?set by scripts/aiweb-secrets.sh}
      # Blank is n8n's kill switch: scripts/aiweb-deploy.sh then never runs this job, and n8n is
      # removed rather than started (DEPLOY.md, "n8n").
      N8N_SETUP_MACHINE_SECRET: ${AIWEB_N8N_MACHINE_SECRET:-}
    networks:
      - private
    depends_on:
      db: { condition: service_healthy }

networks:
  # Created by hydromart's docker-compose.prod.yml (Caddy's second network, HD-1). Caddy and
  # `aiweb` are its only members; the probe in scripts/aiweb-deploy.sh says so after each deploy.
  edge:
    external: true
  # The database's network. `internal`: no route off the box and no route to anything else on it.
  private:
    internal: true
  # AI-5: n8n's way out, and only n8n's (the probe says so after each deploy). Not internal: its
  # workflows reach https://api.hydromart-digital.com at the public address, through Caddy, as
  # the AI web does over edge. Not edge itself: n8n has no business beside Caddy.
  egress: {}

volumes:
  pgdata:
