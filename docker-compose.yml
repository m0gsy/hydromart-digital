# Local development infrastructure for Hydromart.
# Requires Docker. Brings up PostgreSQL — every service's database.
#   docker compose up -d
#
# Q-9: a redis:7-alpine container used to run here and in production. Nothing
# imported a Redis client — not one service, not the rate limiter (in-process
# store), not the scheduler (a DB cursor, by design). It was an unauthenticated
# data store, a persistent volume and a container's worth of RAM, kept alive by
# this entry and three `depends_on` lines. Removed rather than "kept for later":
# later can add the eight lines back.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hydromart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hydromart
      POSTGRES_PASSWORD: hydromart
      POSTGRES_DB: hydromart_auth
    ports:
      # Bind to loopback only — host-side migrations reach it via localhost,
      # but Docker's iptables rules would otherwise bypass ufw and expose it
      # to the public internet. Services talk to it over the compose network.
      - '127.0.0.1:5432:5432'
    volumes:
      - hydromart_pgdata:/var/lib/postgresql/data
      # Creates the per-service databases (each microservice owns its own schema).
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hydromart -d hydromart_auth']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hydromart_pgdata:
