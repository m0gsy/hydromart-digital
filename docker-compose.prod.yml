      ORDER_SERVICE_URL: http://order:3004
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3013/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  forecast:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}forecast:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/forecast-service/Dockerfile }
    environment:
      <<: *shared
      FORECAST_SERVICE_PORT: 3014
      FORECAST_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_forecast?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      CHURN_WINDOW_DAYS: 45
      DEPOT_SERVICE_URL: http://depot:3007
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3014/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  payout:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}payout:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/payout-service/Dockerfile }
    environment:
      <<: *shared
      PAYOUT_SERVICE_PORT: 3016
      PAYOUT_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_payout?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3016/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  admin:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}admin:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/admin-service/Dockerfile }
    environment:
      <<: *shared
      ADMIN_SERVICE_PORT: 3017
      ADMIN_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_admin?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      # Peer service base URLs probed by the aggregate system-health roll-up (13b).
      AUTH_SERVICE_URL: http://auth:3001
      CUSTOMER_SERVICE_URL: http://customer:3002
      PRODUCT_SERVICE_URL: http://product:3003
      ORDER_SERVICE_URL: http://order:3004
      PAYMENT_SERVICE_URL: http://payment:3005
      DELIVERY_SERVICE_URL: http://delivery:3006
      DEPOT_SERVICE_URL: http://depot:3007
      DASHBOARD_SERVICE_URL: http://dashboard:3008
      LOYALTY_SERVICE_URL: http://loyalty:3009
      PROMO_SERVICE_URL: http://promo:3010
      REFERRAL_SERVICE_URL: http://referral:3011
      CRM_SERVICE_URL: http://crm:3012
      RECOMMENDATION_SERVICE_URL: http://recommendation:3013
      FORECAST_SERVICE_URL: http://forecast:3014
      PAYOUT_SERVICE_URL: http://payout:3016
      # Retention: admin counts (never deletes) employee records past their window.
      HR_SERVICE_URL: http://hr:3018
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3017/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  hr:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}hr:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/hr-service/Dockerfile }
    environment:
      <<: *shared
      HR_SERVICE_PORT: 3018
      HR_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_hr?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      # Provisions the staff login behind each imported employee row.
      AUTH_SERVICE_URL: http://auth:3001
      # HR notifications (leave decisions, announcements) ride crm's internal endpoint.
      # Missing here = every HR notification silently skipped, so keep it wired.
      CRM_SERVICE_URL: http://crm:3012
      # Attendance/payroll boot defaults (per-depot override via /hr/settings).
      HR_WORK_START_TIME: ${HR_WORK_START_TIME:-08:00}
      HR_LATE_TOLERANCE_MINUTES: ${HR_LATE_TOLERANCE_MINUTES:-15}
      HR_LATE_DEDUCTION_IDR: ${HR_LATE_DEDUCTION_IDR:-10000}
      HR_DAILY_RATE_TRAINING_IDR: ${HR_DAILY_RATE_TRAINING_IDR:-30000}
      # Face recognition. Prod = BiznetGio NEO cloud gallery (set FACE_VERIFIER_DRIVER=neo
      # + NEO_FR_TOKEN); onnx = in-process ArcFace fallback.
      FACE_VERIFIER_DRIVER: ${FACE_VERIFIER_DRIVER:-onnx}
      HR_FACE_MATCH_THRESHOLD: ${HR_FACE_MATCH_THRESHOLD:-0.62}
      HR_FACE_DUPLICATE_THRESHOLD: ${HR_FACE_DUPLICATE_THRESHOLD:-0.75}
      HR_FACE_MODEL_PATH: ${HR_FACE_MODEL_PATH:-./models/arcface.onnx}
      # B-19: AES-256-GCM key for the enrolled face templates. `openssl rand -hex 32`.
      # Changing it makes every existing enrolment undecryptable — employees re-enroll.
      HR_FACE_ENCRYPTION_KEY: ${HR_FACE_ENCRYPTION_KEY:?set HR_FACE_ENCRYPTION_KEY (openssl rand -hex 32)}
      NEO_FR_ENDPOINT: ${NEO_FR_ENDPOINT:-https://fr.neoapi.id}
      NEO_FR_TOKEN: ${NEO_FR_TOKEN:-}
      NEO_FR_GALLERY_ID: ${NEO_FR_GALLERY_ID:-hydromart-hr}
      # Employee photo / face-enrollment storage (per-service S3 bucket in prod).
      # hr can live on its own NOS cluster (endpoint/region override), else falls back
      # to the shared bucket's endpoint/region.
      STORAGE_DRIVER: ${HR_STORAGE_DRIVER:-s3}
      STORAGE_PUBLIC_BASE_URL: ${HR_STORAGE_PUBLIC_BASE_URL:-}
      STORAGE_S3_ENDPOINT: ${HR_STORAGE_S3_ENDPOINT:-${STORAGE_S3_ENDPOINT:-}}
      STORAGE_S3_REGION: ${HR_STORAGE_S3_REGION:-${STORAGE_S3_REGION:-us-east-1}}
      STORAGE_S3_BUCKET: ${HR_STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY_ID: ${HR_STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${HR_STORAGE_S3_SECRET_ACCESS_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3018/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  gateway:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}gateway:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/gateway-service/Dockerfile }
    environment:
      <<: *shared
      GATEWAY_PORT: 8080
      # Both of these decide whether trusting one X-Forwarded-For hop is safe, and until
      # now neither reached the process — compose read them and the gateway could not.
      # See trustProxyHops() in gateway.setup.ts.
      PUBLIC_BIND: ${PUBLIC_BIND:-127.0.0.1}
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      # Public web origin(s) allowed to call the API from the browser (comma-separated).
      # Must include the prod site or browser CORS blocks every credentialed fetch.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # The rate limiter's four knobs, which this file never passed and therefore nobody
      # could turn. .env.example has documented them since they were written; production has
      # been running the Joi defaults in env.validation.ts the whole time, and an operator
      # editing .env during an incident would have changed nothing at all.
      #
      # The defaults here are the ones production is ALREADY running, so wiring them through
      # changes no behaviour today — it only makes the knobs reachable.
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      RATE_LIMIT_BURST_MAX: ${RATE_LIMIT_BURST_MAX:-300}
      # Sized by a different question from the one above: not "what should the API serve"
      # but "how many paid SMS may one IP cause".
      RATE_LIMIT_OTP_MAX: ${RATE_LIMIT_OTP_MAX:-20}
      AUTH_SERVICE_URL: http://auth:3001
      CUSTOMER_SERVICE_URL: http://customer:3002
      PRODUCT_SERVICE_URL: http://product:3003
      ORDER_SERVICE_URL: http://order:3004
      PAYMENT_SERVICE_URL: http://payment:3005
      DELIVERY_SERVICE_URL: http://delivery:3006
      DEPOT_SERVICE_URL: http://depot:3007
      DASHBOARD_SERVICE_URL: http://dashboard:3008
      LOYALTY_SERVICE_URL: http://loyalty:3009
      PROMO_SERVICE_URL: http://promo:3010
      REFERRAL_SERVICE_URL: http://referral:3011
      CRM_SERVICE_URL: http://crm:3012
      RECOMMENDATION_SERVICE_URL: http://recommendation:3013
      FORECAST_SERVICE_URL: http://forecast:3014
      PAYOUT_SERVICE_URL: http://payout:3016
      ADMIN_SERVICE_URL: http://admin:3017
      HR_SERVICE_URL: http://hr:3018
      # F5: the Android kill switch, served at GET /mobile-config. 0 = off, and it stays
      # off until a shipped build has to be stopped — at which point this and a restart
      # are the whole procedure. No rebuild, no Play review.
      MOBILE_MIN_VERSION_CODE: ${MOBILE_MIN_VERSION_CODE:-0}
      # N5: per-package floors — `id.hydromart.app=1200,id.hydromart.ops=0`. Both binaries
      # come out of the same run and share a versionCode series, so the single floor above
      # could only ever stop BOTH: every courier mid-delivery and every cashier mid-shift
      # went down with a broken customer release. Empty = the global floor, as before.
      MOBILE_MIN_VERSION_CODE_BY_ID: ${MOBILE_MIN_VERSION_CODE_BY_ID:-}
      MOBILE_UPDATE_MESSAGE: ${MOBILE_UPDATE_MESSAGE:-}
    # H-19: bound to loopback by DEFAULT so only Caddy can reach it. Two reasons this is
    # not optional any more: the gateway is the single public ingress, and gateway.setup.ts
    # now sets `trust proxy` — which means X-Forwarded-For is BELIEVED. A directly
    # reachable port would let any client spoof that header and mint itself a fresh
    # rate-limit bucket, turning the B-2 fix into a B-2 bypass.
    #
    # Bare-IP deploys (no WEB_DOMAIN, no --profile tls) have no proxy in front and MUST
    # set PUBLIC_BIND=0.0.0.0 in .env or the stack is unreachable from outside the box.
    # Default is the safe one; the exposed one is a deliberate choice you have to make.
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  web:
    image: ${IMAGE_PREFIX:-hydromart-}web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is FROZEN into the client bundle at build time — a
        # wrong value ships a bundle that tells every visitor's browser to call
        # the wrong host, and only a rebuild fixes it. REQUIRED, no default: an
        # unset PUBLIC_API_URL fails the build rather than silently baking localhost.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL to the PUBLIC gateway origin (e.g. https://api.example.com or http://<vps-ip>:8080) before building}
        # Cosmetic: what the account screen reports as "Versi". Defaults rather than
        # failing the build — a missing version costs a support question, not a deploy.
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-${IMAGE_TAG:-dev}}
        # Build arg, not runtime: `next build` inlines NEXT_PUBLIC_*, so this was a value
        # nobody could set. Blank hides both buttons, which is right for a fleet with no
        # single line yet.
        NEXT_PUBLIC_COURIER_HOTLINE: ${COURIER_HOTLINE:-}
        # N2: frozen into the bundle like the two above. Empty = the reporter is off and
        # the SDK is not even downloaded, so leaving it unset changes nothing.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_WEB:-}
        NEXT_PUBLIC_SENTRY_ENV: ${SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    depends_on:
      - gateway
    # H-19, same rule as the gateway above: loopback by default, Caddy is the way in.
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:3000:3000"
    # H-34: Next.js SSR holds the biggest working set of any Node container here.
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Cron sidecar that drives the internal sweep endpoints on order-service (nothing
  # else calls them). Hourly: place due subscription orders. Daily 08:00: refill
  # reminders. Auths with the shared INTERNAL_SERVICE_KEY over the internal network;
  # alpine's busybox crond, no extra image build. Disable with `docker compose ...
  # up -d --scale scheduler=0`.
  #
  # H-16: TZ used to default to UTC while every sweep time in the crontab is written as
  # an Indonesian business hour — the 08:00 "time to refill" nudge went out at 15:00 WIB,
  # and the 03:30 retention purge ran at 10:30 WIB, in the middle of the working day. It
  # now follows the same PRICING_TZ the services use, so one variable moves all of them.
  scheduler:
    <<: *svc
    image: alpine:3.20
    mem_limit: 64m
    cpus: 0.25
    environment:
      <<: *shared
      TZ: ${SCHEDULER_TZ:-${PRICING_TZ:-Asia/Jakarta}}
    depends_on:
      order: { condition: service_healthy }
    volumes:
      # Deliberately NOT mounted onto /etc/crontabs/root: a bind mount carries the host
      # file's ownership, the checkout on the box belongs to the deploy user, and busybox
      # crond discards every entry of a crontab it does not see as root-owned. The
      # entrypoint installs a root-owned copy from this same directory instead.
      - ./scripts/scheduler:/scripts:ro
      # C1: alpine ships no zone files, so the TZ above read as UTC and every cron time in
      # the crontab fired seven hours out of place. The host has tzdata; lending it costs
      # nothing and needs no network at container start (the entrypoint falls back to
      # `apk add tzdata` on a host that has none, and refuses to run without either).
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    command: ["sh", "/scripts/entrypoint.sh"]
    # H-38: crond keeps running whether or not its jobs do anything, so `running` said
    # nothing about whether sweeps were happening. This asserts a sweep has SUCCEEDED
    # recently — the busiest job runs every 5 minutes. With the deploy gate now requiring
    # `healthy` (H-32), a scheduler that has quietly stopped sweeping fails a deploy
    # instead of riding along unnoticed.
    healthcheck:
      test: ["CMD", "sh", "/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Prometheus scrapes every service's /metrics (enableMetrics()). Bound to
  # loopback only — reach the UI via SSH tunnel, never expose to the internet.
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      # H-49: generated from this compose file by scripts/gen-prometheus-targets.mjs and
      # checked in CI. file_sd, so a regenerated list is picked up without a restart.
      - ./ops/prometheus-targets.json:/etc/prometheus/targets/hydromart.json:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  # H-41 — the four exporters for everything the application cannot report about itself.
  # Before these, a full disk, a saturated connection pool or an OOM-killed container was
  # invisible: app metrics simply stop, and a failed scrape is the only signal, after the
  # fact. All loopback-bound or unpublished; Prometheus reaches them over the compose
  # network.

  # Host: disk, memory, load, filesystem. The 2026-08-02 outage could not be attributed
  # because nothing recorded host state at the time it happened.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    # Host /proc, /sys and / mounted in, rather than `network_mode: host` — a host-network
    # container has no compose DNS name, so Prometheus could not reach it. Memory, load,
    # disk and filesystem all come from those mounts and are the host's real numbers; the
    # network counters are the container's, which is the one thing this trade gives up.
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  # Postgres: connection count against max_connections (B-12's ceiling is only useful if
  # someone can see it being approached), replication lag, slow-query and deadlock counts.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATA_SOURCE_NAME: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable

  # Containers: per-container memory, CPU and — the one that matters here — the OOM kill
  # counter. H-34 gives every container a ceiling; this is what tells you one was hit.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # Routes Prometheus alerts (ops/alert-rules.yml) to ALERT_WEBHOOK_URL. Loopback
  # only. The webhook URL is read from ops/alertmanager.webhook-url (operator
  # creates it, gitignored — see ops/alertmanager.yml header). No file → the
  # container fails to start, which is the honest signal that alerting is unset.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    # N12: without --web.external-url Alertmanager builds notification links from the
    # CONTAINER's hostname — `http://<container-id>:9093/#/alerts` — which Discord refuses
    # outright (400) and no human could open anyway. That is why `title_link` in
    # ops/alertmanager.yml has been deliberately empty. Set ALERTMANAGER_EXTERNAL_URL to a
    # reachable address (an SSH-tunnelled localhost is fine) and the links become real.
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    mem_limit: 128m
    cpus: 0.25
    volumes:
      - ./ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./ops/alertmanager.webhook-url:/etc/alertmanager/webhook-url:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  # Grafana dashboards over Prometheus. Loopback only (SSH tunnel to view).
  # H-27: GRAFANA_ADMIN_PASSWORD is REQUIRED (`:?`), not defaulted to `admin`.
  # Loopback binding is a second lock, not a first one — anyone on the box, or on
  # any SSH tunnel, reached admin/admin. Generate one with scripts/generate-secrets.sh.
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env — see scripts/generate-secrets.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"

  # Opt-in TLS reverse proxy. Enable with `--profile tls`; without the profile the
  # stack serves plain HTTP on the published :3000/:8080 (fine behind your own proxy
  # or for a bare-IP test). With it, Caddy terminates HTTPS on 80/443 and reaches
  # web/gateway over the internal network — firewall off 3000/8080 (or bind them to
  # 127.0.0.1) so the public only hits Caddy. See DEPLOY.md §6.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    profiles: ["tls"]
    depends_on:
      - web
      - gateway
    environment:
      # Empty default (not ${VAR:?}) so the non-tls path still renders — compose
      # interpolates every service even when this one is profiled out. With the tls
      # profile you MUST set these in .env (Caddy can't get a cert for an empty host).
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      # Where the browser is allowed to send crash reports. The Caddyfile has offered this
      # knob since it was written — and this file never passed it, so `{$SENTRY_INGEST_ORIGIN}`
      # always fell back to its default and the variable was unreachable by construction.
      #
      # It cost the whole point of Sentry on the web. The DSN created 2026-08-30 is an EU-region
      # one — `o…….ingest.DE.sentry.io` — and the default only allows `*.ingest.sentry.io`,
      # which does not match a second label. Measured against production: the SDK downloaded,
      # `init` succeeded, and the first envelope was blocked by the browser. Web stayed as blind
      # as it was before the DSN existed, except every visitor now paid to fetch the SDK.
      SENTRY_INGEST_ORIGIN: ${SENTRY_INGEST_ORIGIN:-}

    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The DIRECTORY, not the file - and that difference is a live security finding.
      #
      # A single-file bind mount pins an INODE. `git reset --hard` during a deploy does not
      # rewrite the old file, it writes a new one, so the container kept serving the config
      # from whenever it was last CREATED. `caddy reload --config /etc/caddy/Caddyfile` then
      # re-read that same stale inode and reported success - which is why three deploys in a
      # row printed "reloaded its Caddyfile (no connections dropped)" while the /metrics block
      # committed on 2026-08-27 never took effect, and
      # `curl https://api.hydromart-digital.com/metrics` answered 200 with 404 KB of the
      # platform's traffic to anybody who asked.
      #
      # Mounting the directory means a new file inside it is simply visible. Caddy's default
      # entrypoint already reads /etc/caddy/Caddyfile, so nothing else changes.
      - ./infra/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
