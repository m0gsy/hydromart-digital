  crm:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}crm:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/crm-service/Dockerfile }
    environment:
      <<: *shared
      CRM_SERVICE_PORT: 3012
      CRM_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_crm?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      CUSTOMER_SERVICE_URL: http://customer:3002
      # The ACTIVITY half of a broadcast segment (lapsed / new / frequent / ordered-at-depot)
      # is resolved from order-service under the shared internal key. Blank = an activity
      # segment fails closed, which is the safe direction: refused, never sent wider.
      ORDER_SERVICE_URL: http://order:3004
      # Web Push (design 7b). Blank = push disabled; the app still stores + WhatsApps.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@hydromart.id}
      # FCM HTTP v1 (F4) — the Android transport. Blank = Android push disabled, same
      # shape as VAPID above. The private key is a PEM with its newlines escaped, since
      # neither .env nor this block can carry a real one.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3012/api/v1/health"]
