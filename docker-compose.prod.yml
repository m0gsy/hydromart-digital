    environment:
      <<: *shared
      PROMO_SERVICE_PORT: 3010
      PROMO_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_promo?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      ORDER_SERVICE_URL: http://order:3004
      # Outbound for the "voucher baru" grant notification (spec 5h). INTERNAL_SERVICE_KEY
