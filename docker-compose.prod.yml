# Production overlay for a single VPS. Merge on top of the base infra file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Base file (docker-compose.yml) provides postgres (init-databases.sql creates all
# per-service DBs). This overlay adds the 15 app services + the web app.
#
# All secrets come from the environment (see .env.production.example). ${VAR:?msg}
# fails the command if VAR is unset — no secret is ever hardcoded here.
# Only `gateway` (8080) and `web` (3000) are published to the host; every other
# service is reachable only on the internal docker network.

x-shared: &shared
  NODE_ENV: production
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (min 32 chars)}
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?set INTERNAL_SERVICE_KEY}
  # Every service polls auth-service for the super admin's RBAC overrides. Shared rather
  # than per-service: a service that misses it silently serves the compiled defaults
  # forever, which looks like "the matrix edit did nothing" and is hard to spot.
  AUTH_SERVICE_URL: http://auth:3001
  # Multi-depot scope resolution (supervision chain + franchise owners).
  DEPOT_SERVICE_URL: http://depot:3007
  # Optional error alerting: Slack/Discord/webhook URL. Blank = disabled (no 5xx pings).
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  # The second tier of the same thing, and until now it could not be switched on at all.
  #
  # packages/platform/src/nest/sentry.ts:26 reads `process.env.SENTRY_DSN` and returns
  # immediately when it is blank, so every 5xx across ~19 services was aggregated nowhere.
  # The variable was never in this file and never in .env.example, which means there was no
  # value anybody could have set: the feature was unreachable, not merely off.
  #
  # Shared rather than per-service for the reason AUTH_SERVICE_URL is shared — a service that
  # misses it reports nothing forever, and that looks exactly like a service with no errors.
  # `release` follows IMAGE_TAG (sentry.ts:34), which this stack already sets.
  SENTRY_DSN: ${SENTRY_DSN:-}
  # M12-11: Swagger in production needs HTTP Basic. Both blank = /docs is not mounted at
  # all (fail closed — forgetting a password must not publish every route and role gate).
  # `:-` not `:?` on purpose: docs-off is a legitimate state, so an unset value must not
  # take the whole stack down. Set both in .env to open /docs.
  DOCS_USER: ${DOCS_USER:-}
  DOCS_PASSWORD: ${DOCS_PASSWORD:-}
  # H-16: ONE business timezone for the whole platform. Every service reckons its day and
  # month boundaries from this, and the scheduler's cron clock follows it too — so a
  # "daily" number cannot mean 00:00 WIB on one screen and 07:00 WIB on another. Shared
  # rather than per-service precisely because the split is what caused the disagreement.
  PRICING_TZ: ${PRICING_TZ:-Asia/Jakarta}

x-svc: &svc
  restart: unless-stopped
  # H-34 — nothing bounded any of the 19 Node containers. One leaking or looping service
  # could take the whole box with it, and the four-hour outage was reconstructed without
  # ever being able to rule that out (`docker inspect .State.OOMKilled` was long gone).
  # A limit turns "the VPS died" into "one container was OOM-killed and restarted", which
  # is a fact the watchdog's incident dump can read back.
  #
  # These are CEILINGS, not reservations — a service idles around 150 MB and nothing is
  # pre-allocated, so the ceilings deliberately over-commit the 16 GB box. 512 MB is
  # roughly 3x steady state, which covers the bulk-import and report paths without
  # letting a runaway grow unbounded. Downsize the host, downsize this number.
  mem_limit: 512m
  cpus: 1.0
  depends_on:
    postgres: { condition: service_healthy }

services:
  # Override only the postgres password with the prod secret; user, db, volume,
  # init script AND port publishing all come from the base file (which publishes
  # 5432). We deliberately do NOT re-declare `ports` here: Compose CONCATENATES
  # port lists across files, so a second entry would double-bind and fail to boot.
  # Postgres therefore stays on the host's published 5432 — lock it down
  # with a host firewall (see DEPLOY.md §1); the internet must not reach them.
  postgres:
    # H-34: the one container that genuinely wants headroom — shared_buffers plus every
    # service's connections. Given the largest slice on purpose.
    mem_limit: 2g
    cpus: 2.0
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # B-12: the pool was unbounded on BOTH sides. Prisma defaults to (cpus * 2 + 1)
    # connections per service — on this 8-vCPU box that is 17 x 16 services = 272 against
    # postgres's default max_connections of 100. It does not fail cleanly: the 101st
    # connection is refused, Prisma surfaces it as a connection error, and it reads like an
    # intermittent network fault rather than exhaustion.
    #
    # Now bounded at both ends: every *_DATABASE_URL carries connection_limit=${DB_POOL:-5}
    # (16 x 5 = 80 steady-state) and the server allows 150 — 70 spare for psql, migrations,
    # backup-db.sh and the exporters. Raising DB_POOL past 9 breaks that headroom, which is
    # what scripts/lib/deploy-common.test.sh asserts.
    command:
      - postgres
      - -c
      - max_connections=150

  auth:
    <<: *svc
    # H-31/H-35: named so the image can come from a registry instead of being
    # built on the production box. IMAGE_PREFIX + IMAGE_TAG unset = the old
    # build-on-the-VPS path, unchanged.
    image: ${IMAGE_PREFIX:-hydromart-}auth:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    environment:
      <<: *shared
      AUTH_SERVICE_PORT: 3001
      AUTH_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_auth?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET (min 32 chars)}
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 2592000
      OTP_TTL_SECONDS: 300
      OTP_LENGTH: 6
      OTP_MAX_ATTEMPTS: 5
      OTP_RESEND_COOLDOWN_SECONDS: 60
      # `console` only prints the code to the container log — real customers can
      # never receive it, and anyone who can read logs can sign in as anyone. The
      # service refuses to boot on it in production: set OTP_DELIVERY_CHANNEL to
      # `zenziva` (Indonesian SMS provider in use) or `sms` (generic gateway) in
      # .env, plus that channel's credentials below.
      OTP_DELIVERY_CHANNEL: ${OTP_DELIVERY_CHANNEL:?set OTP_DELIVERY_CHANNEL=zenziva|sms (console is dev-only)}
      ZENZIVA_BASE_URL: ${ZENZIVA_BASE_URL:-https://console.zenziva.net}
      ZENZIVA_USERKEY: ${ZENZIVA_USERKEY:-}
      ZENZIVA_PASSKEY: ${ZENZIVA_PASSKEY:-}
      SMS_API_BASE_URL: ${SMS_API_BASE_URL:-}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-HYDROMART}
      OTP_PEPPER: ${OTP_PEPPER:?set OTP_PEPPER}
      # J6: the demo account a Play reviewer signs in with, since they cannot receive an
      # Indonesian SMS. Both blank = the feature does not exist. See docs/MOBILE_PLAY_STORE.md.
      REVIEWER_PHONE: ${REVIEWER_PHONE:-}
      REVIEWER_OTP_CODE: ${REVIEWER_OTP_CODE:-}
      CRM_SERVICE_URL: http://crm:3012
      # UU PDP tahap 1 (item 13): auth-service fans out to customer-service to export or
      # scrub the profile and addresses. The adapter fails closed, so a missing value
      # makes every PDP approval error rather than half-complete — hardcoded like the
      # other internal URLs, not an env knob that can be forgotten.
      CUSTOMER_SERVICE_URL: http://customer:3002
      # Inviting staff also opens their employee record in hr-service. Fails closed like the
      # line above: a blank value makes the invite error rather than create an account
      # nobody in HR can pay or roster. Hardcoded for the same reason.
      HR_SERVICE_URL: http://hr:3018
      # Object storage for customer avatar photos. BiznetGio NEO (S3-compatible);
      # per-bucket keys, so auth uses its own bucket/creds (see AUTH_STORAGE_* in .env).
      # Reuse the product bucket+creds if you prefer one bucket — avatars live under
      # the avatars/ prefix, products under products/, so they never collide.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:?set STORAGE_S3_ENDPOINT (e.g. https://nos.jkt-1.neo.id)}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-jkt-1}
      STORAGE_S3_BUCKET: ${AUTH_STORAGE_S3_BUCKET:?set AUTH_STORAGE_S3_BUCKET}
      STORAGE_S3_ACCESS_KEY_ID: ${AUTH_STORAGE_S3_ACCESS_KEY_ID:?set AUTH_STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${AUTH_STORAGE_S3_SECRET_ACCESS_KEY:?set AUTH_STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_PUBLIC_BASE_URL: ${AUTH_STORAGE_PUBLIC_BASE_URL:?set AUTH_STORAGE_PUBLIC_BASE_URL (e.g. https://nos.jkt-1.neo.id/hydromart-avatars)}
    # CI-11: this was `node -e "fetch(...)"`, which starts a whole Node runtime — ~40 MB
    # of RSS and a V8 boot — every 10 seconds in each of 19 containers, forever. busybox
    # wget is already in the image and costs a fork. The interval is 30s because these
    # are liveness probes for long-running services, not a readiness race; `retries: 12`
    # still gives a cold start six minutes to come up.
    #
    # 127.0.0.1, NOT localhost — and every probe below follows this one. The images the
    # PR9 rebuild produced carry an /etc/hosts mapping `localhost` to ::1 as well as to
    # 127.0.0.1; busybox wget tries the IPv6 address first, and Nest listens on IPv4
    # only. The probe came back "Connection refused" while the service answered
    # perfectly on that same port. Seven containers sat unhealthy for over an hour, and
    # a deploy would have failed its health gate and rolled back a release that was fine.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  customer:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}customer:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/customer-service/Dockerfile }
    environment:
      <<: *shared
      CUSTOMER_SERVICE_PORT: 3002
      CUSTOMER_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_customer?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      MAX_ADDRESSES_PER_CUSTOMER: 20
      LOYALTY_SERVICE_URL: http://loyalty:3009
      PRODUCT_SERVICE_URL: http://product:3003
      # Pre-registers phones during a depot's bulk customer/reseller import.
      AUTH_SERVICE_URL: http://auth:3001
      # J-1: the depot customer directory's order count, last order and segment all come
      # from here. Seven other services had it and customer-service did not, so
      # `order-crm.http.adapter` returned [] on every call, /dashboard/crm showed all-zero
      # segments and an empty follow-up queue, and the franchise dashboard was fed those
      # zeros too. It fails soft, so nothing ever logged.
      ORDER_SERVICE_URL: http://order:3004
      BIRTHDAY_REWARD_POINTS: 250
      # S2: the depot CRM card's churn band. Blank = the card renders "—" rather than LOW,
      # which is the one answer a manager acts on by doing nothing.
      FORECAST_SERVICE_URL: http://forecast:3014
      # K4.2: the agen price-change notice. Blank would still apply and still audit the
      # change — only the message to the agen would be dropped, which is the exact silence
      # this feature exists to end.
      CRM_SERVICE_URL: http://crm:3012
      # Object storage for agen registration photos (SOP §7). BiznetGio NEO (S3-compatible).
      #
      # Falls back to the AUTH bucket AS A SET — bucket, both keys and the public base URL
      # together, because a bucket paired with another bucket's URL serves 404s. Agen photos
      # live under resellers/ and avatars under avatars/, so sharing one bucket cannot
      # collide, and the fallback is what makes this release need no new secret to deploy.
      # Set the CUSTOMER_STORAGE_* four in .env to split them onto their own bucket later.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:?set STORAGE_S3_ENDPOINT (e.g. https://nos.jkt-1.neo.id)}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-jkt-1}
      STORAGE_S3_BUCKET: ${CUSTOMER_STORAGE_S3_BUCKET:-${AUTH_STORAGE_S3_BUCKET:?set AUTH_STORAGE_S3_BUCKET or CUSTOMER_STORAGE_S3_BUCKET}}
      STORAGE_S3_ACCESS_KEY_ID: ${CUSTOMER_STORAGE_S3_ACCESS_KEY_ID:-${AUTH_STORAGE_S3_ACCESS_KEY_ID:?set AUTH_STORAGE_S3_ACCESS_KEY_ID or CUSTOMER_STORAGE_S3_ACCESS_KEY_ID}}
      STORAGE_S3_SECRET_ACCESS_KEY: ${CUSTOMER_STORAGE_S3_SECRET_ACCESS_KEY:-${AUTH_STORAGE_S3_SECRET_ACCESS_KEY:?set AUTH_STORAGE_S3_SECRET_ACCESS_KEY or CUSTOMER_STORAGE_S3_SECRET_ACCESS_KEY}}
      STORAGE_PUBLIC_BASE_URL: ${CUSTOMER_STORAGE_PUBLIC_BASE_URL:-${AUTH_STORAGE_PUBLIC_BASE_URL:?set AUTH_STORAGE_PUBLIC_BASE_URL or CUSTOMER_STORAGE_PUBLIC_BASE_URL}}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3002/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  product:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}product:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/product-service/Dockerfile }
    environment:
      <<: *shared
      PRODUCT_SERVICE_PORT: 3003
      PRODUCT_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_product?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      # DEPOT_SERVICE_URL comes from *shared (http://depot:3007) — product-service pushes
      # renames/deactivations there so depot stock lines that copied a name follow it.
      # Object storage for product images. BiznetGio NEO (S3-compatible); per-bucket
      # keys, so product uses its own bucket/creds (see PRODUCT_STORAGE_* in .env).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:?set STORAGE_S3_ENDPOINT (e.g. https://nos.jkt-1.neo.id)}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-jkt-1}
      STORAGE_S3_BUCKET: ${PRODUCT_STORAGE_S3_BUCKET:?set PRODUCT_STORAGE_S3_BUCKET}
      STORAGE_S3_ACCESS_KEY_ID: ${PRODUCT_STORAGE_S3_ACCESS_KEY_ID:?set PRODUCT_STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${PRODUCT_STORAGE_S3_SECRET_ACCESS_KEY:?set PRODUCT_STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_PUBLIC_BASE_URL: ${PRODUCT_STORAGE_PUBLIC_BASE_URL:?set PRODUCT_STORAGE_PUBLIC_BASE_URL (e.g. https://nos.jkt-1.neo.id/hydromart-products)}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3003/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  order:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}order:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    environment:
      <<: *shared
      ORDER_SERVICE_PORT: 3004
      ORDER_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_order?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      PRODUCT_SERVICE_URL: http://product:3003
      DEPOT_SERVICE_URL: http://depot:3007
      LOYALTY_SERVICE_URL: http://loyalty:3009
      # Voiding a counter sale refunds through here. Without it a void is refused rather
      # than recorded against money payment-service still holds.
      PAYMENT_SERVICE_URL: http://payment:3005
      # On-time delivery for the monthly review. Blank = slaPct stays null, which is what
      # it always was — order-service must never infer punctuality from order status.
      DELIVERY_SERVICE_URL: http://delivery:3006
      # Payroll for the monthly review's net profit. Blank = netProfitIdr stays null; the
      # report never substitutes 0 for a wage bill it could not read.
      HR_SERVICE_URL: http://hr:3018
      CUSTOMER_SERVICE_URL: http://customer:3002
      PROMO_SERVICE_URL: http://promo:3010
      REFERRAL_SERVICE_URL: http://referral:3011
      CRM_SERVICE_URL: http://crm:3012
      RECOMMENDATION_SERVICE_URL: http://recommendation:3013
      FORECAST_SERVICE_URL: http://forecast:3014
      # Franchise revenue push on order completion (design 6a). Blank disables it silently.
      PAYOUT_SERVICE_URL: http://payout:3016
      ORDER_DELIVERY_FEE: 5000
      # Water-meter variance alert (staff ops feed via crm). Reuses the ONE ops
      # number DEPOT_ALERT_PHONE rather than adding a third variable to keep in
      # sync — delivery already borrows it the same way. Blank = alerting silent,
      # the same fail-open convention as the low-stock alert.
      ORDER_ALERT_PHONE: ${DEPOT_ALERT_PHONE:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3004/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  payment:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}payment:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    environment:
      <<: *shared
      PAYMENT_SERVICE_PORT: 3005
      PAYMENT_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_payment?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      # Blank in dev/self-hosted = online charges fail closed until a real gateway is wired.
      PAYMENT_GATEWAY_BASE_URL: ${PAYMENT_GATEWAY_BASE_URL:-}
      PAYMENT_GATEWAY_API_KEY: ${PAYMENT_GATEWAY_API_KEY:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET (min 16 chars)}
      ORDER_SERVICE_URL: http://order:3004
      # Q-11: refunds strictly above this (IDR) need HQ approval. Unset = the documented
      # default in payment-service/src/domain/payment.ts, which is now the only place the
      # number lives. It was never set here at all, so nobody could tell whether the
      # threshold in production was a decision or an accident.
      REFUND_HQ_THRESHOLD: ${REFUND_HQ_THRESHOLD:-100000}
      # K2.1b: where a customer's payment receipt is stored. Same fallback shape customer
      # uses — proofs live under payment-proof/, avatars under avatars/, resellers under
      # resellers/, so sharing one bucket cannot collide, and the fallback is what makes
      # this release need no new secret to deploy. Set the PAYMENT_STORAGE_* four in .env
      # to split them onto their own bucket later.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:?set STORAGE_S3_ENDPOINT (e.g. https://nos.jkt-1.neo.id)}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-jkt-1}
      STORAGE_S3_BUCKET: ${PAYMENT_STORAGE_S3_BUCKET:-${AUTH_STORAGE_S3_BUCKET:?set AUTH_STORAGE_S3_BUCKET or PAYMENT_STORAGE_S3_BUCKET}}
      STORAGE_S3_ACCESS_KEY_ID: ${PAYMENT_STORAGE_S3_ACCESS_KEY_ID:-${AUTH_STORAGE_S3_ACCESS_KEY_ID:?set AUTH_STORAGE_S3_ACCESS_KEY_ID or PAYMENT_STORAGE_S3_ACCESS_KEY_ID}}
      STORAGE_S3_SECRET_ACCESS_KEY: ${PAYMENT_STORAGE_S3_SECRET_ACCESS_KEY:-${AUTH_STORAGE_S3_SECRET_ACCESS_KEY:?set AUTH_STORAGE_S3_SECRET_ACCESS_KEY or PAYMENT_STORAGE_S3_SECRET_ACCESS_KEY}}
      STORAGE_PUBLIC_BASE_URL: ${PAYMENT_STORAGE_PUBLIC_BASE_URL:-${AUTH_STORAGE_PUBLIC_BASE_URL:?set AUTH_STORAGE_PUBLIC_BASE_URL or PAYMENT_STORAGE_PUBLIC_BASE_URL}}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3005/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  delivery:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}delivery:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/delivery-service/Dockerfile }
    environment:
      <<: *shared
      DELIVERY_SERVICE_PORT: 3006
      DELIVERY_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_delivery?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      ORDER_SERVICE_URL: http://order:3004
      DEPOT_SERVICE_URL: http://depot:3007
      # PAID-cash total for COD settlement (design 2d, fail-closed).
      PAYMENT_SERVICE_URL: http://payment:3005
      # HIGH field incidents (4b) push to the ops feed via crm; reuses DEPOT_ALERT_PHONE.
      CRM_SERVICE_URL: http://crm:3012
      OPS_ALERT_PHONE: ${DEPOT_ALERT_PHONE:-}
      # Courier earning push on delivery completion (design 6b, internal key).
      PAYOUT_SERVICE_URL: http://payout:3016
      # H-30: a completed delivery is reported here for the partner webhook fan-out.
      # Hardcoded like the other internal URLs — blank would silently publish nothing.
      ADMIN_SERVICE_URL: http://admin:3017
      MAX_ACTIVE_DELIVERIES_PER_DRIVER: 1
      SHIFT_CHECKIN_RADIUS_M: 200
      SHIFT_LENGTH_HOURS: 8
      # B6: was 30 here while the settings UI showed 60 — see setting-defs.ts. Depots with
      # no override get the advertised 60 from this release on.
      SHIFT_BREAK_QUOTA_MINUTES: 60
      NO_SHOW_MIN_CONTACT_ATTEMPTS: 2
      NO_SHOW_MIN_WAIT_SECONDS: 300
      DELIVERY_SLA_MINUTES: 120
      # Object storage for PoD photo + signature. BiznetGio NEO (S3-compatible);
      # per-bucket keys, so delivery uses its own bucket/creds (see DELIVERY_STORAGE_* in .env).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:?set STORAGE_S3_ENDPOINT (e.g. https://nos.jkt-1.neo.id)}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-jkt-1}
      STORAGE_S3_BUCKET: ${DELIVERY_STORAGE_S3_BUCKET:?set DELIVERY_STORAGE_S3_BUCKET}
      STORAGE_S3_ACCESS_KEY_ID: ${DELIVERY_STORAGE_S3_ACCESS_KEY_ID:?set DELIVERY_STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${DELIVERY_STORAGE_S3_SECRET_ACCESS_KEY:?set DELIVERY_STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_PUBLIC_BASE_URL: ${DELIVERY_STORAGE_PUBLIC_BASE_URL:?set DELIVERY_STORAGE_PUBLIC_BASE_URL (e.g. https://nos.jkt-1.neo.id/hydromart-pod)}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3006/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  depot:
    <<: *svc
    image: ${IMAGE_PREFIX:-hydromart-}depot:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: services/depot-service/Dockerfile }
    environment:
      <<: *shared
      DEPOT_SERVICE_PORT: 3007
      DEPOT_DATABASE_URL: postgresql://hydromart:${POSTGRES_PASSWORD}@postgres:5432/hydromart_depot?schema=public&connection_limit=${DB_POOL:-5}&pool_timeout=10
      CRM_SERVICE_URL: http://crm:3012
      # Read when a PRODUK stock line is opened, to validate the product id and take the
      # catalog's own name for it. Unset here would silently fall back to localhost, which
      # in a container means every lookup fails and validation quietly stops happening.
      PRODUCT_SERVICE_URL: http://product:3003
      DEPOT_ALERT_PHONE: ${DEPOT_ALERT_PHONE:-}
      # Closing a cashier's shift reads that depot's takings from here. Without it a shift
      # can be opened but never closed — no drawer is ever settled against a guess.
      PAYMENT_SERVICE_URL: http://payment:3005
      # Closing the DAY's books reads the COD couriers deposited from here. Same fail-closed
      # rule: counting only the counter cash and calling it the day's takings is worse than
      # refusing to close.
      DELIVERY_SERVICE_URL: http://delivery:3006
      # D10: a depot-created subscription is made on the ORDER-service engine, not on a
      # second one grown here. Blank means the console refuses instead of saving a plan
      # nothing will ever run.
      ORDER_SERVICE_URL: http://order:3004
      GALLON_DEPOSIT_IDR: ${GALLON_DEPOSIT_IDR:-20000}
      # Object storage for each depot's static QRIS image. It shares the PRODUCT bucket on
      # purpose — the objects are namespaced by the `qris/` key prefix, and reusing the
      # existing credentials keeps this deploy from needing new secrets. Give depot its own
      # bucket by swapping these four for DEPOT_STORAGE_* values in .env.
      # The bucket MUST serve `qris/*` publicly: the customer's payment screen loads it.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:?set STORAGE_S3_ENDPOINT (e.g. https://nos.jkt-1.neo.id)}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-jkt-1}
      STORAGE_S3_BUCKET: ${PRODUCT_STORAGE_S3_BUCKET:?set PRODUCT_STORAGE_S3_BUCKET}
      STORAGE_S3_ACCESS_KEY_ID: ${PRODUCT_STORAGE_S3_ACCESS_KEY_ID:?set PRODUCT_STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${PRODUCT_STORAGE_S3_SECRET_ACCESS_KEY:?set PRODUCT_STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_PUBLIC_BASE_URL: ${PRODUCT_STORAGE_PUBLIC_BASE_URL:?set PRODUCT_STORAGE_PUBLIC_BASE_URL (e.g. https://nos.jkt-1.neo.id/hydromart-products)}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3007/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 12

  dashboard:
