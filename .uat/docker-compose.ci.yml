# Layered onto the test stack by .github/workflows/uat.yml (COMPOSE_EXTRA_FILES).
#
# The test stack relaxes the OTP resend cooldown to one second so the E2E suite can log in with
# the same seeded phone over and over. That is right for E2E and wrong for this run: UAT-M1-16
# asks whether two resends in a row are refused, and against a one-second cooldown the answer is
# "no" for a reason that has nothing to do with the product — it reported the cooldown as broken.
# Production runs 60 seconds; the UAT should run what production runs.
services:
  auth:
    environment:
      OTP_RESEND_COOLDOWN_SECONDS: 60
  # The test stack hands the admin service only three peer URLs, and the health roll-up probes only
  # the peers it is given. UAT-M23-10 asks whether the roll-up reports the whole mesh, so against
  # three services it failed for a reason that says nothing about the product. Production names all
  # sixteen (docker-compose.prod.yml); so does this.
  admin:
    environment:
      AUTH_SERVICE_URL: http://auth:3001
      CUSTOMER_SERVICE_URL: http://customer:3002
      PRODUCT_SERVICE_URL: http://product:3003
      ORDER_SERVICE_URL: http://order:3004
      PAYMENT_SERVICE_URL: http://payment:3005
      DELIVERY_SERVICE_URL: http://delivery:3006
      DEPOT_SERVICE_URL: http://depot:3007
      DASHBOARD_SERVICE_URL: http://dashboard:3008
      LOYALTY_SERVICE_URL: http://loyalty:3009
      PROMO_SERVICE_URL: http://promo:3010
      REFERRAL_SERVICE_URL: http://referral:3011
      CRM_SERVICE_URL: http://crm:3012
      RECOMMENDATION_SERVICE_URL: http://recommendation:3013
      FORECAST_SERVICE_URL: http://forecast:3014
      PAYOUT_SERVICE_URL: http://payout:3016
      HR_SERVICE_URL: http://hr:3018
