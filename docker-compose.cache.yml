# CI-only build-cache overlay (audit CI-1).
#
# Every image was built COLD in `integration` and COLD AGAIN in `e2e` — ~18 images, twice
# per run, from scratch, with no layer cache anywhere. This overlay points each build at a
# GitHub Actions cache so the two jobs share layers with each other and with earlier runs;
# `mode=max` caches the intermediate stages too, which is what makes the expensive `npm ci`
# layer reusable.
#
# NOT for local use: `type=gha` needs the ACTIONS_* variables GitHub injects, and without
# them buildx logs a warning per service. Used as:
#
#   COMPOSE_BAKE=true docker compose -f docker-compose.yml -f docker-compose.test.yml #     -f docker-compose.cache.yml up -d --build
#
# COMPOSE_BAKE is what routes the build through buildx, which is what honours these keys.
# A cache miss or an unavailable backend degrades to a normal cold build — never a failure.

services:
  auth:
    build:
      cache_from:
        - type=gha,scope=hydromart-auth
      cache_to:
        - type=gha,mode=max,scope=hydromart-auth

  customer:
    build:
      cache_from:
        - type=gha,scope=hydromart-customer
      cache_to:
        - type=gha,mode=max,scope=hydromart-customer

