name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI-4: a push that supersedes an earlier one cancels it. Scoped per ref, and
# deliberately NOT cancelling on `main`: the Deploy workflow fires on this
# workflow's completion, so a cancelled main run is a deploy that never happens.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Prisma 5.x evaluates env("<SVC>_DATABASE_URL") at `prisma validate`/`migrate`
# time, so both jobs need these defined. verify only needs them to parse (no
# connection); integration actually migrates against the compose Postgres.
env:
  AUTH_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_auth?schema=public
  CUSTOMER_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_customer?schema=public
  PRODUCT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_product?schema=public
  ORDER_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_order?schema=public
  PAYMENT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_payment?schema=public
  DELIVERY_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_delivery?schema=public
  DEPOT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_depot?schema=public
  LOYALTY_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_loyalty?schema=public
  PROMO_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_promo?schema=public
  REFERRAL_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_referral?schema=public
  CRM_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_crm?schema=public
  RECOMMENDATION_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_recommendation?schema=public
  FORECAST_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_forecast?schema=public
  PAYOUT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_payout?schema=public
  ADMIN_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_admin?schema=public
  HR_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_hr?schema=public

jobs:
  # Audit CI-2: the two Docker jobs build ~18 images and boot the whole stack. For a diff
  # that cannot touch any of it — a README, a doc, the audit register — that is twenty
  # minutes of runner time for no signal. `verify` still runs on everything.
  #
  # The rule lives in scripts/ci-affected.sh and is self-checked by ci-affected.test.sh
  # (run in `verify` below), because a wrong "false" here is an untested image reaching
  # main with a green tick. An undecidable diff answers "true".
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The filter diffs against the merge base, which a shallow clone does not have.
          fetch-depth: 0

      - id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          echo "docker=$(bash scripts/ci-affected.sh "$BASE")" >> "$GITHUB_OUTPUT"
          echo "base=$BASE affected=$(bash scripts/ci-affected.sh "$BASE")"

  verify:
    runs-on: ubuntu-latest
    # These are only for the unit/e2e gate. The e2e specs call
    # ConfigModule.forRoot({ validationSchema }), which validates process.env
    # (their `load` block feeds the app, but Joi still checks env). Dummy-but-
    # valid values only — NOT real secrets. Deliberately NOT at workflow scope:
    # the integration job's flow.mjs signs test JWTs from these and must instead
    # use its own defaults that match docker-compose.test.yml, or auth breaks.
    env:
      JWT_ACCESS_SECRET: ci-jwt-access-secret-that-is-long-enough-0123456789
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-that-is-long-enough-0123456789
      OTP_PEPPER: ci-otp-pepper-value
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-16plus
      WHATSAPP_API_BASE_URL: https://wa.example.com
      WHATSAPP_API_TOKEN: ci-whatsapp-token
      SMS_API_BASE_URL: https://sms.example.com
      SMS_API_TOKEN: ci-sms-token
      AUTH_SERVICE_URL: https://auth.example.com
      CUSTOMER_SERVICE_URL: https://customer.example.com
      PRODUCT_SERVICE_URL: https://product.example.com
      ORDER_SERVICE_URL: https://order.example.com
      PAYMENT_SERVICE_URL: https://payment.example.com
      DELIVERY_SERVICE_URL: https://delivery.example.com
      DEPOT_SERVICE_URL: https://depot.example.com
      LOYALTY_SERVICE_URL: https://loyalty.example.com
      PROMO_SERVICE_URL: https://promo.example.com
      REFERRAL_SERVICE_URL: https://referral.example.com
      CRM_SERVICE_URL: https://crm.example.com
      RECOMMENDATION_SERVICE_URL: https://recommendation.example.com
      FORECAST_SERVICE_URL: https://forecast.example.com
      DASHBOARD_SERVICE_URL: https://dashboard.example.com
      HR_SERVICE_URL: https://hr.example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # CI-13: Node comes from .nvmrc and npm from package.json's `packageManager`,
      # so the runner, the Dockerfiles and a developer's shell all agree on one
      # version pair. `20` alone floated across every 20.x release.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version in package.json
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          [ "$(npm --version)" = "$want" ] || npm install -g "npm@$want"
          npm --version

      # Installs all workspaces and generates every Prisma client (postinstall).
      # Audit CI-3: 16 services run `prisma generate` in postinstall, so every `npm ci`
      # regenerates 16 clients that are almost always already correct. postinstall now
      # skips when the schema hash and CLI version match (scripts/prisma-generate-if-stale.mjs);
      # this cache is the other half — it carries the generated clients between runs so the
      # skip actually has something to skip.
      - name: Cache generated Prisma clients
        uses: actions/cache@v4
        with:
          path: services/*/prisma/generated
          key: prisma-${{ runner.os }}-${{ hashFiles('services/*/prisma/schema.prisma', 'package-lock.json') }}

      - name: Install
        run: npm ci

      # Fails on any high/critical vuln in production deps that isn't in the
      # reviewed allowlist (scripts/audit-gate.mjs). Reads the installed lockfile
      # — no network. New unreviewed highs block the PR (T4 dep-vuln gate).
      - name: Dependency vulnerability gate
        run: npm run audit:ci

      # Static schema validation — no database required.
      - name: Validate Prisma schemas
        run: npm run db:validate

      # B-21: the missing-rollback count drifted from 25-of-98 to 39-of-135 between two
      # audits because nothing ever checked. Backfilling fixed today; this fixes tomorrow.
      - name: Every migration has a rollback
        run: bash scripts/check-rollbacks.sh

      # The deploy scripts decide, from a file list alone, whether prod is touched at
      # all — and a wrong answer there ships as "DEPLOY OK" with nothing deployed.
      # These helpers need no Docker, so they are gated here like any other logic.
      - name: Deploy-script helpers self-check
        run: bash scripts/lib/deploy-common.test.sh

      # H-38: the scheduler's lock, heartbeat and staleness logic. Needs no Docker — wget
      # is stubbed — so it is gated here like any other logic.
      - name: Scheduler sweep self-check
        run: bash scripts/scheduler/sweep.test.sh

      # H-49: a service added to compose without a scrape target is a service no alert
      # can fire about. hr-service was in exactly that state from the day it shipped.
      - name: Prometheus targets match compose
        run: node scripts/gen-prometheus-targets.mjs --check

      # The affected-only filter below decides whether the Docker jobs run at all, so a
      # wrong answer there is an untested image merged behind a green tick (audit CI-2).
      - name: Affected-only filter self-check
        run: bash scripts/ci-affected.test.sh

      # Everything that reads the live .env goes through load-env.sh, because `. ./.env`
      # RUNS it: one secret pasted as a raw multi-line PEM aborted the deploy's migration
      # step and, joined by `&&` in the crontab, would silence the backup, the restore
      # drill and the watchdog with it (2026-08-11).
      - name: .env loader self-check
        run: bash scripts/load-env.test.sh

      # C1b: the host crontab runs the backup, the restore drill and the watchdog. It
      # followed the host's UTC clock, so "03:00 nightly backup" fired at 10:00 WIB.
      - name: Host crontab block self-check
        run: bash scripts/install-host-cron.test.sh

      # env-doctor --fix rewrites the live .env, so every branch of it is pinned by tests:
      # what it joins, what it refuses, and that it never prints the key.
      - name: .env doctor self-check
        run: bash scripts/env-doctor.test.sh

      # The gate that decides whether a tag becomes a signed, publishable AAB. It is the
      # only thing standing between `git tag mobile-v9 && git push --tags` on a scratch
      # branch and the Play Store, so its refusals are pinned rather than assumed.
      - name: mobile release gate self-check
        run: bash scripts/mobile-release-gate.test.sh

      # E0: a bare env(safe-area-inset-*) is 0 on any WebView older than 140, so the inset
      # vanishes on exactly the phones it exists for — while looking perfectly correct in
      # every desktop browser anyone would check it in. Eight places had drifted back to it.
      - name: Safe-area insets are WebView-safe
        run: node scripts/check-safe-area.mjs

      # A new CREATE INDEX in a migration locks writes on that table for the whole build.
      # This fails the PR unless the index also has a CONCURRENTLY build in
      # scripts/create-indexes.sh, which is what production runs first (audit H-39).
      - name: Index build cannot lock production
        run: node scripts/check-index-concurrency.mjs

      # PR-8 translated 478 strings and the scanner then said "clean" twice while the whole
      # console navigation was still hardcoded — it never read object literals, which is
      # where every nav label lives. A browser pass found it. This is that scanner, widened
      # and made a gate, plus the capability labels /dashboard/roles builds at runtime.
      - name: No hardcoded Indonesian copy
        run: node scripts/check-i18n.mjs

      # C4: the two ways this repo kept cutting time in the wrong zone — a UTC period key
      # from toISOString().slice, and a bare date_trunc in raw SQL. Both shipped more than
      # once; a reasoned `// tz-ok:` is the only way past.
      - name: Periods are cut in the business zone
        run: node scripts/check-tz-usage.mjs

      - name: Timezone guard self-check
        run: bash scripts/check-tz-usage.test.sh

      # The OpenAPI document still does not describe most responses (audit D-6). This
      # does not fix that; it stops it growing — a new route with no declared response
      # fails here until it has one.
      - name: API response documentation ratchet
        run: node scripts/check-api-responses.mjs

      # The web client's endpoint table is hand-written (audit F-17), so a renamed route
      # used to reach production as a 404 nobody's tests could see. Every path the client
      # can build is resolved through the gateway's segment map to the owning service and
      # matched against the routes that service declares.
      - name: Frontend endpoint contracts
        run: node scripts/check-endpoint-contracts.mjs

      # The performance baseline (audit Q-17) names, per hot path, the test that holds its
      # round-trip count. A renamed or deleted test turns that table into a promise nobody
      # is keeping, so the reference is checked here.
      - name: Performance baseline references
        run: node scripts/check-perf-baseline.mjs

      # Q-6: an env var a service READS must be a key its Joi schema VALIDATES.
      # Nest passes unknown keys through untouched, so an undeclared one is not a
      # boot error — it is `undefined` behind a `??` at 3am.
      - name: Env contract (read ⊆ validated)
        run: node scripts/check-env-contract.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs jest with --coverage so the per-service coverageThreshold gates fail CI on
      # a coverage regression (QG-1). Thresholds are a ratchet floor at current levels
      # on the money-critical services; raise them toward 90% as tests are added.
      - name: Test (with coverage gate)
        run: npm run test:cov

      - name: Build
        run: npm run build

      # The Android binaries ship these pages as FILES inside the APK — there is no server
      # to ask for `/orders/[id]`. Two whole classes of breakage are invisible to the build
      # above and cost a white screen on a courier's phone:
      #   - a page that reaches for useSearchParams() without a <Suspense> boundary fails
      #     `output: 'export'` outright, and
      #   - a missing trailingSlash writes `products.html` where the device looks for
      #     `products/index.html`, which no build log anywhere will tell you about.
      # Both are caught here, per binary, with no secrets and no backend. The surface
      # assertions are the other half: a customer app that also shipped the depot cash book
      # would build perfectly.
      # Pruning moves real source files out of src/app and back. The branch a normal
      # build never takes is recovering a stash a dead run left behind, and getting that
      # wrong leaves files outside src/app — so it is round-tripped against a throwaway
      # tree before any build depends on it.
      - name: Route-stash round trip
        run: node apps/web/scripts/build-mobile.mjs --self-check

      - name: Mobile export — customer binary
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build:mobile --workspace @hydromart/web -- customer

      - name: Mobile export — ops binary
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build:mobile --workspace @hydromart/web -- ops

      - name: Install Playwright browser
        run: npm run test:e2e:install --workspace @hydromart/web

      # Serves each export the way Capacitor serves the assets bundled into the APK, so a
      # pass here is a statement about the binary and not about a dev server.
      - name: Exported binaries resolve their own paths
        run: |
          npm run test:export:customer --workspace @hydromart/web
          npm run test:export:ops --workspace @hydromart/web

  # Boots the whole prod artifact (all 15 Docker images) via docker-compose and drives
  # the core loop over real HTTP — catches deploy-only bugs the unit gate can't (Dockerfile
  # ordering, Prisma engine/OpenSSL, stale lockfile, missing env). Runs in parallel to verify.
  integration:
    runs-on: ubuntu-latest
    # CI-14: the two Docker jobs no longer start until `verify` is green. They are still
    # independent of each other and run in parallel — the chain exists so a lockfile,
    # typecheck or unit-test failure stops burning two more runners (each of which pays
    # its own `npm ci` + 16 `prisma generate`) on code that already cannot ship.
    needs: [verify, changes]
    # Audit CI-2: skipped entirely for a diff that cannot reach an image. GitHub reports a
    # skipped job as successful, so this does not strand a required check.
    if: needs.changes.outputs.docker == 'true'
    # Host-side `db:migrate` (run.mjs) applies migrations to the compose Postgres over the
    # published port; each service's schema resolves env("<SVC>_DATABASE_URL") from the
    # workflow-level env above.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # Audit CI-1: the images were built COLD here and again in `e2e`, with no layer cache
      # at all — ~18 images, twice per run, from scratch, every time. docker-compose.cache.yml
      # points every build at a GitHub Actions cache; COMPOSE_BAKE routes the build through
      # buildx, which is what honours those keys. Layers are shared with `e2e` and with
      # earlier runs, so only what actually changed rebuilds.
      - uses: docker/setup-buildx-action@v3

      # CI-13: Node comes from .nvmrc and npm from package.json's `packageManager`,
      # so the runner, the Dockerfiles and a developer's shell all agree on one
      # version pair. `20` alone floated across every 20.x release.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version in package.json
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          [ "$(npm --version)" = "$want" ] || npm install -g "npm@$want"
          npm --version

      # Audit CI-3: 16 services run `prisma generate` in postinstall, so every `npm ci`
      # regenerates 16 clients that are almost always already correct. postinstall now
      # skips when the schema hash and CLI version match (scripts/prisma-generate-if-stale.mjs);
      # this cache is the other half — it carries the generated clients between runs so the
      # skip actually has something to skip.
      - name: Cache generated Prisma clients
        uses: actions/cache@v4
        with:
          path: services/*/prisma/generated
          key: prisma-${{ runner.os }}-${{ hashFiles('services/*/prisma/schema.prisma', 'package-lock.json') }}

      - name: Install
        run: npm ci

      # Pre-start infra and wait until Postgres accepts connections (initdb creates all 13
      # databases) so the runner's db:migrate doesn't race a cold Postgres in CI.
      - name: Start infra + wait for Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U hydromart -d hydromart_auth; then exit 0; fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Integration test (build + boot all 15 images, drive core loop)
        env:
          COMPOSE_BAKE: 'true'
          COMPOSE_EXTRA_FILES: docker-compose.cache.yml
        run: npm run test:integration

  # Browser E2E (QG-1): boots the same test backend the integration job uses, serves
  # the web app locally against the gateway, and drives the public flows with Playwright.
  # The web app isn't in the CI compose (prod-only), so we `next start` it here instead of
  # containerising it — same gateway, no extra image to build.
  e2e:
    runs-on: ubuntu-latest
    needs: [verify, changes]
    if: needs.changes.outputs.docker == 'true'
    env:
      # Must match docker-compose.test.yml so seed.mjs can mint an admin token the stack trusts.
      JWT_ACCESS_SECRET: itest-shared-access-secret-0123456789abcdef
      GATEWAY_URL: http://localhost:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # authed.spec reads the OTP back from the auth-service log (console channel).
      # Deterministic under compose regardless of the runner's project name.
      # Playwright runs with cwd=apps/web (npm workspace), where `docker compose` finds
      # no compose file — so point at the running container by name (compose project =
      # checkout dir "hydromart-digital"). cwd-independent; the OTP scraper execSyncs this.
      E2E_OTP_LOG_CMD: docker logs --tail 4000 hydromart-digital-auth-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # CI-13: Node comes from .nvmrc and npm from package.json's `packageManager`,
      # so the runner, the Dockerfiles and a developer's shell all agree on one
      # version pair. `20` alone floated across every 20.x release.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version in package.json
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          [ "$(npm --version)" = "$want" ] || npm install -g "npm@$want"
          npm --version

      # Audit CI-3: 16 services run `prisma generate` in postinstall, so every `npm ci`
      # regenerates 16 clients that are almost always already correct. postinstall now
      # skips when the schema hash and CLI version match (scripts/prisma-generate-if-stale.mjs);
      # this cache is the other half — it carries the generated clients between runs so the
      # skip actually has something to skip.
      - name: Cache generated Prisma clients
        uses: actions/cache@v4
        with:
          path: services/*/prisma/generated
          key: prisma-${{ runner.os }}-${{ hashFiles('services/*/prisma/schema.prisma', 'package-lock.json') }}

      - name: Install
        run: npm ci

      - uses: docker/setup-buildx-action@v3

      # Audit CI-5: apps/web/Dockerfile was never built anywhere in CI — the e2e job runs
      # `next start` from the source tree instead, so a broken web image only surfaced on
      # the deploy. It is built here (not booted: the Playwright run still uses the local
      # server, which is faster and needs no extra container).
      - name: Build the web image
        run: |
          docker buildx build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080 \
            --cache-from type=gha,scope=hydromart-web \
            --cache-to type=gha,mode=max,scope=hydromart-web \
            --tag hydromart-web:ci .

      - name: Start infra + wait for Postgres
        run: |
          docker compose up -d postgres
          # Fail loudly instead of racing db:migrate against a cold Postgres — a fresh
          # runner's initdb creates all 16 databases, which can take >60s. The old loop
          # only `break`ed on ready and fell through silently on timeout, so the first
          # workspace to migrate (admin) intermittently hit P1001.
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U hydromart -d hydromart_auth; then exit 0; fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Migrate + boot services
        run: |
          # pg_isready (via `docker compose exec`) checks Postgres over its in-container
          # unix socket, which can answer on the temporary init server before Postgres
          # restarts to expose TCP — so a host-side migrate can still hit P1001 during
          # that flap. migrate deploy is idempotent, so just retry it.
          ok=0
          for attempt in 1 2 3 4 5; do
            if npm run db:migrate; then ok=1; break; fi
            echo "db:migrate attempt $attempt failed (Postgres likely still initialising), retrying in 5s..." >&2
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "db:migrate failed after retries" >&2; exit 1; }
          # Build in batches of three rather than letting compose build all seventeen at
          # once. Every image runs a full-monorepo `npm ci` against one shared BuildKit
          # cache, so building them together is seventeen cold downloads in the same
          # instant — npm's cacache tmp files collide (EEXIST) and the registry cuts
          # sockets under the burst (ECONNRESET/ETIMEDOUT). Batched, the first three
          # populate the cache and the rest hit it warm. The service list comes from the
          # compose config so a new service cannot quietly slip out of the batching.
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --format json \
            | jq -r '.services | to_entries[] | select(.value.build) | .key' \
            | xargs -n3 docker compose -f docker-compose.yml -f docker-compose.test.yml build
          # --wait blocks until every healthchecked service is healthy — the gateway
          # /health alone can be up while product-service isn't, which 504'd the seed.
          # Audit CI-1: the same cache overlay `integration` writes to, so this second boot
          # pulls layers instead of rebuilding ~18 images cold.
          COMPOSE_BAKE=true docker compose \
            -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.cache.yml \
            up -d --build --wait --wait-timeout 300
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Seed catalog + staff
        run: node scripts/seed.mjs

      - name: Build + serve web
        run: |
          npm run build --workspace @hydromart/web
          nohup npm run start --workspace @hydromart/web >/tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Install Playwright browser
        run: npm run test:e2e:install --workspace @hydromart/web

      - name: Run E2E
        run: npm run test:e2e --workspace @hydromart/web

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
