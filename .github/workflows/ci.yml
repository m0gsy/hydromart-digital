name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI-4: a push that supersedes an earlier one cancels it. Scoped per ref, and
# deliberately NOT cancelling on `main`: the Deploy workflow fires on this
# workflow's completion, so a cancelled main run is a deploy that never happens.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Prisma 5.x evaluates env("<SVC>_DATABASE_URL") at `prisma validate`/`migrate`
# time, so both jobs need these defined. verify only needs them to parse (no
# connection); integration actually migrates against the compose Postgres.
env:
  AUTH_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_auth?schema=public
  CUSTOMER_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_customer?schema=public
  PRODUCT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_product?schema=public
  ORDER_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_order?schema=public
  PAYMENT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_payment?schema=public
  DELIVERY_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_delivery?schema=public
  DEPOT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_depot?schema=public
  LOYALTY_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_loyalty?schema=public
  PROMO_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_promo?schema=public
  REFERRAL_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_referral?schema=public
  CRM_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_crm?schema=public
  RECOMMENDATION_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_recommendation?schema=public
  FORECAST_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_forecast?schema=public
  PAYOUT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_payout?schema=public
  ADMIN_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_admin?schema=public
  HR_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_hr?schema=public

jobs:
  # Audit CI-2: the two Docker jobs build ~18 images and boot the whole stack. For a diff
  # that cannot touch any of it — a README, a doc, the audit register — that is twenty
  # minutes of runner time for no signal. `verify` still runs on everything.
  #
  # The rule lives in scripts/ci-affected.sh and is self-checked by ci-affected.test.sh
  # (run in `verify` below), because a wrong "false" here is an untested image reaching
  # main with a green tick. An undecidable diff answers "true".
  changes:
    runs-on: ubuntu-latest
    # Measured, with headroom. GitHub's default job timeout is SIX HOURS, and a run of this
    # workflow hung for over two of them on `Install Playwright browser` — a download that
    # normally takes under two minutes — while every one of the 45 steps before it had
    # already passed. Nothing failed, nothing alerted, and the deploy queue simply stopped:
    # a hung job and a slow job are indistinguishable without a limit that says which.
    #
    # Over the last five runs: changes <1m, verify 16-18m, integration 17-18m, e2e 25-30m.
    timeout-minutes: 10
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The filter diffs against the merge base, which a shallow clone does not have.
          fetch-depth: 0

      - id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # Assigned, then checked. Written as `echo "docker=$(script)"` the echo always
          # succeeds, so a failing ci-affected.sh produced an EMPTY output — and an empty
          # `docker` output makes `needs.changes.outputs.docker == 'true'` false, which
          # SKIPS both `integration` and `e2e`. GitHub reports a skipped job as successful
          # (this file says so at the `integration` job), so the run concludes green and
          # deploy.yml + images.yml fire on it: production deployed and nineteen images
          # published from a run that tested nothing.
          affected="$(bash scripts/ci-affected.sh "$BASE")"
          [ -n "$affected" ] || { echo "ci-affected.sh produced no answer for BASE=$BASE" >&2; exit 1; }
          echo "docker=$affected" >> "$GITHUB_OUTPUT"
          echo "base=$BASE affected=$affected"

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # CI-13: Node comes from .nvmrc and npm from package.json's `packageManager`,
      # so the runner, the Dockerfiles and a developer's shell all agree on one
      # version pair. `20` alone floated across every 20.x release.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version in package.json
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          [ "$(npm --version)" = "$want" ] || npm install -g "npm@$want"
          npm --version

      # Installs all workspaces and generates every Prisma client (postinstall).
      # Audit CI-3: 16 services run `prisma generate` in postinstall, so every `npm ci`
      # regenerates 16 clients that are almost always already correct. postinstall now
      # skips when the schema hash and CLI version match (scripts/prisma-generate-if-stale.mjs);
      # this cache is the other half — it carries the generated clients between runs so the
      # skip actually has something to skip.
      - name: Cache generated Prisma clients
        uses: actions/cache@v4
        with:
          path: services/*/prisma/generated
          key: prisma-${{ runner.os }}-${{ hashFiles('services/*/prisma/schema.prisma', 'package-lock.json') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install
        run: npm ci

      # One source for the unit-gate environment, shared by `gate`, `test` and `visual`.
      # It used to be an inline `env:` block on the single `verify` job; three inline copies
      # that must stay identical is how drift starts. See scripts/ci-test-env.sh for why it
      # is NOT at workflow scope (it would break the integration job's JWTs).
      - name: Unit-gate env
        run: bash scripts/ci-test-env.sh >> "$GITHUB_ENV"

      # Fails on any high/critical vuln in production deps that isn't in the
      # reviewed allowlist (scripts/audit-gate.mjs). Reads the installed lockfile
      # — no network. New unreviewed highs block the PR (T4 dep-vuln gate).
      - name: Dependency vulnerability gate
        run: npm run audit:ci

      # Static schema validation — no database required.
      - name: Validate Prisma schemas
        run: npm run db:validate

      # B-21: the missing-rollback count drifted from 25-of-98 to 39-of-135 between two
      # audits because nothing ever checked. Backfilling fixed today; this fixes tomorrow.
      - name: Every migration has a rollback
        run: bash scripts/check-rollbacks.sh

      # The deploy scripts decide, from a file list alone, whether prod is touched at
      # all — and a wrong answer there ships as "DEPLOY OK" with nothing deployed.
      # These helpers need no Docker, so they are gated here like any other logic.
      - name: Deploy-script helpers self-check
        run: bash scripts/lib/deploy-common.test.sh

      # env-set.sh edits the live production .env. Every refusal it claims has to be a
      # refusal it performs — a "validated" writer that validates nothing is worse than no
      # writer, because everybody stops reading the file it edits.
      - name: Production env writer self-check
        run: bash scripts/env-set.test.sh

      # An unparseable workflow fails in the quietest way GitHub has: the run appears, is
      # marked failed, has ZERO jobs, and Actions lists the workflow by its PATH instead of
      # its name. Nothing says "invalid YAML" anywhere a person looks first — three red
      # deploy runs on main said nothing more specific than "failure".
      # It also checks the subtler half: a `mode` implemented in the script body but missing
      # from the `choice` options is a button nobody can press.
      - name: Workflows parse, and every mode they implement is selectable
        run: node scripts/check-workflows.mjs

      # The two lines of sed that pull an index and a table name out of each statement have
      # been wrong twice in one day — once substituting the match away instead of capturing
      # it (so every table name came back empty and the new-table skip silently did
      # nothing), once duplicated so a fix landed in one copy only. Both failures aborted a
      # production release before a container was touched, and neither needed a database to
      # catch.
      - name: Index pre-build table parses (no database needed)
        run: bash scripts/create-indexes.test.sh

      # H-38: the scheduler's lock, heartbeat and staleness logic. Needs no Docker — wget
      # is stubbed — so it is gated here like any other logic.
      - name: Scheduler sweep self-check
        run: bash scripts/scheduler/sweep.test.sh

      # H-49: a service added to compose without a scrape target is a service no alert
      # can fire about. hr-service was in exactly that state from the day it shipped.
      - name: Prometheus targets match compose
        run: node scripts/gen-prometheus-targets.mjs --check

      # The affected-only filter below decides whether the Docker jobs run at all, so a
      # wrong answer there is an untested image merged behind a green tick (audit CI-2).
      - name: Affected-only filter self-check
        run: bash scripts/ci-affected.test.sh

      # The `ci` job at the bottom of this file is the one branch protection should require,
      # and it is the only check that can go red for a failed `integration` or `e2e` — both
      # of which run AFTER `verify`, the check that was required instead. Its rule judges
      # whether a SKIPPED heavy job was entitled to skip, so it is exactly the kind of check
      # that passes for the wrong reason if nobody ever fires the red paths at it.
      - name: CI conclusion self-check
        run: bash scripts/ci-conclude.test.sh

      # Everything that reads the live .env goes through load-env.sh, because `. ./.env`
      # RUNS it: one secret pasted as a raw multi-line PEM aborted the deploy's migration
      # step and, joined by `&&` in the crontab, would silence the backup, the restore
      # drill and the watchdog with it (2026-08-11).
      - name: .env loader self-check
        run: bash scripts/load-env.test.sh

      # C1b: the host crontab runs the backup, the restore drill and the watchdog. It
      # followed the host's UTC clock, so "03:00 nightly backup" fired at 10:00 WIB.
      - name: Host crontab block self-check
        run: bash scripts/install-host-cron.test.sh

      # N13/N14. Both watch something that fails SILENTLY on a live box: a certificate
      # whose automatic renewal quietly stopped, and container logs the host never got a
      # cap for. A check that cannot go red would be the same failure class again, so both
      # are pinned by their own self-check.
      - name: Ops watch scripts self-check
        run: bash scripts/check-ops-scripts.test.sh

      # M13: the between-batches GC used to prune the BUILD cache, throwing away exactly the
      # layers the next batch of three images needed. Invisible except as a 39-minute deploy.
      - name: docker-gc self-check
        run: bash scripts/docker-gc.test.sh

      # env-doctor --fix rewrites the live .env, so every branch of it is pinned by tests:
      # what it joins, what it refuses, and that it never prints the key.
      - name: .env doctor self-check
        run: bash scripts/env-doctor.test.sh

      # The gate that decides whether a tag becomes a signed, publishable AAB. It is the
      # only thing standing between `git tag mobile-v9 && git push --tags` on a scratch
      # branch and the Play Store, so its refusals are pinned rather than assumed.
      - name: mobile release gate self-check
        run: bash scripts/mobile-release-gate.test.sh

      # Everything measured inside an APK is measured through these two functions. When they
      # drift, nothing fails — the probe simply reports a different screen than the one the
      # user sees, confidently. That happened: the file name reached usePathname() and every
      # route rendered its `pushed` chrome over `root` HTML (React #418).
      - name: APK probe navigation self-check
        run: bash scripts/lib/apk-cdp.test.sh

      # E0: a bare env(safe-area-inset-*) is 0 on any WebView older than 140, so the inset
      # vanishes on exactly the phones it exists for — while looking perfectly correct in
      # every desktop browser anyone would check it in. Eight places had drifted back to it.
      - name: Safe-area insets are WebView-safe
        run: node scripts/check-safe-area.mjs

      # App Links fail OPEN: a wrong or missing signing certificate means links quietly keep
      # opening in the browser, with no error in the app, the build or Play. The ops binary
      # shipped a whole release listing the upload key and only one of its three Play
      # certificates, and nothing anywhere said so.
      - name: App Links certificates can actually verify
        run: node scripts/check-assetlinks.mjs

      # A new CREATE INDEX in a migration locks writes on that table for the whole build.
      # This fails the PR unless the index also has a CONCURRENTLY build in
      # scripts/create-indexes.sh, which is what production runs first (audit H-39).
      - name: Index build cannot lock production
        run: node scripts/check-index-concurrency.mjs

      # PR-8 translated 478 strings and the scanner then said "clean" twice while the whole
      # console navigation was still hardcoded — it never read object literals, which is
      # where every nav label lives. A browser pass found it. This is that scanner, widened
      # and made a gate, plus the capability labels /dashboard/roles builds at runtime.
      - name: No hardcoded Indonesian copy
        run: node scripts/check-i18n.mjs

      # C4: the two ways this repo kept cutting time in the wrong zone — a UTC period key
      # from toISOString().slice, and a bare date_trunc in raw SQL. Both shipped more than
      # once; a reasoned `// tz-ok:` is the only way past.
      - name: Periods are cut in the business zone
        run: node scripts/check-tz-usage.mjs

      - name: Timezone guard self-check
        run: bash scripts/check-tz-usage.test.sh

      # The OpenAPI document still does not describe most responses (audit D-6). This
      # does not fix that; it stops it growing — a new route with no declared response
      # fails here until it has one.
      - name: API response documentation ratchet
        run: node scripts/check-api-responses.mjs

      # The web client's endpoint table is hand-written (audit F-17), so a renamed route
      # used to reach production as a 404 nobody's tests could see. Every path the client
      # can build is resolved through the gateway's segment map to the owning service and
      # matched against the routes that service declares.
      # Three questions now, not one: does the path resolve, does the METHOD match (an
      # `api.post` at a `@Get`-only route used to pass), and does anything on the server
      # actually read each query parameter the client sends by name — a filter nobody reads
      # is a screen that says "depot: Dago" over a list of every depot. It also scans the
      # whole of `apps/web/src`, not just the endpoints table, so a URL built by hand in a
      # page cannot slip past. What it cannot resolve statically is COUNTED in the output.
      - name: Frontend endpoint contracts
        run: node scripts/check-endpoint-contracts.mjs

      # The browser is not the only client. The same check now resolves the 104 calls the
      # services make to EACH OTHER — hand-written adapters whose URLs nothing validated
      # until a courier's assign came back 422. Reading them needs three facts from three
      # places (target in the template, verb on whichever method fetches, path at the call
      # site for a helper), so the reader has a self-check of its own.
      - name: Service contract gate self-check
        run: bash scripts/check-endpoint-contracts.test.sh

      # PR #60 found a subscription discount the web priced at one rate while promo-service
      # used another, and a points message promising a rate loyalty-service had stopped
      # granting. A literal in a .tsx reads like a constant and outlives whatever set it.
      # Only numbers DOING MONEY are flagged — a poll interval and a Tailwind width are not
      # business rules — and the allowlist carries a written reason per entry.
      - name: No business numbers in the web client
        run: node scripts/check-money-literals.mjs

      - name: Money literal gate self-check
        run: bash scripts/check-money-literals.test.sh

      # The Lighthouse ratchet itself runs in the e2e job (it needs a served build). This is
      # the part that needs no browser: that its baseline still carries every metric it
      # compares. It did not, for the whole life of the byte/request/DOM ceilings, and the
      # gate printed OK the entire time.
      - name: Lighthouse ratchet self-check
        run: bash scripts/check-lighthouse.test.sh

      # A deploy probe that queries a table which does not exist fails silently, prints one
      # word nobody parses, and skips its own alert. The outbox drain probe did exactly that
      # for its whole life (`order_outbox`; the table is `outbox_messages`). Nothing else in
      # this repo can see a typo inside a shell string: shellcheck sees a string, and the SQL
      # only ever runs on production.
      - name: Deploy probes query tables that exist
        run: node scripts/check-deploy-probes.mjs

      # M26. The deploy fires on a green CI and then chose its own target, so what held was
      # "some commit is green", not "this one". Two PRs green apart and red together is not
      # a hypothetical here — it happened on e2e the same day this was measured. YAML is a
      # string to shellcheck and the shell is a string to actionlint, so nothing but this
      # sees the wiring break.
      - name: Deploy ships the commit whose CI went green
        run: node scripts/check-deploy-sha.mjs

      # A UAT token minted with a role that no longer exists is refused by every guard, and
      # the harness reports it as the product refusing. Three such roles survived the
      # thirteen-role rebuild and produced 99 FORBIDDEN in one run.
      - name: UAT harness mints roles that exist
        run: node scripts/check-uat-roles.mjs

      # `cwd: 'g:/VsCode/Hydromart'` in the harness made every docker call ENOENT on the
      # runner, silently — and nineteen cases then reported "Missing bearer token", which
      # reads as an authorisation defect in the product rather than a path on a laptop.
      - name: No machine-specific paths in CI code
        run: node scripts/check-hardcoded-paths.mjs

      # The template is the only list an operator has, and eighteen compose variables were
      # missing from it — four HR payroll defaults that deduct wages, the face-match
      # thresholds that decide whether a punch is accepted, and a NEO credential nobody
      # could know to ask for. Every one had a plausible default, so every one deployed and
      # worked. Auditing the live box could not find them either: comparing a real .env
      # against the template only ever sees keys somebody already set.
      - name: Every compose variable is in the env template
        run: node scripts/check-env-template.mjs

      - name: Env template gate self-check
        run: bash scripts/check-env-template.test.sh

      # Three services installed JwtAuthGuard globally and never DepotScopeGuard, and the
      # only test that would have said so lived inside promo-service and named
      # promo-service. One check about every service beats seventeen copies of one spec.
      - name: Depot-scope guard registration
        run: node scripts/check-depot-scope-guards.mjs

      # `@Roles(...)` may name a fixed set (self-service, the courier app, a cron sweep,
      # the franchise portal) and never a policy. PR-7 moved 39 policy decorators into
      # `@hydromart/access`; this stops the next one being written back as a role tuple
      # `effectiveMatrix()` cannot see and a SUPER_ADMIN cannot retune.
      - name: '@Roles vs @Can policy'
        run: node scripts/check-roles-policy.mjs

      # The performance baseline (audit Q-17) names, per hot path, the test that holds its
      # round-trip count. A renamed or deleted test turns that table into a promise nobody
      # is keeping, so the reference is checked here.
      - name: Performance baseline references
        run: node scripts/check-perf-baseline.mjs

      # Q-6: an env var a service READS must be a key its Joi schema VALIDATES.
      # Nest passes unknown keys through untouched, so an undeclared one is not a
      # boot error — it is `undefined` behind a `??` at 3am.
      - name: Env contract (read ⊆ validated)
        run: node scripts/check-env-contract.mjs

      # D2, and the same defect as B4 before it: an event a service SENDS must be an event
      # crm can RECEIVE. `@IsEnum` answers 400, the sending adapter downgrades that to a
      # warning, and the caller catches — so an undeliverable notification is silent all the
      # way down. It shipped twice; the enum's own comment about the first time did not stop
      # the second.
      - name: Notification events (sent ⊆ deliverable)
        run: node scripts/check-notification-events.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # M4 — the coverage gate, one shard per group instead of 21 workspaces in a row.
  #
  # Measured on run 32835498469: `Test (with coverage gate)` was 506s of a 1312s `verify`,
  # the single largest step in the job, and every workspace waited for the one before it.
  # Per-workspace, from the same log: web 136s, then depot 33, hr 29, order 27, delivery 25,
  # auth 23, customer 22, admin 21, crm 18, payment 18, payout 18, product 17, promo 17,
  # forecast 16, loyalty 15, referral 15, recommendation 12, dashboard 11, gateway 8,
  # access 3, platform ~15.
  #
  # web is a shard of its own because it is 27% of the total on its own and it is the only
  # vitest workspace; the rest are balanced to ~115-140s each so no shard is the long pole.
  # Each shard runs the workspace's OWN `test:cov`, so its own coverageThreshold still gates
  # it — nothing was loosened to make this faster.
  #
  # The shard lists are checked against the workspaces that actually have a `test:cov`
  # script (check-workflows.mjs). A new service that nobody adds to a shard would otherwise
  # be a workspace whose tests never run again, behind a green tick.
  test:
    # Named by the shard alone. Without this the check-run name is the job name plus EVERY
    # matrix value, so each leg arrives in the PR list as `test (services-a,
    # @hydromart/depot-service @hydromart/hr-service ...)` — truncated, unreadable, and
    # different every time the shard's contents change.
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: web
            workspaces: '@hydromart/web'
          - shard: services-a
            workspaces: >-
              @hydromart/depot-service @hydromart/hr-service @hydromart/order-service
              @hydromart/delivery-service @hydromart/auth-service
          - shard: services-b
            workspaces: >-
              @hydromart/customer-service @hydromart/admin-service @hydromart/crm-service
              @hydromart/payment-service @hydromart/payout-service @hydromart/product-service
          - shard: services-c
            workspaces: >-
              @hydromart/promo-service @hydromart/forecast-service @hydromart/loyalty-service
              @hydromart/referral-service @hydromart/recommendation-service
              @hydromart/dashboard-service @hydromart/gateway-service
          - shard: packages
            workspaces: '@hydromart/platform @hydromart/access'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version in package.json
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          [ "$(npm --version)" = "$want" ] || npm install -g "npm@$want"
          npm --version

      - name: Cache generated Prisma clients
        uses: actions/cache@v4
        with:
          path: services/*/prisma/generated
          key: prisma-${{ runner.os }}-${{ hashFiles('services/*/prisma/schema.prisma', 'package-lock.json') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Unit-gate env
        run: bash scripts/ci-test-env.sh >> "$GITHUB_ENV"

      # Sequential inside the shard, and the loop is the point: `npm run test:cov
      # --workspace a --workspace b` stops at the first failure, so a second broken
      # workspace in the same shard is invisible until the first is fixed. This runs all of
      # them and fails at the end with the full list.
      - name: Test (with coverage gate) — ${{ matrix.shard }}
        run: |
          failed=""
          for ws in ${{ matrix.workspaces }}; do
            echo "::group::$ws"
            npm run test:cov --workspace "$ws" || failed="$failed $ws"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "coverage gate failed:$failed" >&2; exit 1; }

  # M5 — the browser half, off the critical path.
  #
  # Two mobile exports, a Playwright install and two Playwright sweeps sat at the end of
  # `verify`, so `integration` and `e2e` waited for them. Measured on run 32835498469:
  # `Nothing overflows at 320px` 190s, ops export 70s, customer export 45s, exported-paths
  # 33s — 338s of a 1312s job, none of which any later job needs.
  #
  # It does NOT need `npm run build`: `build:mobile` runs its own export, which is what
  # every step here reads.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version in package.json
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          [ "$(npm --version)" = "$want" ] || npm install -g "npm@$want"
          npm --version

      - name: Cache generated Prisma clients
        uses: actions/cache@v4
        with:
          path: services/*/prisma/generated
          key: prisma-${{ runner.os }}-${{ hashFiles('services/*/prisma/schema.prisma', 'package-lock.json') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Unit-gate env
        run: bash scripts/ci-test-env.sh >> "$GITHUB_ENV"

      # The Android binaries ship these pages as FILES inside the APK — there is no server
      # to ask for `/orders/[id]`. Two whole classes of breakage are invisible to
      # `npm run build` (which runs in `gate`, not here — these exports are their own build)
      # and cost a white screen on a courier's phone:
      #   - a page that reaches for useSearchParams() without a <Suspense> boundary fails
      #     `output: 'export'` outright, and
      #   - a missing trailingSlash writes `products.html` where the device looks for
      #     `products/index.html`, which no build log anywhere will tell you about.
      # Both are caught here, per binary, with no secrets and no backend. The surface
      # assertions are the other half: a customer app that also shipped the depot cash book
      # would build perfectly.
      # Pruning moves real source files out of src/app and back. The branch a normal
      # build never takes is recovering a stash a dead run left behind, and getting that
      # wrong leaves files outside src/app — so it is round-tripped against a throwaway
      # tree before any build depends on it.
      - name: Route-stash round trip
        run: node apps/web/scripts/build-mobile.mjs --self-check

      - name: Mobile export — customer binary
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build:mobile --workspace @hydromart/web -- customer

      - name: Mobile export — ops binary
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build:mobile --workspace @hydromart/web -- ops

      # Cached, capped, and retried — because this one step has now eaten a whole day twice.
      #
      # It hung for over TWO HOURS on one run (all 45 preceding steps green, nothing said
      # so), and on the next it hung until the job's 45-minute cap killed it — which GitHub
      # records as `cancelled`, so the whole CI run concluded cancelled, and Deploy and
      # Images skipped without anyone marking anything red. A browser download stalling on a
      # CDN is not a reason to lose a release.
      #
      # The cache is keyed on the Playwright version, because that is what decides which
      # browser build is fetched.
      # M3. The comment above was right about what the key SHOULD be and the key did not do
      # it: `hashFiles('package-lock.json')` changes when ANY of the 21 workspaces bumps ANY
      # dependency, so the cache missed constantly and the ~8-minute browser download ran
      # again — with no `restore-keys`, there was not even a stale cache to fall back on.
      #
      # The resolved version out of the lockfile is the honest key: it moves only when
      # Playwright itself moves, which is exactly what decides which browser build is
      # fetched. `^1.49.1` in package.json is a RANGE and would not do — the installed
      # version is what matters, and today that is 1.61.1.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          v="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          [ -n "$v" ] || { echo "could not read the resolved @playwright/test version" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "resolved @playwright/test = $v"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          # A miss on the exact version still starts from the newest browser cache this
          # runner has, so `playwright install` verifies and tops up rather than downloading
          # from cold. This is the half M3 named and M9b already did for the Prisma cache.
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        timeout-minutes: 8
        run: |
          # Browser saja — TANPA `--with-deps`, dan itu inti perbaikannya.
          #
          # `--with-deps` menjalankan `sudo apt-get install` pustaka sistem, dan DI SITULAH
          # ia menggantung: "Switching to root user to install dependencies", lalu diam
          # sampai plafon membunuhnya. Tiga putaran CI habis untuk itu, dengan tiga cara
          # gagal berbeda, tanpa satu pun menyentuh sebabnya.
          #
          # Runner ubuntu-latest sudah membawa Chrome beserta pustakanya, jadi chromium
          # bawaan Playwright tidak butuh apt sama sekali. Yang tersisa hanyalah mengunduh
          # browsernya — dan itu yang di-cache di langkah atas, jadi pada jalan berikutnya
          # bahkan unduhannya pun tidak terjadi.
          #
          # Kalau ternyata ada pustaka yang benar-benar kurang, Playwright gagal dengan
          # menyebut nama pustakanya — kegagalan yang keras dan spesifik, bukan gantungan.
          for attempt in 1 2 3; do
            if npm run test:e2e:install --workspace @hydromart/web; then exit 0; fi
            echo "playwright install attempt $attempt failed or stalled, retrying..." >&2
            sleep 10
          done
          echo "playwright install failed three times" >&2
          exit 1

      # Serves each export the way Capacitor serves the assets bundled into the APK, so a
      # pass here is a statement about the binary and not about a dev server.
      - name: Exported binaries resolve their own paths
        run: |
          npm run test:export:customer --workspace @hydromart/web
          npm run test:export:ops --workspace @hydromart/web

      # J6. The 320px floor was held up by a comment and eleven measured fixes, and by
      # nothing that ran again. `export-width-sweep.mjs` was written for that sweep, exits
      # non-zero on a finding, and had never run in CI once — so the twelfth regression was
      # going to be found the same way the first eleven were: by a person, on a phone.
      #
      # It costs almost nothing here: both exports are already built two steps up and the
      # browser is already installed and cached. 320 is the narrowest width in its list and
      # the one the floor is about; the other four come with it.
      - name: Nothing overflows at 320px
        run: |
          node scripts/export-width-sweep.mjs customer
          node scripts/export-width-sweep.mjs ops

  # One name that means "the unit gate passed", kept deliberately.
  #
  # `verify` was one 22-minute job; it is now three that run at once, and something has to
  # be the single answer for all three. `integration` and `e2e` hang off it by name.
  #
  # It was kept for a second reason that turned out to be FALSE, and the correction is worth
  # more than the reason: this was written as "the name branch protection knows". MEASURED —
  # `GET /repos/.../branches/main/protection` answers 404, "Branch not protected". There are
  # no required status checks on main at all, so nothing mechanically stops a red PR being
  # merged; every green tick this repo relies on is enforced by whoever is pressing merge.
  # That is a decision for the repo owner, not something to slip into a CI refactor, so it
  # is written down here and nowhere else changed.
  #
  # `if: always()` is what makes it able to go red: without it a failed `gate` skips this
  # job, and GitHub reports a skipped job as successful.
  verify:
    needs: [gate, test, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every half of the unit gate passed
        run: |
          gate='${{ needs.gate.result }}'
          test='${{ needs.test.result }}'
          visual='${{ needs.visual.result }}'
          echo "gate=$gate test=$test visual=$visual"
          bad=""
          [ "$gate" = success ] || bad="$bad gate"
          # A matrix job's result is success only when every leg succeeded.
          [ "$test" = success ] || bad="$bad test"
          [ "$visual" = success ] || bad="$bad visual"
          [ -z "$bad" ] || { echo "unit gate failed:$bad" >&2; exit 1; }

  # Boots the whole prod artifact (all 15 Docker images) via docker-compose and drives
  # the core loop over real HTTP — catches deploy-only bugs the unit gate can't (Dockerfile
  # ordering, Prisma engine/OpenSSL, stale lockfile, missing env). Runs AFTER verify, not
  # beside it — `needs: [verify, changes]` below — which is why `verify` going green says
  # nothing whatsoever about this job. See the `ci` job at the bottom of this file.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # CI-14: the two Docker jobs no longer start until `verify` is green. They are still
    # independent of each other and run in parallel — the chain exists so a lockfile,
    # typecheck or unit-test failure stops burning two more runners (each of which pays
    # its own `npm ci` + 16 `prisma generate`) on code that already cannot ship.
    needs: [verify, changes]
    # Audit CI-2: skipped entirely for a diff that cannot reach an image. GitHub reports a
    # skipped job as successful, so this does not strand a required check.
    if: needs.changes.outputs.docker == 'true'
    # Host-side `db:migrate` (run.mjs) applies migrations to the compose Postgres over the
    # published port; each service's schema resolves env("<SVC>_DATABASE_URL") from the
    # workflow-level env above.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # Audit CI-1: the images were built COLD here and again in `e2e`, with no layer cache
      # at all — ~18 images, twice per run, from scratch, every time. docker-compose.cache.yml
      # points every build at a GitHub Actions cache; COMPOSE_BAKE routes the build through
      # buildx, which is what honours those keys. Layers are shared with `e2e` and with
      # earlier runs, so only what actually changed rebuilds.
      - uses: docker/setup-buildx-action@v3

      # CI-13: Node comes from .nvmrc and npm from package.json's `packageManager`,
      # so the runner, the Dockerfiles and a developer's shell all agree on one
      # version pair. `20` alone floated across every 20.x release.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version in package.json
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          [ "$(npm --version)" = "$want" ] || npm install -g "npm@$want"
          npm --version

      # Audit CI-3: 16 services run `prisma generate` in postinstall, so every `npm ci`
      # regenerates 16 clients that are almost always already correct. postinstall now
      # skips when the schema hash and CLI version match (scripts/prisma-generate-if-stale.mjs);
      # this cache is the other half — it carries the generated clients between runs so the
      # skip actually has something to skip.
      - name: Cache generated Prisma clients
        uses: actions/cache@v4
        with:
          path: services/*/prisma/generated
          key: prisma-${{ runner.os }}-${{ hashFiles('services/*/prisma/schema.prisma', 'package-lock.json') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install
        run: npm ci

      # Pre-start infra and wait until Postgres accepts connections (initdb creates all 13
      # databases) so the runner's db:migrate doesn't race a cold Postgres in CI.
      # M6b proposed deleting this as a duplicate — run.mjs opens with the same
      # `up -d postgres`. MEASURED and rejected: this step takes EIGHT SECONDS (run
      # 32835498469, 10:56:17 -> 10:56:25) against 16m30s for the step below it, the second
      # `up -d postgres` is a no-op on an already-running container, and the wait itself is
      # not duplicated work — it has to happen somewhere. Delete this and it happens inside
      # run.mjs's retry loop instead, which pays for it with a whole FAILED `db:migrate`
      # plus a 5s sleep. The item trades eight seconds for something slower.
      - name: Start infra + wait for Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U hydromart -d hydromart_auth; then exit 0; fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Integration test (build + boot all 15 images, drive core loop)
        env:
          COMPOSE_BAKE: 'true'
          COMPOSE_EXTRA_FILES: docker-compose.cache.yml
        run: npm run test:integration

  # Browser E2E (QG-1): boots the same test backend the integration job uses, serves
  # the web app locally against the gateway, and drives the public flows with Playwright.
  # The web app isn't in the CI compose (prod-only), so we `next start` it here instead of
  # containerising it — same gateway, no extra image to build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [verify, changes]
    if: needs.changes.outputs.docker == 'true'
    env:
      # Must match docker-compose.test.yml so seed.mjs can mint an admin token the stack trusts.
      JWT_ACCESS_SECRET: itest-shared-access-secret-0123456789abcdef
      GATEWAY_URL: http://localhost:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # authed.spec reads the OTP back from the auth-service log (console channel).
      # Deterministic under compose regardless of the runner's project name.
      # Playwright runs with cwd=apps/web (npm workspace), where `docker compose` finds
      # no compose file — so point at the running container by name (compose project =
      # checkout dir "hydromart-digital"). cwd-independent; the OTP scraper execSyncs this.
      E2E_OTP_LOG_CMD: docker logs --tail 4000 hydromart-digital-auth-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # CI-13: Node comes from .nvmrc and npm from package.json's `packageManager`,
      # so the runner, the Dockerfiles and a developer's shell all agree on one
      # version pair. `20` alone floated across every 20.x release.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version in package.json
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          [ "$(npm --version)" = "$want" ] || npm install -g "npm@$want"
          npm --version

      # Audit CI-3: 16 services run `prisma generate` in postinstall, so every `npm ci`
      # regenerates 16 clients that are almost always already correct. postinstall now
      # skips when the schema hash and CLI version match (scripts/prisma-generate-if-stale.mjs);
      # this cache is the other half — it carries the generated clients between runs so the
      # skip actually has something to skip.
      - name: Cache generated Prisma clients
        uses: actions/cache@v4
        with:
          path: services/*/prisma/generated
          key: prisma-${{ runner.os }}-${{ hashFiles('services/*/prisma/schema.prisma', 'package-lock.json') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install
        run: npm ci

      - uses: docker/setup-buildx-action@v3

      # Audit CI-5: apps/web/Dockerfile was never built anywhere in CI — the e2e job runs
      # `next start` from the source tree instead, so a broken web image only surfaced on
      # the deploy. It is built here (not booted: the Playwright run still uses the local
      # server, which is faster and needs no extra container).
      - name: Build the web image
        run: |
          docker buildx build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080 \
            --cache-from type=gha,scope=hydromart-web \
            --cache-to type=gha,mode=max,scope=hydromart-web \
            --tag hydromart-web:ci .

      - name: Start infra + wait for Postgres
        run: |
          docker compose up -d postgres
          # Fail loudly instead of racing db:migrate against a cold Postgres — a fresh
          # runner's initdb creates all 16 databases, which can take >60s. The old loop
          # only `break`ed on ready and fell through silently on timeout, so the first
          # workspace to migrate (admin) intermittently hit P1001.
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U hydromart -d hydromart_auth; then exit 0; fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Migrate + boot services
        run: |
          # pg_isready (via `docker compose exec`) checks Postgres over its in-container
          # unix socket, which can answer on the temporary init server before Postgres
          # restarts to expose TCP — so a host-side migrate can still hit P1001 during
          # that flap. migrate deploy is idempotent, so just retry it.
          ok=0
          for attempt in 1 2 3 4 5; do
            if npm run db:migrate; then ok=1; break; fi
            echo "db:migrate attempt $attempt failed (Postgres likely still initialising), retrying in 5s..." >&2
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "db:migrate failed after retries" >&2; exit 1; }
          # Build in batches of three rather than letting compose build all seventeen at
          # once. Every image runs a full-monorepo `npm ci` against one shared BuildKit
          # cache, so building them together is seventeen cold downloads in the same
          # instant — npm's cacache tmp files collide (EEXIST) and the registry cuts
          # sockets under the burst (ECONNRESET/ETIMEDOUT). Batched, the first three
          # populate the cache and the rest hit it warm. The service list comes from the
          # compose config so a new service cannot quietly slip out of the batching.
          #
          # M1: the batching stays, the SECOND pass goes.
          #
          # This built everything twice: once here without the cache overlay, and again
          # immediately below through `up --build` WITH it. So the first pass could not
          # reuse a single layer the `integration` job had already published, and the
          # second pass re-checked seventeen images that had just been built. The
          # batching itself was never the waste — it is what stops a seventeen-wide
          # build from colliding in npm's cacache and having its sockets cut. So the
          # overlay moves, not the batching.
          docker compose \
            -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.cache.yml \
            config --format json \
            | jq -r '.services | to_entries[] | select(.value.build) | .key' \
            | COMPOSE_BAKE=true xargs -n3 docker compose \
                -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.cache.yml build
          # --wait blocks until every healthchecked service is healthy — the gateway
          # /health alone can be up while product-service isn't, which 504'd the seed.
          # No `--build`: everything above is already built, from the same overlay.
          docker compose \
            -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.cache.yml \
            up -d --wait --wait-timeout 300
          # M7: the 45x2s poll that used to follow this is gone. `--wait` already blocks
          # until every healthchecked service is healthy, so the loop measured a condition
          # that was true before its first iteration — and it could not fail either: its
          # last command is `sleep`, so a gateway that never answered still exited 0 and the
          # seed step got the 504 instead. One decisive curl replaces it: it costs one
          # request when everything is fine, and says WHICH thing was not up when it isn't.
          curl -fsS http://localhost:8080/health >/dev/null || {
            echo "the stack reported healthy but the gateway does not answer /health:"
            docker compose -f docker-compose.yml -f docker-compose.test.yml ps
            exit 1
          }

      - name: Seed catalog + staff
        run: node scripts/seed.mjs

      # The Play-reviewer demo seeder, run against the test stack for one reason: three
      # separate runs of it against PRODUCTION died on three different shape mismatches
      # (`limit` above the cap, a `phone` the depot DTO does not accept, an invite missing
      # the four employment fields the console always sends). Every one was a request the
      # repo had never made before, so nothing here could have caught it.
      # Now a mismatch costs a red check instead of a production round trip — and running
      # it twice is a live proof that it stays idempotent, which is the property the whole
      # script is designed around.
      - name: Demo-depot seeder works (and is idempotent)
        run: |
          node scripts/seed-demo-depot.mjs
          node scripts/seed-demo-depot.mjs

      # M8: `.next/cache` is what makes a second Next build incremental — without it every
      # e2e run compiles the whole app from cold, and this is the one build on the critical
      # path that nothing was caching. Keyed on the lockfile + the source it compiles, with
      # a restore-key so a source change reuses the previous build's cache instead of
      # throwing it away: a partially warm cache is most of the saving.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build + serve web
        run: |
          npm run build --workspace @hydromart/web
          nohup npm run start --workspace @hydromart/web >/tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then break; fi
            sleep 2
          done
          # Same non-failing shape as uat.yml had: the loop's last command succeeds, so a
          # server that never came up still exits 0. Here `Run E2E` fails hard afterwards,
          # so the outage IS caught — but it is caught as ten broken specs with no server
          # log, which is a much slower way to learn the same thing.
          curl -fsS http://localhost:3000 >/dev/null || { echo "web never came up:"; cat /tmp/web.log; exit 1; }

      # Cached, capped, and retried — because this one step has now eaten a whole day twice.
      #
      # It hung for over TWO HOURS on one run (all 45 preceding steps green, nothing said
      # so), and on the next it hung until the job's 45-minute cap killed it — which GitHub
      # records as `cancelled`, so the whole CI run concluded cancelled, and Deploy and
      # Images skipped without anyone marking anything red. A browser download stalling on a
      # CDN is not a reason to lose a release.
      #
      # The cache is keyed on the Playwright version, because that is what decides which
      # browser build is fetched.
      # M3. The comment above was right about what the key SHOULD be and the key did not do
      # it: `hashFiles('package-lock.json')` changes when ANY of the 21 workspaces bumps ANY
      # dependency, so the cache missed constantly and the ~8-minute browser download ran
      # again — with no `restore-keys`, there was not even a stale cache to fall back on.
      #
      # The resolved version out of the lockfile is the honest key: it moves only when
      # Playwright itself moves, which is exactly what decides which browser build is
      # fetched. `^1.49.1` in package.json is a RANGE and would not do — the installed
      # version is what matters, and today that is 1.61.1.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          v="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          [ -n "$v" ] || { echo "could not read the resolved @playwright/test version" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "resolved @playwright/test = $v"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          # A miss on the exact version still starts from the newest browser cache this
          # runner has, so `playwright install` verifies and tops up rather than downloading
          # from cold. This is the half M3 named and M9b already did for the Prisma cache.
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        timeout-minutes: 8
        run: |
          # Browser saja — TANPA `--with-deps`, dan itu inti perbaikannya.
          #
          # `--with-deps` menjalankan `sudo apt-get install` pustaka sistem, dan DI SITULAH
          # ia menggantung: "Switching to root user to install dependencies", lalu diam
          # sampai plafon membunuhnya. Tiga putaran CI habis untuk itu, dengan tiga cara
          # gagal berbeda, tanpa satu pun menyentuh sebabnya.
          #
          # Runner ubuntu-latest sudah membawa Chrome beserta pustakanya, jadi chromium
          # bawaan Playwright tidak butuh apt sama sekali. Yang tersisa hanyalah mengunduh
          # browsernya — dan itu yang di-cache di langkah atas, jadi pada jalan berikutnya
          # bahkan unduhannya pun tidak terjadi.
          #
          # Kalau ternyata ada pustaka yang benar-benar kurang, Playwright gagal dengan
          # menyebut nama pustakanya — kegagalan yang keras dan spesifik, bukan gantungan.
          for attempt in 1 2 3; do
            if npm run test:e2e:install --workspace @hydromart/web; then exit 0; fi
            echo "playwright install attempt $attempt failed or stalled, retrying..." >&2
            sleep 10
          done
          echo "playwright install failed three times" >&2
          exit 1

      - name: Run E2E
        run: npm run test:e2e --workspace @hydromart/web

      # H3. A Lighthouse score nobody gates on is a score nobody reads. The numbers this
      # repo scores today are the floor, and a PR may not go below them — performance
      # included, reduced to the BEST of five passes per page rather than a median.
      #
      # A median of three still left twenty-six points of spread on /products against a
      # tolerance of eight, and failed a PR that touched two shell scripts and no frontend
      # code at all. The noise is one-tailed: a busy runner makes a page slower, nothing
      # makes it render faster than the machine can. So the fastest pass is the estimate
      # and the slow ones are interference.
      - name: Lighthouse ratchet
        run: node scripts/check-lighthouse.mjs

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # The check branch protection should require, and the only one that can speak for the
  # whole run. `verify` covers gate/test/visual and nothing else — `integration` and `e2e`
  # both `needs: [verify, ...]`, so they have not started when it reports. Required contexts
  # on main were verify/changes/image/sast/sbom/secrets, which left the two most end-to-end
  # jobs in this repo gating nothing at all.
  #
  # It cannot be fixed by adding `e2e` to the required contexts: both jobs are conditional on
  # `changes.outputs.docker`, and a required check that is SKIPPED leaves the PR waiting on a
  # status that will never arrive. So the judgement lives here, in a job that always runs and
  # decides whether a skip was earned — the rule and its self-check are in
  # scripts/ci-conclude.sh, out of YAML so they can actually be tested.
  ci:
    needs: [changes, verify, integration, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conclude
        run: |
          bash scripts/ci-conclude.sh \
            --docker '${{ needs.changes.outputs.docker }}' \
            --verify '${{ needs.verify.result }}' \
            --integration '${{ needs.integration.result }}' \
            --e2e '${{ needs.e2e.result }}'
