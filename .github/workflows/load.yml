name: Load

# The two k6 scripts have existed since PR-7 and have never been run by anything but a
# person deciding to. They measure the two fan-outs the audit named (checkout's per-product
# catalog reads, the owner and HR dashboards), and the whole point of those rewrites was
# that p95 stays FLAT as cart lines / depots / roster grow. Nothing was watching whether it
# still does.
#
# Weekly, against a stack this workflow boots itself. NOT against production: the box has
# 16 GB and is serving customers, and the checkout script writes real orders — a load test
# that pollutes the day's book is worse than no load test.
on:
  schedule:
    - cron: '0 19 * * 0' # Sunday 02:00 WIB, the quietest hour of the quietest day
  workflow_dispatch:
    inputs:
      vus:
        description: 'Virtual users'
        default: '10'
      duration:
        description: 'Duration per scenario'
        default: '60s'

# M20. Same shape as uat.yml: a whole stack, a long runner hold, and no group at all, so a
# dispatch during the Sunday-night run gave two load tests racing each other. Two k6 runs
# against two stacks also make the p95 number meaningless, which is the only thing this
# workflow exists to produce. Newer request wins; nothing downstream reads the older one.
concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_auth?schema=public
  CUSTOMER_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_customer?schema=public
  PRODUCT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_product?schema=public
  ORDER_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_order?schema=public
  PAYMENT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_payment?schema=public
  DELIVERY_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_delivery?schema=public
  DEPOT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_depot?schema=public
  LOYALTY_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_loyalty?schema=public
  PROMO_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_promo?schema=public
  REFERRAL_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_referral?schema=public
  CRM_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_crm?schema=public
  RECOMMENDATION_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_recommendation?schema=public
  FORECAST_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_forecast?schema=public
  PAYOUT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_payout?schema=public
  ADMIN_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_admin?schema=public
  HR_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_hr?schema=public

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The record step below pushes a row to docs/perf/BASELINE.md. This repository's default
    # workflow-token permission is read-only on contents — deploy.yml documents the same
    # discovery from the other side, where a missing block cost eleven silently-skipped image
    # checks. Without `contents: write` the push answers 403 and the baseline stays empty in
    # exactly the way this change exists to stop.
    permissions:
      contents: write
    env:
      # Must match docker-compose.test.yml, exactly as ci.yml does it: `scripts/seed.mjs`
      # mints an admin token the booted stack has to trust. Without it the seed step exits
      # with "JWT_ACCESS_SECRET is required (must match the running stack)" - which is how
      # this workflow failed on its FIRST EVER run, and how it would have failed every
      # Sunday at 02:00 from then on, load-testing nothing.
      JWT_ACCESS_SECRET: itest-shared-access-secret-0123456789abcdef
      GATEWAY_URL: http://localhost:8080
      BASE_URL: http://localhost:8080
      VUS: ${{ github.event.inputs.vus || '10' }}
      DURATION: ${{ github.event.inputs.duration || '60s' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Same orchestrator the integration job uses, with --keep so the stack survives the
      # run: booting it a second way is how the two drift apart.
      # M17b — see uat.yml: COMPOSE_BAKE routes the build through buildx, COMPOSE_EXTRA_FILES
      # is what gives buildx keys to honour. One without the other is a cold build wearing
      # the word "bake".
      - name: Boot the stack
        env:
          COMPOSE_BAKE: 'true'
          COMPOSE_EXTRA_FILES: docker-compose.cache.yml
        run: node test/integration/run.mjs --keep --boot-only

      # A shelf the run cannot empty.
      #
      # This workflow had never once been green when the shelf below was sized, and the
      # reason was not k6, the stack or
      # the runner: 10 VUs place ~970 orders in 60 seconds against a seed of 200 units per
      # product. Stock ran out in the opening seconds, checkout started answering
      # ORDER_INSUFFICIENT_STOCK, and a failed checkout leaves the server-side cart
      # standing — so every later iteration added another unit to each line and the
      # quantities compounded (`need 16, have 0`). p95 came in at 530ms against a 1500ms
      # threshold and the job still failed on `checkout_success 41%`, which is a stock
      # number wearing a latency job's clothes. An always-red gate reports a regression no
      # better than an always-green one.
      #
      # It has been green once since: run 32686490758, 2026-08-24. That single run is the
      # only latency measurement this workflow has ever produced, and M22 is what it is
      # used for — see the threshold note in scripts/load/dashboards.k6.js.
      #
      # Sized off the ceiling rather than the measurement: VUS x DURATION cannot approach
      # this even if the stack gets much faster.
      - name: Seed catalog + staff
        env:
          SEED_STOCK_QTY: '1000000'
        run: node scripts/seed.mjs

      # The key over HTTPS from k6's own host, not from a public keyserver.
      #
      # `gpg --recv-keys hkp://keyserver.ubuntu.com:80` is an unbounded call to a service
      # nobody here operates, and keyservers stall for minutes at a time. That is the same
      # shape as the Playwright download that hung twice today: an external fetch with no
      # ceiling and no retry, inside a step that reports nothing while it waits.
      #
      # dl.k6.io serves the key directly, so the keyserver leaves the dependency graph
      # entirely — one fewer thing that can be down when nothing is wrong with this repo.
      - name: Install k6
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL --max-time 60 https://dl.k6.io/key.gpg \
                 | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg; then
              break
            fi
            echo "k6 key fetch attempt $attempt failed, retrying..." >&2
            [ "$attempt" = 3 ] && { echo "could not fetch the k6 signing key" >&2; exit 1; }
            sleep 5
          done
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      # One token per VU: checkout consumes a server-side cart, so sharing tokens measures
      # cart contention instead of the catalog fan-out under test.
      #
      # Assigned to a variable FIRST, and that is the whole point. Written as
      # `echo "TOKENS=$(node ...)" >> $GITHUB_ENV` the step reports SUCCESS when the mint
      # throws: `echo` succeeded, so the exit code is zero, and the failure inside `$(...)`
      # is swallowed. It wrote an empty TOKENS, k6 fell back to the staff TOKEN, and ten
      # VUs drove customer checkout with a SUPER_ADMIN token — 59,847 failures that
      # surfaced forty minutes later as "thresholds crossed" and named nothing.
      #
      # An assignment carries the substitution's exit status, so `set -e` stops here now.
      - name: Mint tokens
        run: |
          tokens="$(node scripts/load/mint-tokens.mjs "$VUS")"
          staff="$(node scripts/load/mint-tokens.mjs --staff)"
          [ -n "$tokens" ] || { echo "mint produced no customer tokens" >&2; exit 1; }
          [ -n "$staff" ] || { echo "mint produced no staff token" >&2; exit 1; }
          # One per VU, or the run measures contention. Count them and say so.
          n="$(printf '%s' "$tokens" | tr ',' '\n' | grep -c .)"
          echo "minted $n customer token(s) for $VUS VU(s)"
          [ "$n" -ge "$VUS" ] || { echo "need >= $VUS tokens, got $n" >&2; exit 1; }
          echo "TOKENS=$tokens" >> "$GITHUB_ENV"
          echo "TOKEN=$staff" >> "$GITHUB_ENV"

      # The thresholds live in the scripts (p95 + success rate). k6 exits non-zero when one
      # breaks, so a regression fails this job rather than sitting in a log nobody opens.
      #
      # `--summary-export` writes the same numbers as machine-readable JSON for the record
      # step below. Measured against k6 2.2.0 (the version `apt` installs here): the flag is
      # still supported AND the human text summary still prints to the log, so the diagnostic
      # output that named the last three failures is not traded away for the JSON.
      - name: Checkout hot path
        run: k6 run --summary-export checkout.summary.json scripts/load/checkout.k6.js

      - name: Owner and HR dashboards
        run: k6 run --summary-export dashboards.summary.json scripts/load/dashboards.k6.js

      # The reason this workflow existed for weeks without producing a baseline.
      #
      # `docs/perf/BASELINE.md` said `_not yet run_` on the line that holds wall-clock, and it
      # said so THROUGH a green run (32686490758, 2026-08-24) that measured every number the
      # line was waiting for. Filling it in was a manual step at the end of an hour-long job,
      # and manual steps at the end of long jobs do not happen. So the run writes its own row.
      #
      # No `if: always()`. A red run is red on stock, tokens or the rate limiter far more often
      # than on latency — eleven of the first twelve were — and those numbers are depletion or
      # throttling wearing a latency job's clothes. Recording them would poison the series the
      # table exists to be. Green runs only; the log still has everything else.
      #
      # The row is written to the job summary either way, and pushed only from main. A branch
      # dispatch is usually someone debugging this workflow, and its numbers are not the trunk's.
      - name: Record the baseline
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          # Runner shape belongs in the row: GitHub resizes hosted runners, and two rows from
          # different hardware are not a series. Measured here rather than assumed.
          host="gh-$(. /etc/os-release && echo "$ID-$VERSION_ID")/$(nproc)c/$(awk '/MemTotal/{printf "%.0fg", $2/1048576}' /proc/meminfo)"
          echo "recording on $host"
          # Redirected, never piped: `node ... | tee` would report tee's exit status and
          # swallow a failed record entirely — the same trap the Mint tokens step above
          # documents, which once drove ten VUs with a SUPER_ADMIN token for forty minutes.
          node scripts/check-perf-baseline.mjs --record \
            --checkout checkout.summary.json --dashboards dashboards.summary.json \
            --run "$RUN_ID" --sha "$SHA" --vus "$VUS" --host "$host" > rows.md
          {
            echo "### Load baseline — $host, $VUS VUs, $DURATION"
            echo
            echo '| Date | Run | Commit | Scenario | VUs | N | Iterations | OK | p50 ms | p90 ms | p95 ms | Host |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |'
            cat rows.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat rows.md

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "not on main — the row is in the job summary above, not committed"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/perf/BASELINE.md
          # `if`, not `&&`: under `bash -e` a failing left operand makes the whole `&&` list
          # non-zero and aborts the step, so "nothing changed" would read as a broken run.
          if git diff --cached --quiet; then
            echo "baseline unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(perf): baseline dari larian Load $RUN_ID"

          # This job holds the runner for the better part of an hour, so main has usually
          # moved by now. Rebase and retry rather than fail: a lost race is not a regression,
          # and reddening a healthy load run teaches people to ignore this workflow.
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push --quiet origin HEAD:main; then
              echo "baseline row pushed to main"
              exit 0
            fi
            echo "push attempt $attempt lost the race, retrying..." >&2
            sleep 5
          done
          # A warning, not a failure: the numbers survive in the job summary above, and the
          # next run appends again. Silence is the thing to avoid, not a non-zero exit.
          echo "::warning::could not push the baseline row after 3 attempts — numbers are in the job summary"

      # ALWAYS, 4000 lines, per service, uploaded — not 200 lines of the whole stack tailed
      # into a console. The k6 run finally printed the refusal body:
      #
      #   add to cart failed (VU 4, iter 1): HTTP 500 INTERNAL_ERROR /api/v1/cart/items
      #
      # and the log step right after it captured nothing useful, because by the time it ran
      # the last 200 lines were long past the moment anything threw. The answer to WHY was
      # sitting in the container and got discarded.
      #
      # order and product on their own: `cart.view()` resolves every line through
      # product-service, so a failure is in one of those two.
      - name: Service logs
        if: always()
        run: |
          mkdir -p load-logs
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            logs --no-color --tail 4000 > load-logs/all-services.log 2>&1 || true
          for s in gateway order product; do
            docker compose -f docker-compose.yml -f docker-compose.test.yml \
              logs --no-color --tail 4000 "$s" > "load-logs/$s.log" 2>&1 || true
          done
          echo "captured: $(wc -l < load-logs/all-services.log) lines"

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: load-service-logs
          path: load-logs/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
