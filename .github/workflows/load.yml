name: Load

# The two k6 scripts have existed since PR-7 and have never been run by anything but a
# person deciding to. They measure the two fan-outs the audit named (checkout's per-product
# catalog reads, the owner and HR dashboards), and the whole point of those rewrites was
# that p95 stays FLAT as cart lines / depots / roster grow. Nothing was watching whether it
# still does.
#
# Weekly, against a stack this workflow boots itself. NOT against production: the box has
# 16 GB and is serving customers, and the checkout script writes real orders — a load test
# that pollutes the day's book is worse than no load test.
on:
  schedule:
    - cron: '0 19 * * 0' # Sunday 02:00 WIB, the quietest hour of the quietest day
  workflow_dispatch:
    inputs:
      vus:
        description: 'Virtual users'
        default: '10'
      duration:
        description: 'Duration per scenario'
        default: '60s'

env:
  AUTH_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_auth?schema=public
  CUSTOMER_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_customer?schema=public
  PRODUCT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_product?schema=public
  ORDER_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_order?schema=public
  PAYMENT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_payment?schema=public
  DELIVERY_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_delivery?schema=public
  DEPOT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_depot?schema=public
  LOYALTY_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_loyalty?schema=public
  PROMO_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_promo?schema=public
  REFERRAL_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_referral?schema=public
  CRM_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_crm?schema=public
  RECOMMENDATION_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_recommendation?schema=public
  FORECAST_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_forecast?schema=public
  PAYOUT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_payout?schema=public
  ADMIN_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_admin?schema=public
  HR_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_hr?schema=public

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Must match docker-compose.test.yml, exactly as ci.yml does it: `scripts/seed.mjs`
      # mints an admin token the booted stack has to trust. Without it the seed step exits
      # with "JWT_ACCESS_SECRET is required (must match the running stack)" - which is how
      # this workflow failed on its FIRST EVER run, and how it would have failed every
      # Sunday at 02:00 from then on, load-testing nothing.
      JWT_ACCESS_SECRET: itest-shared-access-secret-0123456789abcdef
      GATEWAY_URL: http://localhost:8080
      BASE_URL: http://localhost:8080
      VUS: ${{ github.event.inputs.vus || '10' }}
      DURATION: ${{ github.event.inputs.duration || '60s' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Same orchestrator the integration job uses, with --keep so the stack survives the
      # run: booting it a second way is how the two drift apart.
      - name: Boot the stack
        env:
          COMPOSE_BAKE: 'true'
        run: node test/integration/run.mjs --keep --boot-only

      - name: Seed catalog + staff
        run: node scripts/seed.mjs

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      # One token per VU: checkout consumes a server-side cart, so sharing tokens measures
      # cart contention instead of the catalog fan-out under test.
      #
      # Assigned to a variable FIRST, and that is the whole point. Written as
      # `echo "TOKENS=$(node ...)" >> $GITHUB_ENV` the step reports SUCCESS when the mint
      # throws: `echo` succeeded, so the exit code is zero, and the failure inside `$(...)`
      # is swallowed. It wrote an empty TOKENS, k6 fell back to the staff TOKEN, and ten
      # VUs drove customer checkout with a SUPER_ADMIN token — 59,847 failures that
      # surfaced forty minutes later as "thresholds crossed" and named nothing.
      #
      # An assignment carries the substitution's exit status, so `set -e` stops here now.
      - name: Mint tokens
        run: |
          tokens="$(node scripts/load/mint-tokens.mjs "$VUS")"
          staff="$(node scripts/load/mint-tokens.mjs --staff)"
          [ -n "$tokens" ] || { echo "mint produced no customer tokens" >&2; exit 1; }
          [ -n "$staff" ] || { echo "mint produced no staff token" >&2; exit 1; }
          # One per VU, or the run measures contention. Count them and say so.
          n="$(printf '%s' "$tokens" | tr ',' '\n' | grep -c .)"
          echo "minted $n customer token(s) for $VUS VU(s)"
          [ "$n" -ge "$VUS" ] || { echo "need >= $VUS tokens, got $n" >&2; exit 1; }
          echo "TOKENS=$tokens" >> "$GITHUB_ENV"
          echo "TOKEN=$staff" >> "$GITHUB_ENV"

      # The thresholds live in the scripts (p95 + success rate). k6 exits non-zero when one
      # breaks, so a regression fails this job rather than sitting in a log nobody opens.
      - name: Checkout hot path
        run: k6 run scripts/load/checkout.k6.js

      - name: Owner and HR dashboards
        run: k6 run scripts/load/dashboards.k6.js

      # ALWAYS, 4000 lines, per service, uploaded — not 200 lines of the whole stack tailed
      # into a console. The k6 run finally printed the refusal body:
      #
      #   add to cart failed (VU 4, iter 1): HTTP 500 INTERNAL_ERROR /api/v1/cart/items
      #
      # and the log step right after it captured nothing useful, because by the time it ran
      # the last 200 lines were long past the moment anything threw. The answer to WHY was
      # sitting in the container and got discarded.
      #
      # order and product on their own: `cart.view()` resolves every line through
      # product-service, so a failure is in one of those two.
      - name: Service logs
        if: always()
        run: |
          mkdir -p load-logs
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            logs --no-color --tail 4000 > load-logs/all-services.log 2>&1 || true
          for s in order product; do
            docker compose -f docker-compose.yml -f docker-compose.test.yml \
              logs --no-color --tail 4000 "$s" > "load-logs/$s.log" 2>&1 || true
          done
          echo "captured: $(wc -l < load-logs/all-services.log) lines"

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: load-service-logs
          path: load-logs/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
