name: Deploy

# Deploys to the single production VPS by SSHing in and running scripts/deploy.sh,
# which rebuilds only changed services (serial, memory-safe), health-checks the
# gateway, and auto-rolls-back on failure.
#
# Fires automatically only after the CI workflow succeeds on main, and ships THAT commit:
# `workflow_run.head_sha` is handed to deploy.sh as DEPLOY_SHA (M26). Before that, the gate
# checked the trigger while deploy.sh reset to whatever the tip was by then — so this
# comment used to claim "a red build never reaches prod" while an untested combination of
# two green PRs could. Manual dispatch still deploys the tip, deliberately.
#
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key),
# and VPS_REPO_PATH (absolute path to the checkout on the box).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy (changed), deploy-all (force full), migrate (apply pending DB migrations), rollback, env-inspect (read-only .env diagnosis), env-fix (join a multi-line PEM in .env), env-set (apply the ENV_SET_BLOCK secret to .env + recreate `services`), seed-demo (build the Play reviewer demo depot + account), smoke (drive the customer rewards flow end to end), backup-offsite (copy the newest dump off-box and read it back to prove it arrived), backup-objects (copy the object buckets off-box now, instead of waiting for 03:40), storage-policy (close anonymous bucket listing + prove it)"
        type: choice
        default: deploy
        options:
          [deploy, deploy-all, migrate, rollback, env-inspect, env-fix, env-set, seed-demo, smoke, backup-offsite, backup-objects, storage-policy, install-cron, explain-queries]
      sha:
        description: "rollback target SHA (blank = previous good)"
        required: false
        default: ""
      services:
        description: "env-set only: services to recreate afterwards (space separated, e.g. 'crm web')"
        required: false
        default: ""
      demo_phone:
        description: "seed-demo only: the phone the Play reviewer will sign in with"
        required: false
        default: "+6281199900001"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `actions: read` is why this file exists in this diff at all.
    #
    # Without a `permissions:` block the workflow token takes the repository default, which
    # here is read-only on CONTENTS and grants nothing on ACTIONS. So `gh run list --workflow
    # Images` answered 403, the step swallowed it, and the wait below reported "no Images run
    # for <sha> (skipped for this commit) - continuing" on 11 deploys out of 11 — including
    # ones where the Images run for that exact SHA had succeeded.
    permissions:
      contents: read
      actions: read
    # A hung job holds the queue for GitHub's default SIX HOURS otherwise; a CI run
    # stalled two of them on a two-minute download and nothing said so.
    # Must stay ABOVE `command_timeout` (120m) further down, or this cap silently overrides
    # it. It did: the raise from 40m to 120m was written after a full nineteen-image rebuild
    # blew the old ceiling, and a later commit added this 60 by copying the e2e job's number.
    # That reproduces the exact failure the 120m exists to prevent — the timeout kills the
    # SSH SESSION, not the remote deploy.sh, which keeps building, converges the stack and
    # writes last-good-sha while Actions reports failure. A red Deploy that means the deploy
    # SUCCEEDED is worse than no check at all.
    timeout-minutes: 130
    # Auto-runs only on a green CI; manual dispatch always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      # M11 — Images and Deploy both fire on the same CI completion, in parallel, with
      # nothing between them. In registry mode the box PULLS what Images publishes, so a
      # deploy that overtakes its own images fails the pull, rolls back cleanly, and stops:
      # nothing retriggers it, so the release simply does not happen and the run before it
      # stays live. This is the ordering that was missing, and it is why M10 must not ship
      # before it.
      #
      # A wait, not a `needs`: workflows cannot depend on each other, and Images is SKIPPED
      # for a commit that touches no Dockerfile. Skipped must keep deploying (there is
      # nothing new to pull); only a real failure may stop it.
      # Says WHY it is not waiting, rather than being absent. A gate that skips in silence is
      # indistinguishable from a gate that passed, and this one spent its whole life looking
      # like the second.
      - name: Images wait not applicable (build mode)
        if: github.event_name == 'workflow_run' && vars.IMAGE_PREFIX == ''
        run: |
          echo "IMAGE_PREFIX is unset, so this deployment BUILDS its images on the box"
          echo "(scripts/lib/deploy-common.sh:37 registry_mode; rebuild-stale.sh runs compose build)."
          echo "The images this workflow would wait for are pushed to GHCR and never pulled here,"
          echo "so waiting for them would gate on something the release does not use."
          echo "Set the IMAGE_PREFIX repo variable when registry mode is switched on and this"
          echo "step is replaced by the real wait below."

      - name: Wait for this commit's images
        if: github.event_name == 'workflow_run' && vars.IMAGE_PREFIX != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in $(seq 1 60); do
            # No `2>/dev/null`. It was the only one in this directory, and it turned every
            # API failure — a 403 from the missing `actions: read` above, most of all — into
            # the string "none none", which this loop reads as "no Images run, carry on".
            if ! out="$(gh run list --workflow Images --commit "$SHA" --json status,conclusion --jq '.[0] | "\(.status // "none") \(.conclusion // "none")"')"; then
              echo "!! could not ask GitHub about the Images run for $SHA."
              echo "   That is not the same as 'no images were built', and it must not be"
              echo "   treated as one — refusing to deploy on an unanswered question."
              exit 1
            fi
            read -r status conclusion <<<"$out"
            case "$status" in
              none)
                echo "no Images run for $SHA (skipped for this commit) — continuing"
                exit 0 ;;
              completed)
                if [ "$conclusion" = "success" ] || [ "$conclusion" = "skipped" ]; then
                  echo "images for $SHA: $conclusion — continuing"
                  exit 0
                fi
                echo "!! images for $SHA concluded '$conclusion'; refusing to deploy a release whose images were never published"
                exit 1 ;;
              *)
                echo "images for $SHA are $status (attempt $attempt/60) — waiting"
                sleep 20 ;;
            esac
          done
          echo "!! images for $SHA did not finish within 20 minutes"
          exit 1

      - name: Resolve command
        id: cmd
        run: |
          case "${{ github.event.inputs.mode }}" in
            rollback)    echo "run=bash scripts/rollback.sh ${{ github.event.inputs.sha }}" >> "$GITHUB_OUTPUT" ;;
            deploy-all)  echo "run=bash scripts/deploy.sh --all" >> "$GITHUB_OUTPUT" ;;
            # Manual only, never automatic: `prisma migrate deploy` across all services.
            # Idempotent, so a re-run is a no-op — but it stays a deliberate button because a
            # migration that meets dirty data aborts partway, and that is a decision, not a step.
            migrate)     echo "run=npm run db:migrate:prod" >> "$GITHUB_OUTPUT" ;;
            # Read-only: names the .env lines that are not KEY=VALUE, truncated to 32
            # characters. Enough to identify a malformed secret, never enough to leak one.
            env-inspect) echo "run=bash scripts/env-doctor.sh --inspect" >> "$GITHUB_OUTPUT" ;;
            # Writes: joins a PEM pasted with real newlines back into the single \n-escaped
            # line the format wants, out of the lines already on the box. Backs up first,
            # refuses a key with no END line, and is a no-op on an already-correct file.
            env-fix)     echo "run=bash scripts/env-doctor.sh --fix" >> "$GITHUB_OUTPUT" ;;
            # Measured 2026-08-17, unauthenticated, against production: `hydromart-pod` and
            # `hydromart-products` answered 200 to `?list-type=2` — the index of every
            # proof-of-delivery photo and every avatar, readable by a stranger with no
            # credentials. `hydromart-facer` answered 403 and is the shape the other two
            # should have. The fix needs the bucket's own keys, which live in the .env ON THE
            # BOX and nowhere else — so it is a button here rather than a chore someone
            # remembers. Runs per bucket, and FAILS if the bucket still lists afterwards.
            storage-policy) echo "run=bash scripts/storage-policy.sh" >> "$GITHUB_OUTPUT" ;;
            # MEASURED 2026-08-25: the installer schedules SIX jobs and the box's crontab had
            # THREE. check-tls-expiry.sh, check-log-retention.sh and rollback-drill.sh — all
            # added in #323 — had never once run. The installer is idempotent and rewrites the
            # whole hydromart block, so this is safe to press twice; what it is NOT is
            # something anybody remembers to do after adding a cron job. Hence a button.
            install-cron) echo "run=bash scripts/install-host-cron.sh" >> "$GITHUB_OUTPUT" ;;
            # L1.7: query plans measured on PRODUCTION volume, not on an empty database — an
            # earlier audit was fooled by exactly that. Read-only: EXPLAIN, no ANALYZE that
            # writes, no schema touched.
            explain-queries) echo "run=bash scripts/explain-hot-queries.sh" >> "$GITHUB_OUTPUT" ;;
            # L2.1/E7 asked on the box instead of inferred from `.env.production.example`,
            # which is a TEMPLATE — reading it as production is how this item was reported
            # wrong. Read-only. The channel is an ordinary setting and is printed; the
            # credentials are secrets, so only whether they are set and how long they are is
            # printed, never their value. Also asks the RUNNING container, because a .env
            # edited after the last `up -d` has not reached the process yet.
            # Writes: applies the KEY=VALUE lines held in the ENV_SET_BLOCK repo secret to
            # the live .env and recreates the services named in `services`.
            #
            # It exists so that setting a production value is a reviewed script and a button
            # rather than somebody editing .env over SSH at midnight — which is how a PEM
            # got pasted with real newlines, killed a deploy and blinded the watchdog for a
            # week (2026-08-11). The values live in the GitHub secret; nothing in this repo
            # and nothing in this log ever carries one. env-set.sh prints key names only,
            # backs the file up first, refuses a multi-line value outright, and is a no-op
            # on a value that is already correct.
            env-set)     echo "run=bash scripts/env-set.sh ${{ github.event.inputs.services }}" >> "$GITHUB_OUTPUT" ;;
            # G5. The Play reviewer signs in with REVIEWER_PHONE, and on production that is
            # a REAL employee on a REAL depot — so a reviewer reads live customers' names,
            # addresses and phone numbers, and a depot that happens to be out of stock that
            # day shows them an empty app, which is a rejection.
            #
            # This builds the account they should get instead: a demo depot, a demo
            # KEPALA_DEPOT, stock on its shelves. Idempotent and additive — it looks before
            # it creates and never edits or deletes a row it did not make.
            #
            # The secret it signs with comes from the box's own .env through load-env.sh
            # (which PARSES rather than executes), so it is never in this repo, this
            # workflow, or this log.
            seed-demo)   echo "run=. ./scripts/load-env.sh && DEMO_PHONE='${{ github.event.inputs.demo_phone }}' GATEWAY_URL=http://127.0.0.1:8080 node scripts/seed-demo-depot.mjs" >> "$GITHUB_OUTPUT" ;;
            # Verification step 3 of the go-live plan, which was a line telling somebody to
            # ssh in after a release and drive the rewards flow by hand. It needs the box's
            # own .env to learn an OTP (REVIEWER_PHONE/REVIEWER_OTP_CODE), which is exactly
            # why it never got run: the one machine that can do it is the one nobody is
            # logged into. Read-only against the customer flow it exercises.
            # Prove the offsite backup WORKS, on demand, instead of finding out at 03:00.
            #
            # Setting BACKUP_OFFSITE_DEST and the two S3 keys makes them PRESENT; it does not
            # make the bucket reachable, the credentials accepted, or the bytes readable back.
            # Those are three different failures, and the nightly cron is a bad place to learn
            # which one you have — it is the hour nobody is looking, and the answer arrives as
            # an alert rather than as a verdict somebody asked for.
            #
            # Safe to press any time: idempotent by construction (an object already correct is
            # verified and left alone), it never deletes, and it reads the dump back to compare
            # size + sha256 before saying OK. Exit 2 = not configured, 1 = not verifiable,
            # 0 = verified.
            backup-offsite) echo "run=. ./scripts/load-env.sh && bash scripts/backup-offsite.sh" >> "$GITHUB_OUTPUT" ;;
            backup-objects) echo "run=. ./scripts/load-env.sh && node scripts/backup-objects.mjs" >> "$GITHUB_OUTPUT" ;;
            smoke)       echo "run=bash scripts/smoke.sh" >> "$GITHUB_OUTPUT" ;;
            *)           echo "run=bash scripts/deploy.sh" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: SSH deploy
        # CI-13: pinned by commit, not by the mutable `v1.2.0` tag — this step is handed
        # the production SSH key, so "whatever that tag points at today" is not a
        # supply chain we want to inherit.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A normal deploy rebuilds a handful of images and finishes well inside ten
          # minutes. A change to a Dockerfile, .dockerignore or a root build input
          # invalidates ALL NINETEEN, and on this box that is over forty — the PR9 deploy
          # (7012a61) hit the old 40m ceiling mid-build.
          #
          # What made that worse than a slow deploy: the timeout kills the SSH SESSION,
          # not the remote script. deploy.sh kept building, converged the stack and wrote
          # last-good-sha, while the workflow had already reported failure — the one
          # signal anybody reads was wrong in the dangerous direction.
          command_timeout: 120m
          # Passed as an ENVIRONMENT variable, never interpolated into the script body: a
          # value with a quote, a backtick or a newline in it would otherwise be executed
          # rather than stored, which is the whole class of failure this button exists to
          # end. GitHub masks the secret in the log; env-set.sh never prints it either way.
          # DEPLOY_SHA rides the same way (M26): the commit whose CI went green, handed to
          # deploy.sh so it stops choosing its own target. Empty on manual dispatch, which
          # keeps "deploy whatever the tip is" as a deliberate button.
          envs: ENV_SET_BLOCK,DEPLOY_SHA
          script: |
            set -e
            cd "${{ secrets.VPS_REPO_PATH }}"
            # `env-set` is the one mode that can be pressed BEFORE the release carrying its
            # script has been deployed — it exists to fix configuration, which is often why
            # a deploy has not happened yet. The registry probe hit exactly this and failed
            # with "No such file or directory". Every other mode runs a script the box has
            # had for releases, and `deploy` must NOT do this: it resets the tree itself.
            if [ "${{ github.event.inputs.mode }}" = "env-set" ]; then
              git fetch --quiet origin main
              git checkout origin/main -- scripts/env-set.sh
            fi
            if [ "${{ github.event.inputs.mode }}" = "seed-demo" ]; then
              git fetch --quiet origin main
              git checkout origin/main -- scripts/seed-demo-depot.mjs
            fi
            if [ "${{ github.event.inputs.mode }}" = "backup-offsite" ]; then
              git fetch --quiet origin main
              git checkout origin/main -- scripts/backup-offsite.sh scripts/lib/backup-dir.sh
            fi

            # The nightly cron runs at 03:40. Installing it at 05:16 means the first copy is
            # tomorrow, and until then 41 files of delivery and payment evidence exist in
            # exactly one place. This mode is how you close that gap on the day you notice it
            # rather than sleeping through it.
            if [ "${{ github.event.inputs.mode }}" = "backup-objects" ]; then
              git fetch --quiet origin main
              git checkout origin/main -- scripts/backup-objects.mjs
            fi
            ${{ steps.cmd.outputs.run }}
        env:
          ENV_SET_BLOCK: ${{ secrets.ENV_SET_BLOCK }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
