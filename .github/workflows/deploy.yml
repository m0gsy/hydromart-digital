name: Deploy

# Deploys to the single production VPS by SSHing in and running scripts/deploy.sh,
# which rebuilds only changed services (serial, memory-safe), health-checks the
# gateway, and auto-rolls-back on failure.
#
# Fires automatically only after the CI workflow succeeds on main, so a red build
# never reaches prod. Also exposes a manual button for force-full-deploy and for
# rollback.
#
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key),
# and VPS_REPO_PATH (absolute path to the checkout on the box).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy (changed), deploy-all (force full), migrate (apply pending DB migrations), rollback, env-inspect (read-only .env diagnosis), env-fix (join a multi-line PEM in .env), env-set (apply the ENV_SET_BLOCK secret to .env + recreate `services`), seed-demo (build the Play reviewer demo depot + account), storage-policy (close anonymous bucket listing + prove it)"
        type: choice
        default: deploy
        options:
          [deploy, deploy-all, migrate, rollback, env-inspect, env-fix, env-set, seed-demo, storage-policy]
      sha:
        description: "rollback target SHA (blank = previous good)"
        required: false
        default: ""
      services:
        description: "env-set only: services to recreate afterwards (space separated, e.g. 'crm web')"
        required: false
        default: ""
      demo_phone:
        description: "seed-demo only: the phone the Play reviewer will sign in with"
        required: false
        default: "+6281199900001"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Auto-runs only on a green CI; manual dispatch always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve command
        id: cmd
        run: |
          case "${{ github.event.inputs.mode }}" in
            rollback)    echo "run=bash scripts/rollback.sh ${{ github.event.inputs.sha }}" >> "$GITHUB_OUTPUT" ;;
            deploy-all)  echo "run=bash scripts/deploy.sh --all" >> "$GITHUB_OUTPUT" ;;
            # Manual only, never automatic: `prisma migrate deploy` across all services.
            # Idempotent, so a re-run is a no-op — but it stays a deliberate button because a
            # migration that meets dirty data aborts partway, and that is a decision, not a step.
            migrate)     echo "run=npm run db:migrate:prod" >> "$GITHUB_OUTPUT" ;;
            # Read-only: names the .env lines that are not KEY=VALUE, truncated to 32
            # characters. Enough to identify a malformed secret, never enough to leak one.
            env-inspect) echo "run=bash scripts/env-doctor.sh --inspect" >> "$GITHUB_OUTPUT" ;;
            # Writes: joins a PEM pasted with real newlines back into the single \n-escaped
            # line the format wants, out of the lines already on the box. Backs up first,
            # refuses a key with no END line, and is a no-op on an already-correct file.
            env-fix)     echo "run=bash scripts/env-doctor.sh --fix" >> "$GITHUB_OUTPUT" ;;
            # Measured 2026-08-17, unauthenticated, against production: `hydromart-pod` and
            # `hydromart-products` answered 200 to `?list-type=2` — the index of every
            # proof-of-delivery photo and every avatar, readable by a stranger with no
            # credentials. `hydromart-facer` answered 403 and is the shape the other two
            # should have. The fix needs the bucket's own keys, which live in the .env ON THE
            # BOX and nowhere else — so it is a button here rather than a chore someone
            # remembers. Runs per bucket, and FAILS if the bucket still lists afterwards.
            storage-policy) echo "run=bash scripts/storage-policy.sh" >> "$GITHUB_OUTPUT" ;;
            # Writes: applies the KEY=VALUE lines held in the ENV_SET_BLOCK repo secret to
            # the live .env and recreates the services named in `services`.
            #
            # It exists so that setting a production value is a reviewed script and a button
            # rather than somebody editing .env over SSH at midnight — which is how a PEM
            # got pasted with real newlines, killed a deploy and blinded the watchdog for a
            # week (2026-08-11). The values live in the GitHub secret; nothing in this repo
            # and nothing in this log ever carries one. env-set.sh prints key names only,
            # backs the file up first, refuses a multi-line value outright, and is a no-op
            # on a value that is already correct.
            env-set)     echo "run=bash scripts/env-set.sh ${{ github.event.inputs.services }}" >> "$GITHUB_OUTPUT" ;;
            # G5. The Play reviewer signs in with REVIEWER_PHONE, and on production that is
            # a REAL employee on a REAL depot — so a reviewer reads live customers' names,
            # addresses and phone numbers, and a depot that happens to be out of stock that
            # day shows them an empty app, which is a rejection.
            #
            # This builds the account they should get instead: a demo depot, a demo
            # KEPALA_DEPOT, stock on its shelves. Idempotent and additive — it looks before
            # it creates and never edits or deletes a row it did not make.
            #
            # The secret it signs with comes from the box's own .env through load-env.sh
            # (which PARSES rather than executes), so it is never in this repo, this
            # workflow, or this log.
            seed-demo)   echo "run=. ./scripts/load-env.sh && DEMO_PHONE='${{ github.event.inputs.demo_phone }}' GATEWAY_URL=http://127.0.0.1:8080 node scripts/seed-demo-depot.mjs" >> "$GITHUB_OUTPUT" ;;
            *)           echo "run=bash scripts/deploy.sh" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: SSH deploy
        # CI-13: pinned by commit, not by the mutable `v1.2.0` tag — this step is handed
        # the production SSH key, so "whatever that tag points at today" is not a
        # supply chain we want to inherit.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A normal deploy rebuilds a handful of images and finishes well inside ten
          # minutes. A change to a Dockerfile, .dockerignore or a root build input
          # invalidates ALL NINETEEN, and on this box that is over forty — the PR9 deploy
          # (7012a61) hit the old 40m ceiling mid-build.
          #
          # What made that worse than a slow deploy: the timeout kills the SSH SESSION,
          # not the remote script. deploy.sh kept building, converged the stack and wrote
          # last-good-sha, while the workflow had already reported failure — the one
          # signal anybody reads was wrong in the dangerous direction.
          command_timeout: 120m
          # Passed as an ENVIRONMENT variable, never interpolated into the script body: a
          # value with a quote, a backtick or a newline in it would otherwise be executed
          # rather than stored, which is the whole class of failure this button exists to
          # end. GitHub masks the secret in the log; env-set.sh never prints it either way.
          envs: ENV_SET_BLOCK
          script: |
            set -e
            cd "${{ secrets.VPS_REPO_PATH }}"
            # `env-set` is the one mode that can be pressed BEFORE the release carrying its
            # script has been deployed — it exists to fix configuration, which is often why
            # a deploy has not happened yet. The registry probe hit exactly this and failed
            # with "No such file or directory". Every other mode runs a script the box has
            # had for releases, and `deploy` must NOT do this: it resets the tree itself.
            if [ "${{ github.event.inputs.mode }}" = "env-set" ]; then
              git fetch --quiet origin main
              git checkout origin/main -- scripts/env-set.sh
            fi
            if [ "${{ github.event.inputs.mode }}" = "seed-demo" ]; then
              git fetch --quiet origin main
              git checkout origin/main -- scripts/seed-demo-depot.mjs
            fi
            ${{ steps.cmd.outputs.run }}
        env:
          ENV_SET_BLOCK: ${{ secrets.ENV_SET_BLOCK }}
