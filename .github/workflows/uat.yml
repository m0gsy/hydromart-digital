name: UAT

# H4. The v2.1 UAT harness in `.uat/` drives 439 scripted cases over real HTTP against a
# real stack. It has only ever run on somebody's laptop, against whatever containers
# happened to be up — and the last run's notes open with the gotcha that cost that session
# a morning: a stale stack from a previous session was still serving :8080, so the first
# results came from months-old images.
#
# Booting the stack from the repo's own orchestrator removes that whole class of doubt.
#
# Deliberately REPORT-ONLY. Five cases in the script contradict deliberate design
# decisions (see the open-decisions note), so a red X on this workflow would mean "the
# script disagrees with us", not "the product is broken" — and a gate that cries wolf
# monthly is a gate everybody learns to ignore. The results are an artifact you read.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 1 * *' # 03:00 WIB on the 1st of the month

env:
  AUTH_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_auth?schema=public
  CUSTOMER_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_customer?schema=public
  PRODUCT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_product?schema=public
  ORDER_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_order?schema=public
  PAYMENT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_payment?schema=public
  DELIVERY_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_delivery?schema=public
  DEPOT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_depot?schema=public
  LOYALTY_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_loyalty?schema=public
  PROMO_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_promo?schema=public
  REFERRAL_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_referral?schema=public
  CRM_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_crm?schema=public
  RECOMMENDATION_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_recommendation?schema=public
  FORECAST_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_forecast?schema=public
  PAYOUT_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_payout?schema=public
  ADMIN_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_admin?schema=public
  HR_DATABASE_URL: postgresql://hydromart:hydromart@localhost:5432/hydromart_hr?schema=public

jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GATEWAY_URL: http://localhost:8080
      # The stack the orchestrator boots is docker-compose.test.yml; the harness defaults
      # to the dev secret, so it has to be told which one it is talking to.
      JWT_ACCESS_SECRET: itest-shared-access-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Boot the stack
        env:
          COMPOSE_BAKE: 'true'
        run: node test/integration/run.mjs --keep --boot-only

      - name: Seed catalog + staff
        run: node scripts/seed.mjs

      - name: Run the UAT harness
        run: node .uat/run.mjs

      # Verification step 4 of the go-live plan. It is the only check in this repo that asks
      # what a screen actually SHOWS the person who owns it, at the widths that person holds
      # — and it needs a browser, which is why it has never run anywhere but a laptop.
      #
      # Here rather than in `CI`: it drives dozens of routes at several widths per role, and
      # a per-PR gate that slow gets disabled within the week. Report-only, same as the UAT
      # run above; what it produces is screenshots and a per-route verdict to read.
      - name: Build + serve the web app
        run: |
          npm run build --workspace @hydromart/web
          nohup npm run start --workspace @hydromart/web >/tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000 >/dev/null 2>&1 && break
            sleep 2
          done
          # The loop's last command is `sleep 2`, which succeeds — so after sixty seconds of
          # the app never answering, the step still exits 0 and nothing checks whether the
          # break was ever taken. In uat.yml the only consumer is the browser pass, which is
          # continue-on-error, so a dead server and five genuinely broken roles look
          # identical and /tmp/web.log is never read by anyone.
          curl -fsS http://localhost:3000 >/dev/null || { echo "web never came up:"; cat /tmp/web.log; exit 1; }

      # Cached, capped, and retried — because this one step has now eaten a whole day twice.
      #
      # It hung for over TWO HOURS on one run (all 45 preceding steps green, nothing said
      # so), and on the next it hung until the job's 45-minute cap killed it — which GitHub
      # records as `cancelled`, so the whole CI run concluded cancelled, and Deploy and
      # Images skipped without anyone marking anything red. A browser download stalling on a
      # CDN is not a reason to lose a release.
      #
      # The cache is keyed on the Playwright version, because that is what decides which
      # browser build is fetched.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        timeout-minutes: 8
        run: |
          # Three short attempts beat one unbounded wait: a stalled CDN connection is almost
          # always fixed by reconnecting, and if it is not, 8 minutes says so instead of 45.
          for attempt in 1 2 3; do
            if npm run test:e2e:install --workspace @hydromart/web; then exit 0; fi
            echo "playwright install attempt $attempt failed or stalled, retrying..." >&2
            sleep 10
          done
          echo "playwright install failed three times" >&2
          exit 1

      # `continue-on-error` keeps a browser problem from failing the whole UAT job, which is
      # right — but `|| true` INSIDE the loop went further and made a crash look like a pass.
      # Every role crashed at `waitForURL` for want of an OTP it could type, and the step
      # reported success five times over.
      #
      # Now each role's status is kept and the step ends non-zero if any of them failed:
      # visible in the checks list, still not fatal to the job.
      - name: Per-role browser pass
        continue-on-error: true
        run: |
          failed=""
          for role in hq operator manager courier customer; do
            echo "=== $role"
            if ! node scripts/role-browser-pass.mjs "$role" id; then
              failed="$failed $role"
            fi
          done
          if [ -n "$failed" ]; then
            echo "role browser pass FAILED for:$failed" >&2
            exit 1
          fi
          echo "role browser pass OK for every role"


      - name: Summarise
        if: always()
        run: |
          if [ -f .uat/results.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('.uat/results.json','utf8'));
              const rows = Array.isArray(r) ? r : Object.values(r).flat();
              const by = {};
              for (const row of rows) by[row.status ?? 'UNKNOWN'] = (by[row.status ?? 'UNKNOWN'] ?? 0) + 1;
              console.log('cases:', rows.length);
              for (const [k, v] of Object.entries(by).sort()) console.log(' ', k, v);
            "
          else
            echo 'No results.json — the harness did not get far enough to write one.'
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: uat-results
          path: |
            .uat/results.json
            .uat/ctx.json
            role-pass-*.json
          # `.uat` starts with a dot, and upload-artifact treats a dot-directory as hidden
          # and skips it unless told otherwise. So this step said "No artifacts will be
          # uploaded" on every run while the Summarise step immediately above it read the
          # very same file and printed 366 cases from it.
          #
          # The cost of that was not the missing file. It was that the only way left to see
          # WHICH cases failed was to re-run the whole job and read a truncated console -
          # which is what turned one question into several forty-minute round trips.
          include-hidden-files: true
          retention-days: 30
      # ALWAYS, not on failure. This job SUCCEEDS while cases inside it fail — the harness
      # reports its tally and exits zero — so `if: failure()` meant the one step that could
      # explain a 500 never ran, precisely when it was needed. Two INTERNAL_ERRORs (courier
      # expense claim, driver incident) were found with no way to see why.
      #
      # Written to files and uploaded rather than tailed into the console: 200 lines of a
      # seventeen-service stack is not enough to hold the moment a request threw, and the
      # console truncates what little there is.
      - name: Service logs
        if: always()
        run: |
          mkdir -p uat-logs
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            logs --no-color --tail 4000 > uat-logs/all-services.log 2>&1 || true
          # The two services whose 500s are open, on their own, so a reader does not have to
          # find them inside the pile.
          for s in gateway payout delivery; do
            docker compose -f docker-compose.yml -f docker-compose.test.yml \
              logs --no-color --tail 4000 "$s" > "uat-logs/$s.log" 2>&1 || true
          done
          echo "captured: $(wc -l < uat-logs/all-services.log) lines"

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: uat-service-logs
          path: uat-logs/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
