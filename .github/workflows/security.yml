name: Security

# H-42 — SAST, secret scanning, SBOM and image scanning. None of these existed.
#
# Deliberately a SEPARATE workflow from CI, not four more jobs inside it. The Deploy
# workflow fires on `workflows: ["CI"]` completing successfully, so anything added to CI
# becomes a production deploy gate. A scanner that pulls its rule set from the network and
# grades third-party CVEs will eventually go red on something that is not this repo's
# change — and that must show up as a red check a human has to answer, not as "production
# can no longer be deployed". Reviewers still see the failure on the PR.
#
# Every tool runs as a pinned container image rather than a marketplace action: fewer
# third-party actions holding a token, and the version is visible in the diff.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dependencies and CVE feeds move without us pushing anything. Weekly re-scan of `main`
  # is what turns "clean when we merged it" into "clean today".
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Secrets: scans the working tree, not the history. A history scan does not belong on a
  # PR — the only remedy for a committed secret is rotation plus a rewrite, and failing
  # every future PR on a leak that is already disclosed teaches people to ignore the check.
  #
  # But "not on a PR" was read as "never", and so nothing has ever looked: a secret
  # committed and then deleted is invisible to every run of this job. The `secrets-history`
  # job below closes that on the WEEKLY schedule, where a finding is a rotation ticket
  # rather than a blocked merge.
  secrets:
    runs-on: ubuntu-latest
    # A hung job holds the queue for GitHub's default SIX HOURS otherwise; a CI run
    # stalled two of them on a two-minute download and nothing said so.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 \
            detect --source . --no-git --redact --config .gitleaks.toml \
                   --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30

  # The half nothing has ever run. `--no-git` above reads the working tree, so a credential
  # that was committed and later deleted has never been looked for — and deletion is the
  # most common way one is "handled", which is exactly why it needs finding.
  #
  # SCHEDULE ONLY, and that is the point rather than a compromise. On a PR this would go red
  # for a disclosure that already happened, on every PR, forever — the shape that teaches
  # people to ignore a check. Once a week it is a rotation ticket with an owner.
  #
  # `fetch-depth: 0`: the default checkout is shallow, and a shallow history scan finds
  # nothing while reporting success — the same failure this job exists to end.
  secrets-history:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Prove the history is actually here
        run: |
          COUNT="$(git rev-list --count HEAD)"
          echo "commits available to scan: $COUNT"
          # A one-commit checkout would let the scan below pass while reading almost nothing.
          [ "$COUNT" -gt 100 ] || { echo "shallow checkout — a history scan over $COUNT commit(s) proves nothing"; exit 1; }

      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo             zricethezav/gitleaks:v8.21.2             detect --source . --redact --config .gitleaks.toml                    --report-format sarif --report-path /repo/gitleaks-history.sarif --exit-code 1

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: gitleaks-history-sarif
          path: gitleaks-history.sarif
          if-no-files-found: ignore
          retention-days: 30

  # SAST: ERROR-severity findings only. Semgrep's WARNING tier on a 1,400-file TypeScript
  # monorepo is mostly style, and a gate nobody can get to zero is a gate nobody reads.
  sast:
    runs-on: ubuntu-latest
    # A hung job holds the queue for GitHub's default SIX HOURS otherwise; a CI run
    # stalled two of them on a two-minute download and nothing said so.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.97.0 \
            semgrep scan --error --severity=ERROR --metrics=off \
              --config p/typescript --config p/nodejs --config p/security-audit \
              --config p/dockerfile --config p/secrets \
              --sarif --output /src/semgrep.sarif .

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

  # SBOM: an artifact, never a gate. Its job is to answer "are we affected?" on the day a
  # CVE lands, which needs the file to exist for past builds — not to fail a PR.
  sbom:
    runs-on: ubuntu-latest
    # A hung job holds the queue for GitHub's default SIX HOURS otherwise; a CI run
    # stalled two of them on a two-minute download and nothing said so.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: syft (CycloneDX)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            anchore/syft:v1.18.1 \
            scan dir:/src --output cyclonedx-json=/src/sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  # Image scanning. All 19 runtime images are FROM the same node:22-alpine, so the OS
  # layer is one scan, not nineteen — the per-image delta is our own JS, which `sast` and
  # `npm run audit:ci` already cover. --ignore-unfixed because an alpine CVE with no
  # published fix is not something a rebuild can resolve.
  image:
    runs-on: ubuntu-latest
    # A hung job holds the queue for GitHub's default SIX HOURS otherwise; a CI run
    # stalled two of them on a two-minute download and nothing said so.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: trivy (runtime base image)
        run: |
          # EVERY distinct base, not the first one sorted.
          #
          # `sort -u | head -1` collapsed all 38 FROM lines to a single string. That is
          # lossless only while every Dockerfile shares one base, and nothing enforces it:
          # move one service to node:22-alpine and it sorts AFTER node:20-alpine, so head -1
          # keeps returning the old base, the new one is never scanned, and the job prints
          # "scanning node:20-alpine" and passes. Add a base sorting BEFORE it and the base
          # eighteen services actually run on stops being scanned instead.
          for BASE in $(grep -hoP '^FROM \K\S+' services/*/Dockerfile apps/*/Dockerfile | sort -u); do
            echo "scanning $BASE"
            # .trivyignore carries the residuals we consume but cannot patch, each with a
            # written reason and the condition that deletes it — same rule as the npm audit
            # allowlist. Anything not listed there still fails this job.
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              --pkg-types os --ignorefile /.trivyignore "$BASE"
          done

      - name: trivy (Dockerfile + compose misconfiguration)
        run: |
          docker run --rm -v "$PWD:/src" \
            aquasec/trivy:0.58.1 config \
            --severity HIGH,CRITICAL --exit-code 1 /src
