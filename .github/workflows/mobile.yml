name: Mobile release

# F6: builds and signs the two Android App Bundles.
#
# Deliberately separate from the four existing workflows, and deliberately NOT triggered
# by pull_request. It holds the upload keystore and the Firebase config, it takes twenty
# minutes to run, and nothing it produces gates a backend deploy — wiring it into `CI`
# would mean an Android toolchain failure blocking a hotfix to the gateway. What DOES run
# on every PR is the export build inside `CI`, which is the part that catches the
# regressions a person can cause by editing a page.
#
# Tag a release to build one:
#
#   git tag mobile-v1.4.2 && git push origin mobile-v1.4.2
#
# The versionCode is derived from the run number, not the tag: Play refuses a versionCode
# it has already seen, and a re-run of the same tag has to produce a higher one. It is
# `run_number * 100 + run_attempt`, because run_number does NOT move on a Re-run (N7).
#
# Required secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64  base64 of google-services.json (one file, both apps)
#
# Optional secret, and the only thing standing between a tag and an internal-track
# release. Leave it unset until both apps exist in Play and the first release has been
# reviewed by hand:
#   PLAY_SERVICE_ACCOUNT_JSON  the whole service-account key JSON, as text
#
# Required variables (Settings → Secrets and variables → Actions → Variables):
#   MOBILE_API_URL   https://<API_DOMAIN>  — see the guard below, this one is load-bearing
#   MOBILE_WEB_HOST  <WEB_DOMAIN>          — the host the App Links intent-filter claims
#   SENTRY_DSN_MOBILE  https://<key>@<org>.ingest.sentry.io/<project-id>
#     Required by `bundle` only, and NOT YET CREATED — measured 2026-08-29, `gh variable list`
#     returns MOBILE_API_URL, MOBILE_WEB_HOST and PUBLIC_API_URL and nothing else. So the next
#     `mobile-v*` tag fails at "Required configuration is present" until someone adds it, and
#     that is the point: `NEXT_PUBLIC_*` is inlined at build time, so an AAB built without it
#     can never report an error from any device, ever. `testable` still builds without it and
#     says so — an APK on a desk is not a publication.
#
# Enrol in Play App Signing before the first upload. With it, the keystore above is only
# an UPLOAD key and losing it is recoverable. Without it, losing it means the app can
# never be updated again by anyone, ever.

on:
  push:
    tags: ['mobile-v*']
  # The compile job below only. Scoped to paths so a backend PR never waits on an
  # Android toolchain, and so this can never become the thing blocking a gateway hotfix.
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName shown in the Play listing (e.g. 1.4.2)'
        required: false
        default: '0.0.0-dev'
      # N8: the release had exactly one speed — everybody at once — and exactly one way to
      # stop it, the version gate. These three are the ordinary levers, and the defaults
      # reproduce today's behaviour byte for byte.
      track:
        description: 'Play track to publish to'
        required: false
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      rollout_status:
        description: 'completed = everybody on the track at once; inProgress = staged (needs a fraction)'
        required: false
        type: choice
        default: completed
        options: [completed, inProgress, draft, halted]
      user_fraction:
        description: 'Share of users for a staged rollout, e.g. 0.1. IGNORED unless rollout_status is inProgress, and IGNORED by the internal track.'
        required: false
        default: ''

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Does the Android project actually build?
  #
  # Everything below this job needs secrets that only exist once there is a Play account,
  # so until the first tag it never runs — and that left the entire native half of the
  # app compiled by nobody, ever. A Gradle property that does not resolve, a manifest
  # placeholder with no value, a plugin whose AAR needs an SDK version this project does
  # not set: all of them are silent in every check the repo has, and all of them surface
  # here in about four minutes.
  #
  # `assembleRelease` rather than debug, unsigned: it is the build type that runs R8 and
  # shrinks resources, which is the one that can delete something a plugin resolves by
  # name. Web assets are deliberately not synced — this asks whether the native project
  # compiles, and the export has its own gate in `CI`.
  compile:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Pinned rather than inherited. The Capacitor CLI refuses to run below Node 22, and
      # this job passed only because it happened not to set a version and the runner's
      # default was high enough — which is a thing that changes without anyone here
      # deciding it. `.nvmrc` is NOT used: it pins 20 for the services and the web build,
      # and nothing in this job builds either.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install Capacitor dependencies
        # Cap on the STEP, not only the job. A job that hits its cap is recorded as
        # `cancelled`, not failed: nothing turns red and everything gated on success —
        # Deploy, Images — skips in silence. A step cap fails the step, which fails the
        # job, which is red and says which step it was.
        timeout-minutes: 15
        working-directory: mobile
        run: npm ci

      # `cap update` regenerates the native project: the `capacitor-cordova-android-plugins`
      # bridge module that `capacitor.build.gradle` reads, and the settings.gradle listing
      # every plugin. Both are generated, both are correctly gitignored, and without them
      # Gradle fails on a script that is not in the repo and never should be.
      #
      # It also runs a copy step, so it insists on a web export existing even though this
      # job does not care what is in one. A placeholder satisfies that and keeps the job
      # at four minutes instead of ten — what is being asked here is whether the NATIVE
      # project compiles. The real export has its own gate in `CI`, and the `testable`
      # job below builds it for the APKs that go on a phone.
      - name: Generate the native project
        working-directory: mobile
        run: |
          mkdir -p ../apps/web/mobile-out-customer
          echo '<!doctype html><title>placeholder</title>' > ../apps/web/mobile-out-customer/index.html
          npx cap update android

      - name: Customer binary compiles
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PhydromartAppId=id.hydromart.app \
            -PhydromartAppName=Hydromart \
            -PhydromartWebHost=hydromart.example \
            -PhydromartLinkPrefix=/products \
            -PhydromartLinkPrefix2=/orders \
            -PhydromartLinkPrefix3=/cart \
            -PhydromartLinkPrefix4=/checkout \
            -PhydromartLinkPrefix5=/account \
            -PhydromartLinkPrefix6=/promo \
            -PhydromartLinkPrefix7=/rewards \
            -PhydromartLinkPrefix8=/vouchers \
            -PhydromartLinkPrefix9=/referral \
            -PhydromartLinkPrefix10=/subscriptions \
            -PhydromartLinkPrefix11=/waralaba \
            -PhydromartLinkPrefix12=/help \
            -PhydromartLinkPrefix13=/notifications \
            -PhydromartLinkPrefix14=/addresses \
            -PhydromartLinkPrefix15=/favorites \
            -PhydromartLinkPrefix16=/login \
            -PhydromartLinkPrefix17=/register \
            -PhydromartLinkPrefix18=/kebijakan-privasi \
            -PhydromartLinkPrefix19=/hapus-akun \
            -PhydromartLinkExact=/

      - name: Permissions are the ones we justified
        working-directory: mobile
        run: node scripts/audit-manifest.mjs android/app/build/intermediates/merged_manifests/release

      - name: Ops binary compiles
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PhydromartAppId=id.hydromart.ops \
            -PhydromartAppName='Hydromart Ops' \
            -PhydromartWebHost=hydromart.example \
            -PhydromartLinkPrefix=/driver \
            -PhydromartLinkPrefix2=/m

  # An APK you can put on a phone, today, without a Play account.
  #
  # The device checklist in docs/MOBILE_APPS_PLAN.md is the largest untested risk left in
  # this project, and several of its items — `getUserMedia` in a bare WebView, the local
  # server's path resolution, Tailwind v4 on an old WebView — cannot be fixed after
  # release. Until now there was no way to run any of it: the release APK is unsigned and
  # will not install, and signing needs a keystore that does not exist yet.
  #
  # `assembleDebug` is signed with Android's automatic debug key, so it installs by
  # sideloading. It is a real build of the real app against the real API — only the
  # signature is throwaway. Run it from the Actions tab; both APKs land as artifacts.
  #
  # Not on pull_request: it builds two web exports and takes ten minutes, and every PR
  # paying that to produce an APK nobody downloads is waste.
  testable:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Without this the app installs, opens, and fails every request with a network
      # error that names nothing — `api.ts` falls back to http://localhost:8080 and
      # Android blocks cleartext. A test build that cannot reach the API tests nothing.
      - name: MOBILE_API_URL is set
        env:
          MOBILE_API_URL: ${{ vars.MOBILE_API_URL }}
        run: test -n "$MOBILE_API_URL" || { echo "MOBILE_API_URL is empty — the APK could not reach the API"; exit 1; }

      - name: Install workspace dependencies
        # Cap on the STEP, not only the job. A job that hits its cap is recorded as
        # `cancelled`, not failed: nothing turns red and everything gated on success —
        # Deploy, Images — skips in silence. A step cap fails the step, which fails the
        # job, which is red and says which step it was.
        timeout-minutes: 15
        run: npm ci

      - name: Install Capacitor dependencies
        # Cap on the STEP, not only the job. A job that hits its cap is recorded as
        # `cancelled`, not failed: nothing turns red and everything gated on success —
        # Deploy, Images — skips in silence. A step cap fails the step, which fails the
        # job, which is red and says which step it was.
        timeout-minutes: 15
        working-directory: mobile
        run: npm ci

      # Both exports first, while Node is the version the repo pins. They land in separate
      # directories, so neither waits on the other's APK.
      #
      # N2/N3: an artefact that cannot report its own errors must not be PUBLISHED. The rule is
      # right and its guard used to sit here — in the one job of this workflow that publishes
      # nothing, since a debug APK goes to a phone on a desk. Meanwhile `bundle` below, which
      # signs the AAB and hands it to Play, read the same variable with nothing checking it
      # (M3b). And `gh variable list` does not return SENTRY_DSN_MOBILE (measured 2026-08-25),
      # so the effect was exactly inverted: no test APK could be built at all, while every
      # released binary shipped blind. The refusal now lives in `bundle`; this only says what
      # you are holding — and saying it is not optional either: check-workflows.mjs requires
      # this job to `warn` and requires it NOT to refuse, so a build handed to a tester can
      # never again be silently blind, and can never again be refused for being blind.
      - name: Client error reporting
        env:
          DSN: ${{ vars.SENTRY_DSN_MOBILE }}
        run: |
          if [ -n "$DSN" ]; then
            echo "SENTRY_DSN_MOBILE is set — this APK reports its own errors."
          else
            echo "::warning::SENTRY_DSN_MOBILE is unset: this APK is BLIND. NEXT_PUBLIC_SENTRY_DSN is inlined at build time and SentryInit does not load the SDK at all when it is empty, so nothing this build crashes on will reach Sentry. Read logcat instead, or set the variable and re-run."
          fi

      - name: Export both binaries
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL }}
          # N2: the APK is a FROZEN export — whatever is inlined here is what the binary
          # reports with for its whole life on a device. No DSN means no reporter at all,
          # which is the state every shipped build has been in.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_MOBILE }}
          NEXT_PUBLIC_SENTRY_ENV: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
        run: |
          npm run build:mobile --workspace @hydromart/web -- customer
          npm run build:mobile --workspace @hydromart/web -- ops

      # The Capacitor CLI refuses to run on anything below Node 22, and `.nvmrc` pins 20
      # because that is what the services and the web build are tested against. Both
      # constraints are real, so the job satisfies them in turn rather than picking a
      # winner: the exports above are built on 20, everything from here down runs on 22.
      # Nothing after this point is JavaScript we ship.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Customer — sync
        run: npm run sync:customer --prefix mobile

      - name: Customer — debug APK
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PhydromartAppId=id.hydromart.app \
            -PhydromartAppName=Hydromart \
            -PhydromartWebHost=${{ vars.MOBILE_WEB_HOST || 'hydromart.example' }} \
            -PhydromartLinkPrefix=/products \
            -PhydromartLinkPrefix2=/orders \
            -PhydromartLinkPrefix3=/cart \
            -PhydromartLinkPrefix4=/checkout \
            -PhydromartLinkPrefix5=/account \
            -PhydromartLinkPrefix6=/promo \
            -PhydromartLinkPrefix7=/rewards \
            -PhydromartLinkPrefix8=/vouchers \
            -PhydromartLinkPrefix9=/referral \
            -PhydromartLinkPrefix10=/subscriptions \
            -PhydromartLinkPrefix11=/waralaba \
            -PhydromartLinkPrefix12=/help \
            -PhydromartLinkPrefix13=/notifications \
            -PhydromartLinkPrefix14=/addresses \
            -PhydromartLinkPrefix15=/favorites \
            -PhydromartLinkPrefix16=/login \
            -PhydromartLinkPrefix17=/register \
            -PhydromartLinkPrefix18=/kebijakan-privasi \
            -PhydromartLinkPrefix19=/hapus-akun \
            -PhydromartLinkExact=/
          mv app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/hydromart-customer-debug.apk"

      - name: Ops — sync
        run: npm run sync:ops --prefix mobile

      - name: Ops — debug APK
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PhydromartAppId=id.hydromart.ops \
            -PhydromartAppName='Hydromart Ops' \
            -PhydromartWebHost=${{ vars.MOBILE_WEB_HOST || 'hydromart.example' }} \
            -PhydromartLinkPrefix=/driver \
            -PhydromartLinkPrefix2=/m
          mv app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/hydromart-ops-debug.apk"

      - name: Upload the APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hydromart-debug-apks
          path: |
            hydromart-customer-debug.apk
            hydromart-ops-debug.apk
          if-no-files-found: error
          retention-days: 14

  bundle:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      # Full history, or `merge-base --is-ancestor` has nothing to reason about: the
      # default shallow checkout carries one commit and every ancestry question is a lie.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # E7 — this job produces a SIGNED, uploadable bundle and, before this step, ran no
      # typecheck, no lint, no unit test and no export suite: every real gate lives in
      # ci.yml, which a tag push does not trigger. So a tag on any commit on any branch
      # published an artifact nothing had tested. Rather than copy a subset of the gates
      # here, require that the whole of CI already went green for this exact commit, and
      # that the commit is on main. scripts/mobile-release-gate.{sh,test.sh}
      - name: This commit has earned a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash scripts/mobile-release-gate.sh "${{ github.sha }}" refs/remotes/origin/main

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      # `api.ts` falls back to `http://localhost:8080` when this is unset, and Android
      # blocks cleartext — so the app would install, open, and fail every request with a
      # network error that names nothing. Same guard as `apps/web/Dockerfile`.
      - name: Required configuration is present
        env:
          MOBILE_API_URL: ${{ vars.MOBILE_API_URL }}
          MOBILE_WEB_HOST: ${{ vars.MOBILE_WEB_HOST }}
          # M3b. `NEXT_PUBLIC_*` is inlined into the export at build time and `SentryInit` does
          # not even download the SDK when the DSN is blank, so an AAB built without this is
          # blind on every device that ever installs it and nothing about it looks wrong.
          # check-workflows.mjs used to assert only that this workflow MENTIONS the build arg,
          # in SOME job — which is how the N2 gate stayed green for months while the only
          # refusal sat in `testable`, a job that publishes nothing. It now names the job:
          # RELEASE_CONFIG requires `bundle` to refuse this and `testable` only to warn about
          # it, so the two can never swap places again. This is the path that publishes, so
          # this is where an empty DSN has to stop.
          DSN: ${{ vars.SENTRY_DSN_MOBILE }}
        run: |
          test -n "$MOBILE_API_URL" || { echo "MOBILE_API_URL is empty — the app would call http://localhost:8080; create it under Settings -> Secrets and variables -> Actions -> Variables"; exit 1; }
          test -n "$MOBILE_WEB_HOST" || { echo "MOBILE_WEB_HOST is empty — App Links would claim the placeholder domain; create it under Settings -> Secrets and variables -> Actions -> Variables"; exit 1; }
          case "$MOBILE_API_URL" in https://*) ;; *) echo "MOBILE_API_URL must be https — Android blocks cleartext"; exit 1 ;; esac
          test -n "$DSN" || {
            echo "SENTRY_DSN_MOBILE is unset, so NEXT_PUBLIC_SENTRY_DSN would be inlined EMPTY and this" >&2
            echo "AAB would be published with no error reporting at all, for the life of the binary" >&2
            echo "on every device that installs it (audit N2/M3b)." >&2
            echo "" >&2
            echo "Create it under Settings -> Secrets and variables -> Actions -> Variables:" >&2
            echo "  SENTRY_DSN_MOBILE = https://<key>@<org>.ingest.sentry.io/<project-id>" >&2
            exit 1
          }

      - name: Install workspace dependencies
        # Cap on the STEP, not only the job. A job that hits its cap is recorded as
        # `cancelled`, not failed: nothing turns red and everything gated on success —
        # Deploy, Images — skips in silence. A step cap fails the step, which fails the
        # job, which is red and says which step it was.
        timeout-minutes: 15
        run: npm ci

      - name: Install Capacitor dependencies
        # Cap on the STEP, not only the job. A job that hits its cap is recorded as
        # `cancelled`, not failed: nothing turns red and everything gated on success —
        # Deploy, Images — skips in silence. A step cap fails the step, which fails the
        # job, which is red and says which step it was.
        timeout-minutes: 15
        working-directory: mobile
        run: npm ci

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        # One file covers both binaries: it lists every app in the Firebase project and
        # the Gradle plugin picks the entry matching the applicationId being built. Never
        # committed — gitleaks scans for exactly this shape, and it names the project to
        # anyone who reads it.
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "GOOGLE_SERVICES_JSON_BASE64 is empty — push would not work in the shipped build; create it under Settings -> Secrets and variables -> Actions -> Secrets"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > mobile/android/app/google-services.json

      - name: Signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # Only the keystore FILE was checked, and the file is the half that fails loudly.
          # mobile/android/app/build.gradle attaches the release signingConfig on
          # `hydromartKeystore.exists()` alone and reads these three through `System.getenv`,
          # which is null for an unset secret — and an incomplete signingConfig makes AGP write
          # an UNSIGNED bundle to the very same `app-release.aab` path a signed one uses. So the
          # mv, the permission audit, the artifact upload and the whole run stay green, and Play
          # is the first thing that says no. Fail closed here, like the file above.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Named one per line rather than looped over `${!v}`. A refusal has to NAME the
          # variable it refuses or nothing can tell which of the four is actually guarded:
          # `for v in A B C; do test -n "${!v}"` mentions all three on a line that does not
          # exit, and exits on a line that names none of them, so check-workflows.mjs read
          # this step as guarding nothing at all (measured 2026-08-29). Four lines, four
          # answerable questions.
          WHERE="create it under Settings -> Secrets and variables -> Actions -> Secrets"
          UNSIGNED="Gradle would emit an UNSIGNED app-release.aab and this run would still be green"
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is empty — nothing would sign this release; $WHERE"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is empty — $UNSIGNED; $WHERE"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is empty — $UNSIGNED; $WHERE"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is empty — $UNSIGNED; $WHERE"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/upload.jks

      - name: Version numbers
        id: version
        # versionCode must rise on every upload Play accepts, and the run number is the
        # only counter here that never goes backwards — a tag can be deleted and re-pushed.
        #
        # N7: the run number alone was NOT enough. `run_number` does not move on a Re-run —
        # only `run_attempt` does — and a re-run is the most natural response to a publish
        # that failed after the bundle built. That rebuild produced a byte-different AAB
        # carrying a versionCode Play had already seen, and Play rejects it with no way
        # forward but a new tag. Multiplying by 100 leaves room for 99 attempts of one run
        # while staying strictly above every code published under the old scheme.
        run: |
          NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REF_NAME#mobile-v}"; fi
          ATTEMPT="${{ github.run_attempt }}"
          test "$ATTEMPT" -le 99 || { echo "run_attempt $ATTEMPT exceeds the 99 this scheme reserves; tag a new release instead"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} * 100 + ATTEMPT ))" >> "$GITHUB_OUTPUT"

      # Both exports first, on the Node version the repo pins. They land in separate
      # directories, so having both at once costs nothing.
      - name: Export both binaries
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL }}
          # N2: the APK is a FROZEN export — whatever is inlined here is what the binary
          # reports with for its whole life on a device. No DSN means no reporter at all,
          # which is the state every shipped build has been in.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_MOBILE }}
          NEXT_PUBLIC_SENTRY_ENV: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
        run: |
          npm run build:mobile --workspace @hydromart/web -- customer
          npm run build:mobile --workspace @hydromart/web -- ops

      # The Capacitor CLI refuses to run below Node 22; `.nvmrc` pins 20 because that is
      # what the services and the web build are tested against. Both constraints are real,
      # so they are satisfied in turn — exports on 20, everything below on 22. Nothing
      # after this point is JavaScript that ships.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      # The two syncs still cannot be interleaved with their builds: `cap sync` copies into
      # one shared assets directory (see mobile/android/app/build.gradle for why this
      # project uses Gradle properties rather than product flavors), so the customer AAB
      # has to be finished and out of the way before the ops export is copied over the top.
      - name: Customer — sync
        working-directory: mobile
        run: npm run sync:customer

      - name: Customer — bundle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease \
            -PhydromartAppId=id.hydromart.app \
            -PhydromartAppName=Hydromart \
            -PhydromartWebHost='${{ vars.MOBILE_WEB_HOST }}' \
            -PhydromartLinkPrefix=/products \
            -PhydromartLinkPrefix2=/orders \
            -PhydromartLinkPrefix3=/cart \
            -PhydromartLinkPrefix4=/checkout \
            -PhydromartLinkPrefix5=/account \
            -PhydromartLinkPrefix6=/promo \
            -PhydromartLinkPrefix7=/rewards \
            -PhydromartLinkPrefix8=/vouchers \
            -PhydromartLinkPrefix9=/referral \
            -PhydromartLinkPrefix10=/subscriptions \
            -PhydromartLinkPrefix11=/waralaba \
            -PhydromartLinkPrefix12=/help \
            -PhydromartLinkPrefix13=/notifications \
            -PhydromartLinkPrefix14=/addresses \
            -PhydromartLinkPrefix15=/favorites \
            -PhydromartLinkPrefix16=/login \
            -PhydromartLinkPrefix17=/register \
            -PhydromartLinkPrefix18=/kebijakan-privasi \
            -PhydromartLinkPrefix19=/hapus-akun \
            -PhydromartLinkExact=/ \
            -PhydromartVersionCode=${{ steps.version.outputs.code }} \
            -PhydromartVersionName=${{ steps.version.outputs.name }}

      # The only place the AAR-contributed permissions are visible. A plugin that quietly
      # adds READ_MEDIA_IMAGES costs weeks in Play review, and this is where it is caught
      # — after the merge, before the upload.
      - name: Customer — permission audit
        working-directory: mobile
        run: node scripts/audit-manifest.mjs android/app/build/intermediates/merged_manifests/release

      - name: Customer — keep the AAB
        run: mv mobile/android/app/build/outputs/bundle/release/app-release.aab hydromart-customer.aab

      - name: Ops — sync
        working-directory: mobile
        run: npm run sync:ops

      - name: Ops — bundle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease \
            -PhydromartAppId=id.hydromart.ops \
            -PhydromartAppName='Hydromart Ops' \
            -PhydromartWebHost='${{ vars.MOBILE_WEB_HOST }}' \
            -PhydromartLinkPrefix=/driver \
            -PhydromartLinkPrefix2=/m \
            -PhydromartVersionCode=${{ steps.version.outputs.code }} \
            -PhydromartVersionName=${{ steps.version.outputs.name }}

      - name: Ops — permission audit
        working-directory: mobile
        run: node scripts/audit-manifest.mjs android/app/build/intermediates/merged_manifests/release

      - name: Ops — keep the AAB
        run: mv mobile/android/app/build/outputs/bundle/release/app-release.aab hydromart-ops.aab

      # Kept even when the `publish` job below takes over: an artifact is what you reach
      # for when Play rejects something and you want the exact binary it rejected.
      - name: Upload the bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hydromart-aab-${{ steps.version.outputs.name }}
          path: |
            hydromart-customer.aab
            hydromart-ops.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove the signing material
        if: always()
        run: rm -f mobile/android/upload.jks mobile/android/app/google-services.json

  # Hands the two bundles to Play, once there is an account willing to take them.
  #
  # A separate job on purpose. The one above holds the upload keystore and the Firebase
  # config; this one needs neither, and a third-party action has no business running in
  # the same job as the key that signs every release. It gets the AABs through the
  # artifact and one credential of its own.
  #
  # Opt-in, and silent until then: no `PLAY_SERVICE_ACCOUNT_JSON` secret means the steps
  # below skip and the run stays green. That is the correct state until the apps exist in
  # a Play account, the listing is filled in, and the first release has been through
  # review by hand — none of which a workflow can do. `secrets` is not readable from a
  # job-level `if`, which is why the gate is a step.
  #
  # The track is `internal`, never `production`. Internal testing publishes in minutes to
  # a named list and is the only track where an automatic upload cannot reach the public
  # by accident; promoting to closed testing and beyond stays a decision someone makes in
  # the console.
  publish:
    runs-on: ubuntu-latest
    needs: bundle
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - name: Is there an account to publish to?
        id: gate
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            # `::warning::`, not `::notice::`. The skip itself is correct and stays; what was
            # wrong was how quiet it is. A notice does not surface on the run summary, so a tag
            # that published nothing and a tag that published to Play were indistinguishable at
            # a glance — and the state that produces the skip is the permanent one until
            # someone creates the secret (measured 2026-08-29: `gh secret list` does not have it).
            echo '::warning::PLAY_SERVICE_ACCOUNT_JSON is unset — NOTHING was uploaded to Play. The bundles are attached to this run as an artifact and the upload stays manual.'
          fi

      - name: Fetch the bundles
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hydromart-aab-${{ needs.bundle.outputs.version }}

      - name: Hydromart — internal track
        if: steps.gate.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: id.hydromart.app
          releaseFiles: hydromart-customer.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.rollout_status || 'completed' }}
          userFraction: ${{ github.event.inputs.rollout_status == 'inProgress' && github.event.inputs.user_fraction || '' }}

      - name: Hydromart Ops — internal track
        if: steps.gate.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: id.hydromart.ops
          releaseFiles: hydromart-ops.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.rollout_status || 'completed' }}
          userFraction: ${{ github.event.inputs.rollout_status == 'inProgress' && github.event.inputs.user_fraction || '' }}
