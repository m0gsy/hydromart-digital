apply plugin: 'com.android.application'

/**
 * Two binaries, one Android project.
 *
 * `id.hydromart.app` (customer) and `id.hydromart.ops` (staff) differ only in their
 * applicationId, their label, and which pruned web export was synced into assets — so
 * they are one source tree driven by Gradle properties rather than two copies of it, or
 * product flavors whose per-flavor asset directories `cap sync` does not write to.
 *
 *   ./gradlew bundleRelease -PhydromartAppId=id.hydromart.ops -PhydromartAppName="Hydromart Ops"
 *
 * The defaults are the customer app, so a bare `./gradlew bundleRelease` after a
 * customer sync does the obvious thing. Getting the pairing wrong is the failure this
 * cannot catch by itself — `scripts/sync.mjs` prints the matching command for that
 * reason, and CI (F6) passes both together.
 */
def hydromartAppId = project.findProperty('hydromartAppId') ?: 'id.hydromart.app'
def hydromartAppName = project.findProperty('hydromartAppName') ?: 'Hydromart'
/**
 * E6 — which of the two binaries this build is. Derived from the applicationId rather than
 * carried as its own flag, so it can never disagree with the app actually being produced.
 */
def hydromartIsOps = hydromartAppId.endsWith('.ops')
// Play rejects a re-upload of a versionCode it has already seen, so CI derives this from
// the release tag. The default only exists so a local debug build runs.
def hydromartVersionCode = (project.findProperty('hydromartVersionCode') ?: '1') as Integer
def hydromartVersionName = project.findProperty('hydromartVersionName') ?: '1.0'
/**
 * F3b, App Links. The host is deployment-specific — `WEB_DOMAIN` lives in the VPS `.env`
 * and nowhere in this repo — so CI passes it and the default below is only a placeholder
 * that lets a local build compile. A wrong host does not break the app; Android simply
 * fails to verify it and links open in the browser as they do today.
 *
 * `hydromartLinkPrefix` keeps the two binaries from both claiming the same URLs on a
 * staff phone that has both. See the intent-filter comment in AndroidManifest.xml.
 */
def hydromartWebHost = project.findProperty('hydromartWebHost') ?: 'hydromart.id'
def hydromartLinkPrefix = project.findProperty('hydromartLinkPrefix') ?: '/'
// Second claimed path prefix. The Ops binary needs two (`/driver` and `/m`); everything
// else repeats the first, which Android treats as one claim.
def hydromartLinkPrefix2 = project.findProperty('hydromartLinkPrefix2') ?: hydromartLinkPrefix
def hydromartKeystore = rootProject.file('upload.jks')

android {
    namespace = "id.hydromart.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId hydromartAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode hydromartVersionCode
        versionName hydromartVersionName

        // Generated here rather than in res/values/strings.xml, which no longer declares
        // them: Capacitor reads package_name and custom_url_scheme at runtime, and both
        // have to follow the applicationId this build is actually producing.
        resValue "string", "app_name", hydromartAppName
        resValue "string", "title_activity_main", hydromartAppName
        resValue "string", "package_name", hydromartAppId
        resValue "string", "custom_url_scheme", hydromartAppId
        manifestPlaceholders = [
            webHost: hydromartWebHost,
            linkPrefix: hydromartLinkPrefix,
            linkPrefix2: hydromartLinkPrefix2,
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * F6. The upload keystore is written by CI from a secret and deleted afterwards, so
     * it is absent on a developer's machine and on every PR — hence the `exists()` guard.
     * Without it a plain `./gradlew build` here would fail on a file that is deliberately
     * not in the repo. The passwords come from the environment for the same reason: a
     * `keystore.properties` on disk is one `git add -A` away from being public, and
     * `.gitignore` already lists it as a second line of defence.
     */
    signingConfigs {
        release {
            if (hydromartKeystore.exists()) {
                storeFile hydromartKeystore
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hydromartKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            // F1c's supporting lever. Safe with Capacitor: plugins are found by class
            // name at runtime from capacitor.plugins.json, which R8 cannot see — but
            // capacitor-android ships `consumerProguardFiles` keeping every
            // `@CapacitorPlugin` class and its `@PluginMethod`s, so the reflection still
            // resolves. Verified in that file rather than assumed.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

/**
 * E6 — the customer app must not ask for permissions only the ops app uses.
 *
 * Measured on a built APK before this existed: `id.hydromart.app` shipped `CAMERA` and
 * `ACCESS_FINE_LOCATION`. `docs/MOBILE_PLAY_STORE.md` justifies both, but every reason it
 * gives is an OPS reason — "foto bukti kirim & absen wajah", "posisi kurir selama antaran".
 * The customer app has no screen that opens a camera (the avatar picker goes through the
 * system photo picker, which needs no permission) and only needs a rough position to pick
 * the nearest depot. Both are permissions a Play reviewer asks you to justify in writing.
 *
 * Why a manifest TRANSFORM and not something simpler:
 *
 *  - `tools:node="${placeholder}"` does not work. The manifest merger resolves `tools:node`
 *    BEFORE placeholder substitution and fails with
 *    `No enum constant com.android.manifmerger.NodeOperationType.${CAMERA_NODE}`.
 *    Tried, proven, discarded — do not spend the afternoon on it again.
 *  - Product flavours would work, but `cap sync` writes the web export into
 *    `src/main/assets` and does not know about per-flavour asset directories (see the
 *    comment at the top of this file). Flavours would also rename every Gradle task and
 *    silently break `mobile.yml`.
 *
 * So the merged manifest is rewritten after the merger has finished with it. The task
 * FAILS if a permission it was told to strip is not there: a strip that silently does
 * nothing because AGP changed its output format would be invisible until a Play reviewer
 * found it, which is the whole failure this is here to prevent.
 */
abstract class StripCustomerOnlyPermissions extends DefaultTask {
    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.file.RegularFileProperty getMergedManifest()

    @org.gradle.api.tasks.OutputFile
    abstract org.gradle.api.file.RegularFileProperty getUpdatedManifest()

    @org.gradle.api.tasks.Input
    abstract org.gradle.api.provider.ListProperty<String> getPermissions()

    @org.gradle.api.tasks.TaskAction
    void strip() {
        def text = mergedManifest.get().asFile.text
        permissions.get().each { name ->
            // The merged manifest is machine-generated, so the element is a predictable
            // self-closing tag. Matched by its android:name to avoid touching a neighbour.
            def pattern = ~/(?m)^[ \t]*<uses-permission[^>]*android:name="${java.util.regex.Pattern.quote(name)}"[^>]*\/>\r?\n?/
            if (!(text =~ pattern)) {
                throw new GradleException(
                    "E6: expected to strip ${name} from the merged manifest, but no such " +
                    "<uses-permission> is there. Either it stopped being declared (delete " +
                    "it from this list) or AGP changed its output shape (fix the pattern). " +
                    "Failing loudly rather than shipping a strip that does nothing.")
            }
            text = text.replaceAll(pattern, '')
        }
        updatedManifest.get().asFile.text = text
    }
}

if (!hydromartIsOps) {
    androidComponents {
        onVariants(selector().all()) { variant ->
            def strip = tasks.register(
                "strip${variant.name.capitalize()}CustomerOnlyPermissions",
                StripCustomerOnlyPermissions,
            ) {
                permissions.set([
                    'android.permission.CAMERA',
                    'android.permission.ACCESS_FINE_LOCATION',
                ])
            }
            variant.artifacts
                .use(strip)
                .wiredWithFiles(
                    { it.getMergedManifest() },
                    { it.getUpdatedManifest() },
                )
                .toTransform(com.android.build.api.artifact.SingleArtifact.MERGED_MANIFEST.INSTANCE)
        }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
