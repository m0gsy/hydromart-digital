// The staff binary ships the thermal-printer plugin, whose bundled Star SDK needs API 26;
// the customer binary does not include that plugin (see capacitor.config.ts), so it keeps
// 24 and loses no device. Keyed off the same property app/build.gradle derives hydromartIsOps
// from, so the two cannot disagree about which binary this is.
def hydromartIsOpsBuild = (project.findProperty('hydromartAppId') ?: '').toString().endsWith('.ops')

ext {
    minSdkVersion = hydromartIsOpsBuild ? 26 : 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}